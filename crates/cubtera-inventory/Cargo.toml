[package]
name = "cubtera-inventory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cubtera v3 native FS adapters for cubtera-app's InventoryPort/UnitPort - a from-scratch port of v2's FsInventoryRepository/FsUnitRepository naming convention, with no dependency on cubtera-core/cubtera-persistence."

[dependencies]
cubtera-app.workspace = true
cubtera-model.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "rt"] }
tracing.workspace = true

[dev-dependencies]
cubtera-kernel.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
