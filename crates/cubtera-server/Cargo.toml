[package]
name = "cubtera-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Cubtera v3 HTTP API server: authn/authz + plan/apply/explain/state over cubtera-app, so unlike cubtera-api it can actually run units, not just read the inventory."

[[bin]]
name = "cubtera-server"
path = "src/main.rs"

