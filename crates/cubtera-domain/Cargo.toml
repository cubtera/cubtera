[package]
name = "cubtera-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cubtera domain layer - business logic entities and value objects"

[dependencies]
# Minimal dependencies for domain types - all treated as data formats
# (like String or Vec<u8>), not infrastructure concerns.
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
handlebars.workspace = true
jsonschema.workspace = true
# v3 seam (docs/specs/2026-09-03-cubtera-v3-architecture.md): validated
# identity types at every path-constructing boundary (temp folder,
# unit-state key, spec.files destinations). Zero I/O, zero async, so it
# doesn't violate this crate's own dependency rule.
cubtera-kernel.workspace = true

