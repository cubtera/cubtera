[package]
name = "cubtera-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cubtera MCP server - exposes inventory/unit/deployment-log queries as Model Context Protocol tools"

[[bin]]
name = "cubtera-mcp"
path = "src/main.rs"

[dependencies]
cubtera-domain.workspace = true
cubtera-core.workspace = true
cubtera-config.workspace = true
cubtera-persistence = { workspace = true, features = ["mongodb"] }

rmcp.workspace = true
schemars.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
