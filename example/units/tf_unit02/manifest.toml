dimensions = ["dc"]
allowList = ["dc:stg1-use2"] # allowList entries are "type:name" keys
type = "tf"

# spec.env_vars is parsed into the manifest schema but not yet consumed by
# the run pipeline (Unit::materialize only reads spec.files) - kept here,
# commented out, purely to document the intended schema shape.
# [spec.env_vars.optional]
# change_nat_ips = "CHANGE_NAT_IPS"
# [spec.env_vars.required]
# my_home = "PWD"

[spec.files.optional]
"example/units/tf_unit02/greeting.txt" = "greeting.txt" # project-relative include, copied verbatim into the temp folder

#[state] # optional, override global state backend configuration

[runner]
version = "1.6.6" # if not set and runner_command is not set, it will run latest tf version
# runner_command =  "terraform" # if defined - version will be ignored
# extra_args = "--auto-approve" # default => None | extra arguments for the runner_command
state_backend = "local" # state backend for the runner defined in config.toml, default is local
# inlet_command = "ls -la" # default => None, will run command before runner_command starts, in temp folder context
# outlet_command = "" # default => None, will run command after runner_command finishes successfully, in temp folder context

# Publish this unit's `terraform output -json` (flattened to {name: value})
# to the UnitStateRepository after a successful apply/destroy, so other
# units can read it back via [inputs.<alias>] - see bash_unit01's manifest
# for the consumer side of this same example.
[outputs]
publish = true
