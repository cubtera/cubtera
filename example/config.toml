# Cubtera v2 config schema: a `[default]` table plus one table per org
# (matched by name), whose fields override `[default]`'s for that org.
# All fields are optional; values shown here are the effective defaults
# unless noted otherwise. Keys accept either camelCase or snake_case.

[default]
inventoryPath = "example/inventory" # default => "inventory"
unitsPath = "example/units" # default => "units"
modulesPath = "example/modules" # default => "modules"
pluginsPath = "example/plugins" # default => "plugins"
tempFolderPath = "example/.cubtera/tmp" # default => "~/.cubtera/temp"
deploymentLogPath = "example/.cubtera/dlog" # default => "~/.cubtera/dlog" | fs-jsonl DeploymentLogRepository root, used unless [deploymentLog] below is set
unitStatePath = "example/.cubtera/state" # default => "~/.cubtera/state" | fs-json UnitStateRepository root ({org}/{unit}/{dims}/{ext}/outputs.json), used unless [unitState] below is set

dimRelations = ["dome", "env", "dc"] # default => ["dome", "env", "dc"]
orgs = ["cubtera", "teracub"] # known orgs; first one is used when CUBTERA_ORG isn't set
fileNameSeparator = ":" # separator between an inventory/unit name and its section/include suffix

# Useful for development and CI/CD
alwaysCopyFiles = true # default => false | copy files to the runner's temp folder even without init
cleanCache = false # default => false | clean the runner's temp folder after a successful run

[cubtera] # per-org overrides, merged on top of [default]
# usefull for multiple orgs management in the same workspace

# "s3" is only here to illustrate the schema for a real cloud state backend -
# it needs real AWS credentials at `terraform init` and no example unit uses
# it. Every example unit either overrides `state_backend = "local"` in its
# own manifest, or (tofu units) never gets a rendered backend file at all -
# `OpenTofuRunner` doesn't implement `extend_plan` yet.
[cubtera.state.s3] # global org template for the "s3" state backend; handlebars-rendered per run
bucket = "{{org}}-example-state"
key = "{{dim_tree}}/{{unit_name}}.tfstate"
region = "us-east-1"

[cubtera.state.local] # global org template for the "local" state backend
path = "~/.cubtera/state/{{org}}/{{dim_tree}}/{{unit_name}}.tfstate"

[cubtera.runner.tf] # global defaults for the "tf" runner; a unit's own manifest.runner overrides these
state_backend = "local" # used when the unit manifest doesn't set its own [state] table - "local" keeps the example credential-free by default

inlet_command = "echo Inlet command" # runs before the runner starts, in temp folder context
outlet_command = "echo Outlet command" # runs after the runner finishes successfully, in temp folder context

# version = "1.7.0" # default => latest; ignored if runner_command is set
# runner_command = "terraform" # default => None; run this binary instead of the built-in tfswitch resolution
# extra_args = "-json" # default => None; extra CLI args appended to the runner command

# BashRunner always executes the single `*.sh` file it finds in the unit's
# temp folder - it ignores `runner_command`/`version`/`extra_args` entirely,
# so there's no meaningful `[cubtera.runner.bash]` override to set here.

# Uncomment to switch DeploymentLogRepository from fs-jsonl (deploymentLogPath
# above) to MongoDB - all orgs share this database/collection, distinguished
# by each entry's own "org" field.
# [cubtera.deploymentLog]
# connectionString = "mongodb://localhost:27017" # required
# database = "cubtera" # default => "cubtera"
# collection = "deployments" # default => "deployments"

# Uncomment to switch UnitStateRepository (cross-unit [outputs]/[inputs]
# state exchange) from fs-json (unitStatePath above) to MongoDB - all orgs
# share this database/collection, distinguished by each entry's own "org"
# field.
# [cubtera.unitState]
# connectionString = "mongodb://localhost:27017" # required
# database = "cubtera" # default => "cubtera"
# collection = "unit_state" # default => "unit_state"
