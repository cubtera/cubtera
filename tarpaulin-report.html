onfig);\n    let env_datasource = JsonDataSource::new_with_config(\"cubtera\", \"env\", \u0026config);\n    let dome_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dome\", \u0026config);\n    \n    // Get dimension data\n    let dc_data = dc_datasource.get_data_by_name_safe(\"prod-use1\").unwrap();\n    let env_data = env_datasource.get_data_by_name_safe(\"prod\").unwrap();\n    let dome_data = dome_datasource.get_data_by_name_safe(\"prod\").unwrap();\n    \n    // Verify parent relationships\n    assert_eq!(dc_data[\"meta\"][\"parent\"], \"env:prod\");\n    assert_eq!(env_data[\"meta\"][\"parent\"], \"dome:prod\");\n    \n    // Verify data propagation\n    assert_eq!(env_data[\"meta\"][\"prod\"], true);\n    assert_eq!(dome_data[\"meta\"][\"account_id\"], \"1111111111\");\n    assert_eq!(dc_data[\"meta\"][\"vpc_cidr\"], \"10.11.0.0/16\");\n}\n\n#[test]\nfn test_dimension_tree_traversal() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test complete dimension tree: dome -\u003e env -\u003e dc -\u003e service -\u003e mongodb\n    let service_datasource = JsonDataSource::new_with_config(\"cubtera\", \"service\", \u0026config);\n    let mongodb_datasource = JsonDataSource::new_with_config(\"cubtera\", \"mongodb\", \u0026config);\n    \n    // Get service dimension\n    let admin_service = service_datasource.get_data_by_name_safe(\"admin\").unwrap();\n    assert_eq!(admin_service[\"name\"], \"admin\");\n    \n    // Get mongodb dimension  \n    let users_mongodb = mongodb_datasource.get_data_by_name_safe(\"users\").unwrap();\n    assert_eq!(users_mongodb[\"name\"], \"users\");\n    assert_eq!(users_mongodb[\"meta\"][\"owner\"], \"team1\");\n    \n    // Test different environments for same service\n    let orders_mongodb = mongodb_datasource.get_data_by_name_safe(\"orders\").unwrap();\n    assert_eq!(orders_mongodb[\"meta\"][\"owner\"], \"team2\");\n}\n\n#[test]\nfn test_regional_dimension_variations() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Test US East regions\n    let prod_use1 = dc_datasource.get_data_by_name_safe(\"prod-use1\").unwrap();\n    let prod_use2 = dc_datasource.get_data_by_name_safe(\"prod-use2\").unwrap();\n    \n    assert_eq!(prod_use1[\"meta\"][\"vpc_cidr\"], \"10.11.0.0/16\");\n    assert_eq!(prod_use2[\"meta\"][\"vpc_cidr\"], \"10.12.0.0/16\");\n    \n    // Test EU regions\n    let prod_euw1 = dc_datasource.get_data_by_name_safe(\"prod-euw1\").unwrap();\n    assert_eq!(prod_euw1[\"meta\"][\"region\"], \"eu-west-1\");\n    assert_eq!(prod_euw1[\"meta\"][\"vpc_cidr\"], \"10.10.0.0/16\");\n    \n    // Test staging regions\n    let stg1_use2 = dc_datasource.get_data_by_name_safe(\"stg1-use2\").unwrap();\n    let stg2_euw1 = dc_datasource.get_data_by_name_safe(\"stg2-euw1\").unwrap();\n    let stg2_euw2 = dc_datasource.get_data_by_name_safe(\"stg2-euw2\").unwrap();\n    \n    assert_eq!(stg1_use2[\"meta\"][\"parent\"], \"env:stg1\");\n    assert_eq!(stg2_euw1[\"meta\"][\"parent\"], \"env:stg2\");\n    assert_eq!(stg2_euw2[\"meta\"][\"parent\"], \"env:stg2\");\n}\n\n#[test]\nfn test_environment_type_consistency() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let env_datasource = JsonDataSource::new_with_config(\"cubtera\", \"env\", \u0026config);\n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Test production environment\n    let prod_env = env_datasource.get_data_by_name_safe(\"prod\").unwrap();\n    assert_eq!(prod_env[\"meta\"][\"prod\"], true);\n    \n    // Test that all prod DCs reference prod env\n    let prod_dcs = [\"prod-use1\", \"prod-use2\", \"prod-euw1\"];\n    for dc_name in prod_dcs {\n        let dc_data = dc_datasource.get_data_by_name_safe(dc_name).unwrap();\n        assert_eq!(dc_data[\"meta\"][\"parent\"], \"env:prod\", \n                   \"DC {} should reference env:prod\", dc_name);\n    }\n    \n    // Test staging environments\n    let stg_envs = [\"stg1\", \"stg2\"];\n    for env_name in stg_envs {\n        let env_data = env_datasource.get_data_by_name_safe(env_name).unwrap();\n        assert_eq!(env_data[\"meta\"][\"parent\"], \"dome:stg\",\n                   \"Env {} should reference dome:stg\", env_name);\n    }\n    \n    // Test management environment\n    let mgmt_env = env_datasource.get_data_by_name_safe(\"mgmt\").unwrap();\n    assert_eq!(mgmt_env[\"meta\"][\"parent\"], \"dome:mgmt\");\n    \n    let mgmt_dc = dc_datasource.get_data_by_name_safe(\"mgmt-use2\").unwrap();\n    assert_eq!(mgmt_dc[\"meta\"][\"parent\"], \"env:mgmt\");\n}\n\n#[test]\nfn test_default_value_inheritance() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    let env_datasource = JsonDataSource::new_with_config(\"cubtera\", \"env\", \u0026config);\n    \n    // Test DC defaults\n    let defaults_dc = dc_datasource.get_data_by_name_safe(\".default\").unwrap();\n    if defaults_dc.get(\"meta\").is_some() {\n        assert_eq!(defaults_dc[\"meta\"][\"region\"], \"us-east-1\");\n    }\n    \n    // Test ENV defaults  \n    let defaults_env = env_datasource.get_data_by_name_safe(\".default\").unwrap();\n    if defaults_env.get(\"meta\").is_some() {\n        assert_eq!(defaults_env[\"meta\"][\"prod\"], false);\n    }\n    \n    // Test that dimensions without explicit values might inherit defaults\n    // This tests current behavior - actual default merging might be in different layer\n    let mgmt_dc = dc_datasource.get_data_by_name_safe(\"mgmt-use2\").unwrap();\n    // mgmt-use2.json only has parent and vpc_cidr, region should come from defaults\n    // In current implementation, defaults are not auto-merged, but this tests the structure\n    assert!(mgmt_dc.get(\"name\").is_some());\n    assert!(mgmt_dc.get(\"meta\").is_some());\n}\n\n#[test]\nfn test_dimension_data_types() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Test dimension with additional data types\n    let stg1_use2 = dc_datasource.get_data_by_name_safe(\"stg1-use2\").unwrap();\n    \n    // Should have meta type\n    assert!(stg1_use2.get(\"meta\").is_some());\n    assert_eq!(stg1_use2[\"meta\"][\"parent\"], \"env:stg1\");\n    \n    // Should have test type from stg1-use2:test.json\n    if stg1_use2.get(\"test\").is_some() {\n        assert_eq!(stg1_use2[\"test\"][\"test#2\"], \"should be\");\n    }\n    \n    // Test that file patterns with # are handled\n    // Note: stg1-use2#test.txt exists but might not be processed as JSON\n}\n\n#[test]\nfn test_service_team_ownership() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let service_datasource = JsonDataSource::new_with_config(\"cubtera\", \"service\", \u0026config);\n    let mongodb_datasource = JsonDataSource::new_with_config(\"cubtera\", \"mongodb\", \u0026config);\n    \n    // Test service ownership\n    let admin_service = service_datasource.get_data_by_name_safe(\"admin\").unwrap();\n    let order_service = service_datasource.get_data_by_name_safe(\"order\").unwrap();\n    \n    // Admin service owned by team1 and team2\n    if let Some(owners) = admin_service[\"meta\"][\"owners\"].as_array() {\n        assert_eq!(owners.len(), 2);\n        assert!(owners.contains(\u0026json!(\"team1\")));\n        assert!(owners.contains(\u0026json!(\"team2\")));\n    }\n    \n    // Order service owned by finance_team\n    if let Some(owners) = order_service[\"meta\"][\"owners\"].as_array() {\n        assert_eq!(owners.len(), 1);\n        assert!(owners.contains(\u0026json!(\"finance_team\")));\n    }\n    \n    // Test mongodb ownership alignment\n    let users_mongodb = mongodb_datasource.get_data_by_name_safe(\"users\").unwrap();\n    let orders_mongodb = mongodb_datasource.get_data_by_name_safe(\"orders\").unwrap();\n    \n    assert_eq!(users_mongodb[\"meta\"][\"owner\"], \"team1\");\n    assert_eq!(orders_mongodb[\"meta\"][\"owner\"], \"team2\");\n}\n\n#[test]\nfn test_environment_specific_configurations() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let mongodb_datasource = JsonDataSource::new_with_config(\"cubtera\", \"mongodb\", \u0026config);\n    let service_datasource = JsonDataSource::new_with_config(\"cubtera\", \"service\", \u0026config);\n    \n    // Test mongodb environment-specific sizes\n    let users_mongodb = mongodb_datasource.get_data_by_name_safe(\"users\").unwrap();\n    if users_mongodb[\"meta\"].get(\"prod\").is_some() {\n        assert_eq!(users_mongodb[\"meta\"][\"prod\"][\"size\"], \"M20\");\n    }\n    \n    let orders_mongodb = mongodb_datasource.get_data_by_name_safe(\"orders\").unwrap();\n    if orders_mongodb[\"meta\"].get(\"prod\").is_some() {\n        assert_eq!(orders_mongodb[\"meta\"][\"prod\"][\"size\"], \"M80\");\n    }\n    if orders_mongodb[\"meta\"].get(\"stg\").is_some() {\n        assert_eq!(orders_mongodb[\"meta\"][\"stg\"][\"size\"], \"M10\");\n    }\n    \n    // Test service environment-specific configuration\n    if service_datasource.get_data_by_name_safe(\".default\").is_ok() {\n        let default_service = service_datasource.get_data_by_name_safe(\".default\").unwrap();\n        if default_service.get(\"manifest\").is_some() {\n            let manifest = \u0026default_service[\"manifest\"];\n            if manifest.get(\"prod\").is_some() {\n                assert_eq!(manifest[\"prod\"][\"min_capacity\"], 2);\n                assert_eq!(manifest[\"prod\"][\"max_capacity\"], 10);\n            }\n            if manifest.get(\"stg\").is_some() {\n                assert_eq!(manifest[\"stg\"][\"min_capacity\"], 1);\n                assert_eq!(manifest[\"stg\"][\"max_capacity\"], 2);\n            }\n        }\n    }\n}\n\n#[test]\nfn test_cross_dimension_consistency() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test that dimension hierarchy is consistent across types\n    let dome_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dome\", \u0026config);\n    let env_datasource = JsonDataSource::new_with_config(\"cubtera\", \"env\", \u0026config);\n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Get all dimension names for each type\n    let dome_names = dome_datasource.get_all_names_safe().unwrap();\n    let env_names = env_datasource.get_all_names_safe().unwrap();\n    let dc_names = dc_datasource.get_all_names_safe().unwrap();\n    \n    // Verify that referenced parents exist\n    for env_name in \u0026env_names {\n        let env_data = env_datasource.get_data_by_name_safe(env_name).unwrap();\n        if let Some(parent) = env_data[\"meta\"][\"parent\"].as_str() {\n            if parent.starts_with(\"dome:\") {\n                let dome_name = parent.strip_prefix(\"dome:\").unwrap();\n                assert!(dome_names.contains(\u0026dome_name.to_string()),\n                        \"Env {} references dome:{} which should exist\", env_name, dome_name);\n            }\n        }\n    }\n    \n    for dc_name in \u0026dc_names {\n        let dc_data = dc_datasource.get_data_by_name_safe(dc_name).unwrap();\n        if let Some(parent) = dc_data[\"meta\"][\"parent\"].as_str() {\n            if parent.starts_with(\"env:\") {\n                let env_name = parent.strip_prefix(\"env:\").unwrap();\n                assert!(env_names.contains(\u0026env_name.to_string()),\n                        \"DC {} references env:{} which should exist\", dc_name, env_name);\n            }\n        }\n    }\n}\n\n#[test]\nfn test_dimension_builder_integration() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test that we can build dimension objects from real data\n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // This tests the integration between data extraction and dimension building\n    let dc_data = dc_datasource.get_data_by_name_safe(\"prod-use1\").unwrap();\n    \n    // Verify structure for dimension building\n    assert!(dc_data.get(\"name\").is_some());\n    assert!(dc_data.get(\"meta\").is_some());\n    \n    // Test that data is properly structured for downstream processing\n    assert!(dc_data[\"name\"].is_string());\n    assert!(dc_data[\"meta\"].is_object());\n    \n    if let Some(parent) = dc_data[\"meta\"][\"parent\"].as_str() {\n        assert!(parent.contains(\":\"), \"Parent should be in type:name format\");\n    }\n} ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","tests","integration","inventory_integration_tests.rs"],"content":"use cubtera::core::dim::data::{JsonDataSource, DataSourceConfig, DataSource};\nuse serde_json::json;\nuse std::path::PathBuf;\n\n/// Test inventory structure using real example data\n#[test]\nfn test_example_inventory_structure() {\n    let example_path = \"example/inventory\";\n    \n    // Test that example inventory exists and has expected structure\n    assert!(PathBuf::from(example_path).exists(), \"Example inventory should exist\");\n    \n    // Test org directories\n    let orgs = [\"cubtera\", \"teracub\", \"cubtera_light\"];\n    for org in orgs {\n        let org_path = PathBuf::from(example_path).join(org);\n        assert!(org_path.exists(), \"Org directory {} should exist\", org);\n        assert!(org_path.is_dir(), \"Org {} should be a directory\", org);\n    }\n    \n    // Test dimension types in cubtera org\n    let dim_types = [\"dome\", \"env\", \"dc\", \"service\", \"mongodb\", \"postgres\"];\n    for dim_type in dim_types {\n        let dim_path = PathBuf::from(example_path).join(\"cubtera\").join(dim_type);\n        assert!(dim_path.exists(), \"Dimension type {} should exist\", dim_type);\n        assert!(dim_path.is_dir(), \"Dimension type {} should be a directory\", dim_type);\n    }\n}\n\n#[test]\nfn test_real_dimension_data_extraction() {\n    // Use real example data with custom config pointing to example inventory\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test DC dimension extraction\n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Test getting specific dimension\n    let prod_use1_result = dc_datasource.get_data_by_name_safe(\"prod-use1\").unwrap();\n    \n    assert_eq!(prod_use1_result[\"name\"], \"prod-use1\");\n    assert_eq!(prod_use1_result[\"meta\"][\"parent\"], \"env:prod\");\n    assert_eq!(prod_use1_result[\"meta\"][\"vpc_cidr\"], \"10.11.0.0/16\");\n    \n    // Test getting all DC names\n    let dc_names = dc_datasource.get_all_names_safe().unwrap();\n    let expected_names = [\"prod-use1\", \"stg1-use2\", \"stg2-euw2\", \"prod-use2\", \"mgmt-use2\", \"preprod-use2\", \"prod-euw1\", \"stg2-euw1\"];\n    \n    for expected_name in expected_names {\n        assert!(dc_names.contains(\u0026expected_name.to_string()), \n                \"DC names should contain {}\", expected_name);\n    }\n}\n\n#[test]\nfn test_dimension_hierarchy_resolution() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test environment dimension\n    let env_datasource = JsonDataSource::new_with_config(\"cubtera\", \"env\", \u0026config);\n    let prod_env = env_datasource.get_data_by_name_safe(\"prod\").unwrap();\n    \n    assert_eq!(prod_env[\"name\"], \"prod\");\n    assert_eq!(prod_env[\"meta\"][\"parent\"], \"dome:prod\");\n    assert_eq!(prod_env[\"meta\"][\"prod\"], true);\n    \n    // Test dome dimension\n    let dome_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dome\", \u0026config);\n    let prod_dome = dome_datasource.get_data_by_name_safe(\"prod\").unwrap();\n    \n    assert_eq!(prod_dome[\"name\"], \"prod\");\n    assert_eq!(prod_dome[\"meta\"][\"account_id\"], \"1111111111\");\n    \n    // Test staging hierarchy\n    let stg_env = env_datasource.get_data_by_name_safe(\"stg1\").unwrap();\n    assert_eq!(stg_env[\"meta\"][\"parent\"], \"dome:stg\");\n    \n    let stg_dome = dome_datasource.get_data_by_name_safe(\"stg\").unwrap();\n    assert_eq!(stg_dome[\"meta\"][\"account_id\"], \"2222222222\");\n}\n\n#[test]\nfn test_default_values_processing() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test default values in DC\n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Get a dimension and check if defaults are applied\n    let dc_data = dc_datasource.get_data_by_name_safe(\"prod-use1\").unwrap();\n    \n    // The prod-use1.json doesn't have region, but .default:meta.json should provide it\n    // Note: This tests the current behavior - defaults might need separate processing\n    \n    // Test that we can access default files directly\n    let defaults_result = dc_datasource.get_data_by_name_safe(\".default\").unwrap();\n    assert_eq!(defaults_result[\"name\"], \".default\");\n    \n    if defaults_result.get(\"meta\").is_some() {\n        assert_eq!(defaults_result[\"meta\"][\"region\"], \"us-east-1\");\n    }\n}\n\n#[test]\nfn test_complex_file_naming_patterns() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Test dimension with additional data types\n    let stg1_use2_result = dc_datasource.get_data_by_name_safe(\"stg1-use2\").unwrap();\n    \n    assert_eq!(stg1_use2_result[\"name\"], \"stg1-use2\");\n    \n    // Should have meta type from stg1-use2.json\n    assert_eq!(stg1_use2_result[\"meta\"][\"parent\"], \"env:stg1\");\n    assert_eq!(stg1_use2_result[\"meta\"][\"vpc_cidr\"], \"10.21.0.0/16\");\n    \n    // Should have test type from stg1-use2:test.json\n    if stg1_use2_result.get(\"test\").is_some() {\n        assert_eq!(stg1_use2_result[\"test\"][\"test#2\"], \"should be\");\n    }\n}\n\n#[test]\nfn test_multi_org_support() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test cubtera org\n    let cubtera_dc = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    let cubtera_names = cubtera_dc.get_all_names_safe().unwrap();\n    assert!(!cubtera_names.is_empty(), \"Cubtera should have DC dimensions\");\n    \n    // Test teracub org (if it has data)\n    let teracub_dc = JsonDataSource::new_with_config(\"teracub\", \"dc\", \u0026config);\n    let _teracub_names = teracub_dc.get_all_names_safe(); // Might be empty, that's ok\n    \n    // Test that orgs are isolated\n    let cubtera_data = cubtera_dc.get_data_by_name_safe(\"prod-use1\");\n    let teracub_data = teracub_dc.get_data_by_name_safe(\"prod-use1\");\n    \n    assert!(cubtera_data.is_ok(), \"Cubtera should have prod-use1\");\n    // teracub might not have this dimension, which is expected\n}\n\n#[test]\nfn test_service_and_mongodb_dimensions() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    // Test service dimensions\n    let service_datasource = JsonDataSource::new_with_config(\"cubtera\", \"service\", \u0026config);\n    let service_names = service_datasource.get_all_names_safe().unwrap();\n    \n    assert!(service_names.contains(\u0026\"admin\".to_string()), \"Should have admin service\");\n    assert!(service_names.contains(\u0026\"order\".to_string()), \"Should have order service\");\n    \n    let admin_service = service_datasource.get_data_by_name_safe(\"admin\").unwrap();\n    assert_eq!(admin_service[\"name\"], \"admin\");\n    \n    // Check owners array\n    if let Some(owners) = admin_service[\"meta\"][\"owners\"].as_array() {\n        assert!(owners.contains(\u0026json!(\"team1\")));\n        assert!(owners.contains(\u0026json!(\"team2\")));\n    }\n    \n    // Test mongodb dimensions\n    let mongodb_datasource = JsonDataSource::new_with_config(\"cubtera\", \"mongodb\", \u0026config);\n    let mongodb_names = mongodb_datasource.get_all_names_safe().unwrap();\n    \n    assert!(mongodb_names.contains(\u0026\"users\".to_string()), \"Should have users mongodb\");\n    assert!(mongodb_names.contains(\u0026\"orders\".to_string()), \"Should have orders mongodb\");\n    \n    let users_mongodb = mongodb_datasource.get_data_by_name_safe(\"users\").unwrap();\n    assert_eq!(users_mongodb[\"name\"], \"users\");\n    assert_eq!(users_mongodb[\"meta\"][\"owner\"], \"team1\");\n    \n    if users_mongodb[\"meta\"].get(\"prod\").is_some() {\n        assert_eq!(users_mongodb[\"meta\"][\"prod\"][\"size\"], \"M20\");\n    }\n}\n\n#[test]\nfn test_schema_and_default_files() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Test that schema files exist in directory but are not included in dimension data\n    let dc_dir = PathBuf::from(\"example/inventory/cubtera/dc\");\n    assert!(dc_dir.join(\".schema:meta.json\").exists(), \"Schema file should exist\");\n    \n    // Test default files\n    assert!(dc_dir.join(\".default:meta.json\").exists(), \"Default meta file should exist\");\n    \n    // Test various file patterns exist\n    assert!(dc_dir.join(\"stg1-use2:test.json\").exists(), \"Type-specific file should exist\");\n    assert!(dc_dir.join(\"stg1-use2#test.txt\").exists(), \"Hash-pattern file should exist\");\n    assert!(dc_dir.join(\".default#test.json\").exists(), \"Default hash-pattern file should exist\");\n}\n\n#[test]\nfn test_error_handling_with_real_data() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let dc_datasource = JsonDataSource::new_with_config(\"cubtera\", \"dc\", \u0026config);\n    \n    // Test non-existent dimension\n    let nonexistent = dc_datasource.get_data_by_name_safe(\"nonexistent-dimension\").unwrap();\n    assert_eq!(nonexistent[\"name\"], \"nonexistent-dimension\");\n    assert_eq!(nonexistent.as_object().unwrap().len(), 1); // Only name field\n    \n    // Test non-existent org\n    let bad_org_datasource = JsonDataSource::new_with_config(\"nonexistent-org\", \"dc\", \u0026config);\n    let result = bad_org_datasource.get_all_names_safe();\n    assert!(result.is_err(), \"Should error for non-existent org\");\n    \n    // Test non-existent dimension type\n    let bad_type_datasource = JsonDataSource::new_with_config(\"cubtera\", \"nonexistent-type\", \u0026config);\n    let result = bad_type_datasource.get_all_names_safe();\n    assert!(result.is_err(), \"Should error for non-existent dimension type\");\n}\n\n#[test]\nfn test_all_dimension_types_have_data() {\n    let config = DataSourceConfig::new(\n        \"example/inventory\".to_string(),\n        \":\".to_string(),\n        None,\n    );\n    \n    let dim_types = [\"dome\", \"env\", \"dc\", \"service\", \"mongodb\", \"postgres\"];\n    \n    for dim_type in dim_types {\n        let datasource = JsonDataSource::new_with_config(\"cubtera\", dim_type, \u0026config);\n        let names = datasource.get_all_names_safe().unwrap();\n        \n        assert!(!names.is_empty(), \"Dimension type {} should have at least one dimension\", dim_type);\n        \n        // Test that we can load data for each dimension\n        for name in \u0026names {\n            let data = datasource.get_data_by_name_safe(name).unwrap();\n            assert_eq!(data[\"name\"], name.as_str());\n            \n            // Each dimension should have at least name and meta\n            assert!(data.get(\"name\").is_some(), \"Dimension {} should have name\", name);\n            // Note: meta might be empty object, that's ok\n        }\n    }\n} ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","tests","integration","main.rs"],"content":"mod runner_integration_tests;\nmod inventory_integration_tests;\nmod dimension_integration_tests; ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","tests","integration","runner_integration_tests.rs"],"content":"use cubtera::core::runner::*;\nuse cubtera::core::unit::Manifest;\nuse cubtera::core::runner::params::RunnerParams;\nuse serde_json::json;\nuse std::collections::HashMap;\nuse std::fs;\nuse std::path::PathBuf;\nuse tempfile::TempDir;\n\n// Helper struct to create test units\nstruct TestUnitBuilder {\n    name: String,\n    unit_type: String,\n    temp_dir: TempDir,\n    runner_params: Option\u003cHashMap\u003cString, String\u003e\u003e,\n}\n\nimpl TestUnitBuilder {\n    fn new(name: \u0026str, unit_type: \u0026str) -\u003e Self {\n        Self {\n            name: name.to_string(),\n            unit_type: unit_type.to_string(),\n            temp_dir: TempDir::new().unwrap(),\n            runner_params: None,\n        }\n    }\n\n    fn with_runner_params(mut self, params: HashMap\u003cString, String\u003e) -\u003e Self {\n        self.runner_params = Some(params);\n        self\n    }\n\n    fn build(self) -\u003e TestUnit {\n        let manifest = Manifest {\n            dimensions: vec![\"dc\".to_string()],\n            overwrite: false,\n            opt_dims: None,\n            allow_list: None,\n            deny_list: None,\n            affinity_tags: None,\n            unit_type: self.unit_type,\n            spec: None,\n            runner: self.runner_params,\n            state: None,\n        };\n\n        TestUnit {\n            name: self.name,\n            manifest,\n            temp_folder: self.temp_dir.path().to_path_buf(),\n            temp_dir: self.temp_dir,\n        }\n    }\n}\n\nstruct TestUnit {\n    name: String,\n    manifest: Manifest,\n    temp_folder: PathBuf,\n    #[allow(dead_code)]\n    temp_dir: TempDir, // Keep alive for the duration of the test\n}\n\n#[test]\nfn test_runner_builder_workflow_bash() {\n    let unit = TestUnitBuilder::new(\"test-bash-unit\", \"bash\").build();\n    let command = vec![\"echo\".to_string(), \"hello\".to_string()];\n\n    // This would need proper Unit implementation\n    // For now, we test the structure\n    assert_eq!(unit.manifest.unit_type, \"bash\");\n    assert_eq!(unit.name, \"test-bash-unit\");\n}\n\n#[test]\nfn test_runner_builder_workflow_tf() {\n    let mut runner_params = HashMap::new();\n    runner_params.insert(\"version\".to_string(), \"1.5.0\".to_string());\n    runner_params.insert(\"state_backend\".to_string(), \"s3\".to_string());\n\n    let unit = TestUnitBuilder::new(\"test-tf-unit\", \"tf\")\n        .with_runner_params(runner_params)\n        .build();\n\n    let command = vec![\"plan\".to_string()];\n\n    assert_eq!(unit.manifest.unit_type, \"tf\");\n    assert_eq!(unit.name, \"test-tf-unit\");\n    assert!(unit.manifest.runner.is_some());\n    \n    let runner_config = unit.manifest.runner.unwrap();\n    assert_eq!(runner_config.get(\"version\"), Some(\u0026\"1.5.0\".to_string()));\n    assert_eq!(runner_config.get(\"state_backend\"), Some(\u0026\"s3\".to_string()));\n}\n\n#[test]\nfn test_runner_type_conversion_integration() {\n    let test_cases = vec![\n        (\"tf\", RunnerType::TF),\n        (\"TF\", RunnerType::TF),\n        (\"terraform\", RunnerType::UNKNOWN),\n        (\"bash\", RunnerType::BASH),\n        (\"BASH\", RunnerType::BASH),\n        (\"tofu\", RunnerType::TOFU),\n        (\"TOFU\", RunnerType::TOFU),\n        (\"helm\", RunnerType::HELM),\n        (\"HELM\", RunnerType::HELM),\n        (\"unknown\", RunnerType::UNKNOWN),\n        (\"\", RunnerType::UNKNOWN),\n    ];\n\n    for (input, expected) in test_cases {\n        let result = RunnerType::str_to_runner_type(input);\n        assert!(matches!(result, expected), \"Failed for input: {}\", input);\n    }\n}\n\n#[test]\nfn test_state_backend_template_integration() {\n    let handlebars = handlebars::Handlebars::new();\n    let data = json!({\n        \"org\": \"test-org\",\n        \"unit_name\": \"web-app\",\n        \"dim_tree\": \"dc:prod/app:frontend\"\n    });\n\n    // Test S3 backend template\n    let s3_template = json!({\n        \"s3\": {\n            \"bucket\": \"{{ org }}-terraform-state\",\n            \"key\": \"{{ dim_tree }}/{{ unit_name }}.tfstate\",\n            \"region\": \"us-east-1\",\n            \"encrypt\": true,\n            \"dynamodb_table\": \"{{ org }}-terraform-locks\"\n        }\n    });\n\n    let result = apply_template_to_value(\u0026s3_template, \u0026handlebars, \u0026data);\n\n    let expected = json!({\n        \"s3\": {\n            \"bucket\": \"test-org-terraform-state\",\n            \"key\": \"dc:prod/app:frontend/web-app.tfstate\",\n            \"region\": \"us-east-1\",\n            \"encrypt\": true,\n            \"dynamodb_table\": \"test-org-terraform-locks\"\n        }\n    });\n\n    assert_eq!(result, expected);\n\n    // Test GCS backend template\n    let gcs_template = json!({\n        \"gcs\": {\n            \"bucket\": \"{{ org }}-tf-state\",\n            \"prefix\": \"{{ dim_tree }}/{{ unit_name }}\"\n        }\n    });\n\n    let gcs_result = apply_template_to_value(\u0026gcs_template, \u0026handlebars, \u0026data);\n\n    let gcs_expected = json!({\n        \"gcs\": {\n            \"bucket\": \"test-org-tf-state\",\n            \"prefix\": \"dc:prod/app:frontend/web-app\"\n        }\n    });\n\n    assert_eq!(gcs_result, gcs_expected);\n}\n\n#[test]\nfn test_runner_params_integration() {\n    // Test full params workflow\n    let mut input_params = HashMap::new();\n    input_params.insert(\"version\".to_string(), \"1.6.0\".to_string());\n    input_params.insert(\"state_backend\".to_string(), \"gcs\".to_string());\n    input_params.insert(\"runner_command\".to_string(), \"terraform\".to_string());\n    input_params.insert(\"extra_args\".to_string(), \"--parallelism=5\".to_string());\n    input_params.insert(\"inlet_command\".to_string(), \"echo 'Starting deployment'\".to_string());\n    input_params.insert(\"outlet_command\".to_string(), \"echo 'Deployment complete'\".to_string());\n    input_params.insert(\"lock_port\".to_string(), \"9999\".to_string());\n\n    let params = RunnerParams::init(input_params);\n\n    // Test all getters\n    assert_eq!(params.get_version(), \"1.6.0\");\n    assert_eq!(params.get_state_backend(), \"gcs\");\n    assert_eq!(params.get_lock_port(), 9999);\n\n    // Test conversion back to hashmap\n    let hashmap = params.get_params_hashmap();\n    assert!(hashmap.contains_key(\"version\"));\n    assert!(hashmap.contains_key(\"state_backend\"));\n    assert!(hashmap.contains_key(\"runner_command\"));\n    assert!(hashmap.contains_key(\"extra_args\"));\n    assert!(hashmap.contains_key(\"inlet_command\"));\n    assert!(hashmap.contains_key(\"outlet_command\"));\n    assert!(hashmap.contains_key(\"lock_port\"));\n}\n\n#[test]\nfn test_complex_template_scenarios() {\n    let handlebars = handlebars::Handlebars::new();\n    \n    // Test nested templates with arrays\n    let complex_template = json!({\n        \"backends\": [\n            {\n                \"type\": \"s3\",\n                \"config\": {\n                    \"bucket\": \"{{ org }}-state-{{ env }}\",\n                    \"key\": \"{{ unit_name }}/terraform.tfstate\"\n                }\n            },\n            {\n                \"type\": \"local\",\n                \"config\": {\n                    \"path\": \"/tmp/{{ org }}/{{ unit_name }}.tfstate\"\n                }\n            }\n        ],\n        \"metadata\": {\n            \"org\": \"{{ org }}\",\n            \"unit\": \"{{ unit_name }}\",\n            \"full_path\": \"{{ org }}/{{ unit_name }}\"\n        }\n    });\n\n    let data = json!({\n        \"org\": \"acme-corp\",\n        \"unit_name\": \"api-gateway\",\n        \"env\": \"production\"\n    });\n\n    let result = apply_template_to_value(\u0026complex_template, \u0026handlebars, \u0026data);\n\n    let expected = json!({\n        \"backends\": [\n            {\n                \"type\": \"s3\",\n                \"config\": {\n                    \"bucket\": \"acme-corp-state-production\",\n                    \"key\": \"api-gateway/terraform.tfstate\"\n                }\n            },\n            {\n                \"type\": \"local\",\n                \"config\": {\n                    \"path\": \"/tmp/acme-corp/api-gateway.tfstate\"\n                }\n            }\n        ],\n        \"metadata\": {\n            \"org\": \"acme-corp\",\n            \"unit\": \"api-gateway\",\n            \"full_path\": \"acme-corp/api-gateway\"\n        }\n    });\n\n    assert_eq!(result, expected);\n}\n\n#[test]\nfn test_runner_params_edge_cases_integration() {\n    // Test with minimal params\n    let minimal_params = HashMap::new();\n    let params = RunnerParams::init(minimal_params);\n    \n    assert_eq!(params.get_version(), \"latest\");\n    assert_eq!(params.get_state_backend(), \"local\");\n    assert_eq!(params.get_lock_port(), 65432);\n\n    // Test with invalid lock port\n    let mut invalid_params = HashMap::new();\n    invalid_params.insert(\"lock_port\".to_string(), \"not_a_number\".to_string());\n    let params = RunnerParams::init(invalid_params);\n    assert_eq!(params.get_lock_port(), 65432); // Should fallback to default\n\n    // Test with extreme values\n    let mut extreme_params = HashMap::new();\n    extreme_params.insert(\"version\".to_string(), \"a\".repeat(1000)); // Very long version\n    extreme_params.insert(\"lock_port\".to_string(), \"65535\".to_string()); // Max port\n    let params = RunnerParams::init(extreme_params);\n    assert_eq!(params.get_version().len(), 1000);\n    assert_eq!(params.get_lock_port(), 65535);\n}\n\n#[test]\nfn test_template_error_handling() {\n    let handlebars = handlebars::Handlebars::new();\n    \n    // Test template with missing variables\n    let template_with_missing_vars = json!(\"{{ missing_var }}/{{ another_missing }}\");\n    let empty_data = json!({});\n    \n    let result = apply_template_to_value(\u0026template_with_missing_vars, \u0026handlebars, \u0026empty_data);\n    \n    // Handlebars renders missing variables as empty strings, so we get \"/\"\n    assert_eq!(result, json!(\"/\"));\n}\n\n#[test]\nfn test_runner_load_creation_integration() {\n    let unit = TestUnitBuilder::new(\"integration-test\", \"bash\").build();\n    let command = vec![\"test\".to_string(), \"command\".to_string()];\n    let params = RunnerParams::default();\n    let state_backend = json!({\n        \"consul\": {\n            \"address\": \"consul.example.com:8500\",\n            \"scheme\": \"https\",\n            \"path\": \"terraform/state\"\n        }\n    });\n\n    // In a real implementation, this would create a proper RunnerLoad\n    // For now, we test the components\n    assert_eq!(unit.manifest.unit_type, \"bash\");\n    assert!(!command.is_empty());\n    assert_eq!(params.get_version(), \"latest\");\n    assert!(state_backend.is_object());\n}\n\n#[test]\nfn test_multiple_runner_types_workflow() {\n    let runner_types = vec![\"tf\", \"bash\", \"tofu\", \"helm\"];\n    \n    for runner_type in runner_types {\n        let unit = TestUnitBuilder::new(\u0026format!(\"test-{}\", runner_type), runner_type).build();\n        let parsed_type = RunnerType::str_to_runner_type(runner_type);\n        \n        assert_eq!(unit.manifest.unit_type, runner_type);\n        assert!(!matches!(parsed_type, RunnerType::UNKNOWN));\n    }\n}\n\n#[test]\nfn test_state_backend_variations() {\n    let handlebars = handlebars::Handlebars::new();\n    let data = json!({\n        \"org\": \"test\",\n        \"unit_name\": \"app\",\n        \"dim_tree\": \"env:prod\"\n    });\n\n    let backends = vec![\n        (\"local\", json!({\"local\": {\"path\": \"{{ org }}/{{ unit_name }}.tfstate\"}})),\n        (\"s3\", json!({\"s3\": {\"bucket\": \"{{ org }}-state\", \"key\": \"{{ unit_name }}.tfstate\"}})),\n        (\"gcs\", json!({\"gcs\": {\"bucket\": \"{{ org }}-state\", \"prefix\": \"{{ unit_name }}\"}})),\n        (\"azurerm\", json!({\"azurerm\": {\"storage_account_name\": \"{{ org }}state\", \"container_name\": \"tfstate\", \"key\": \"{{ unit_name }}.tfstate\"}})),\n    ];\n\n    for (backend_type, template) in backends {\n        let result = apply_template_to_value(\u0026template, \u0026handlebars, \u0026data);\n        \n        // Verify that templating worked by checking specific values\n        match backend_type {\n            \"local\" =\u003e {\n                assert_eq!(result[\"local\"][\"path\"], json!(\"test/app.tfstate\"));\n            },\n            \"s3\" =\u003e {\n                assert_eq!(result[\"s3\"][\"bucket\"], json!(\"test-state\"));\n                assert_eq!(result[\"s3\"][\"key\"], json!(\"app.tfstate\"));\n            },\n            \"gcs\" =\u003e {\n                assert_eq!(result[\"gcs\"][\"bucket\"], json!(\"test-state\"));\n                assert_eq!(result[\"gcs\"][\"prefix\"], json!(\"app\"));\n            },\n            \"azurerm\" =\u003e {\n                assert_eq!(result[\"azurerm\"][\"storage_account_name\"], json!(\"teststate\"));\n                assert_eq!(result[\"azurerm\"][\"key\"], json!(\"app.tfstate\"));\n            },\n            _ =\u003e panic!(\"Unknown backend type: {}\", backend_type),\n        }\n    }\n}\n\n#[test]\nfn test_concurrent_runner_operations() {\n    use std::sync::Arc;\n    use std::thread;\n\n    let runner_types = Arc::new(vec![\"tf\", \"bash\", \"tofu\", \"helm\"]);\n    let handles: Vec\u003c_\u003e = (0..4)\n        .map(|i| {\n            let types = Arc::clone(\u0026runner_types);\n            thread::spawn(move || {\n                let runner_type = \u0026types[i];\n                let unit = TestUnitBuilder::new(\u0026format!(\"concurrent-{}\", i), runner_type).build();\n                let parsed_type = RunnerType::str_to_runner_type(runner_type);\n                \n                assert_eq!(unit.manifest.unit_type, *runner_type);\n                assert!(!matches!(parsed_type, RunnerType::UNKNOWN));\n                \n                // Test params creation in concurrent context\n                let params = RunnerParams::default();\n                assert_eq!(params.get_version(), \"latest\");\n            })\n        })\n        .collect();\n\n    for handle in handles {\n        handle.join().unwrap();\n    }\n}\n\n#[test]\nfn test_file_system_integration() {\n    let temp_dir = TempDir::new().unwrap();\n    let unit_path = temp_dir.path().join(\"test_unit\");\n    fs::create_dir_all(\u0026unit_path).unwrap();\n\n    // Create a manifest file\n    let manifest_content = r#\"\ndimensions = [\"dc\", \"app\"]\ntype = \"tf\"\noverwrite = true\n\n[runner]\nversion = \"1.5.0\"\nstate_backend = \"s3\"\nrunner_command = \"terraform\"\nextra_args = \"--detailed-exitcode\"\n\n[spec.env_vars.required]\nAWS_REGION = \"AWS_REGION\"\n\"#;\n\n    fs::write(unit_path.join(\"manifest.toml\"), manifest_content).unwrap();\n\n    // Verify file was created\n    assert!(unit_path.join(\"manifest.toml\").exists());\n    \n    // Read and verify content\n    let content = fs::read_to_string(unit_path.join(\"manifest.toml\")).unwrap();\n    assert!(content.contains(\"type = \\\"tf\\\"\"));\n    assert!(content.contains(\"version = \\\"1.5.0\\\"\"));\n}\n\n#[test]\nfn test_performance_template_rendering() {\n    use std::time::Instant;\n    \n    let handlebars = handlebars::Handlebars::new();\n    let data = json!({\n        \"org\": \"performance-test\",\n        \"unit_name\": \"load-test\",\n        \"dim_tree\": \"dc:us-east-1/env:prod/app:web\"\n    });\n\n    let template = json!({\n        \"s3\": {\n            \"bucket\": \"{{ org }}-terraform-state\",\n            \"key\": \"{{ dim_tree }}/{{ unit_name }}.tfstate\",\n            \"region\": \"us-east-1\"\n        }\n    });\n\n    let start = Instant::now();\n    \n    // Render template 1000 times\n    for _ in 0..1000 {\n        let _ = apply_template_to_value(\u0026template, \u0026handlebars, \u0026data);\n    }\n    \n    let duration = start.elapsed();\n    \n    // Should complete in reasonable time (less than 1 second for 1000 renders)\n    assert!(duration.as_millis() \u003c 1000, \"Template rendering took too long: {:?}\", duration);\n} ","traces":[],"covered":0,"coverable":0}]};

    <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      }
    };
  });

  return [
    ...folders,
    ...files.filter(file => file.path.length === 1),
  ];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener("hashchange", () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.substr(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(({current}) => {
      return {current: [...current, file.path[0]]};
    }, () => this.updateHash());
  }

  back(file) {
    this.setState(({current}) => {
      return {current: current.slice(0, current.length - 1)};
    }, () => this.updateHash());
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e('div', {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e('table', {className: 'files-list'},
      e('thead', {className: 'files-list__head'},
        e('tr', null,
          e('th', null, "Path"),
          e('th', null, "Coverage")
        )
      ),
      e('tbody', {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile}))
      )
    )
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? file.covered / file.coverable * 100 : -1;
  const coverageDelta = file.prevRun &&
    (file.covered / file.coverable * 100 - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('tr', {
      className: 'files-list__file'
        + (coverage >= 0 && coverage < 50 ? ' files-list__file_low': '')
        + (coverage >= 50 && coverage < 80 ? ' files-list__file_medium': '')
        + (coverage >= 80 ? ' files-list__file_high': '')
        + (file.is_folder ? ' files-list__file_folder': ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e('td', null,
      file.covered + ' / ' + file.coverable +
      (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'},
    e(FileHeader, {file, onBack}),
    e(FileContent, {file})
  );
}

function FileHeader({file, onBack}) {
  const coverage = file.covered / file.coverable * 100;
  const coverageDelta = file.prevRun && (coverage - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('div', {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e('div', {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable +
      (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function FileContent({file}) {
  return e('pre', {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e('code', {
          className: 'code-line'
            + (covered ? ' code-line_covered' : '')
            + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        }, line);
    })
  );
}

(function(){
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData && previousData.files.forEach((file) => {
    const path = file.path.slice(commonPath.length).join('/');
    prevFilesMap.set(path, file);
  });

  const files = data.files.map((file) => {
    const path = file.path.slice(commonPath.length);
    const { covered = 0, coverable = 0 } = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: { covered, coverable },
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    }
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));
}());
</script>
