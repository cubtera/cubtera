Value| attribute.as_str().unwrap())\n                .collect::\u003cVec\u003c\u0026str\u003e\u003e();\n            if let Some(unit_tags) = \u0026self.manifest.affinity_tags {\n                if value_intersection(affinity_tags.clone(), json!(unit_tags)).is_none() {\n                    warn!(target: \"\", \"Unit {:?} doesn't have required affinity tags. Allowed tags: {allowed_tags:?}. Execution terminated...\", self.name);\n                    std::process::exit(0);\n                }\n                self.dimensions.iter().for_each(|dim| {\n                    let dim_data = dim.get_dim_data();\n                    let dim_tags = dim_data[\"meta\"].get(\"affinity_tags\").cloned().unwrap_or_default();\n                    if value_intersection(affinity_tags.clone(), dim_tags.clone()).is_none(){\n                        warn!(target: \"\", \"Dimension {:?} doesn't have required affinity tags. Allowed tags: {allowed_tags:?}. Execution terminated...\", dim_data[\"name\"].as_str().unwrap_or_default());\n                        std::process::exit(0);\n                    }\n                });\n            } else {\n                warn!(target: \"\", \"Unit {:?} doesn't have required affinity tags. Allowed tags: {allowed_tags:?}. Execution terminated...\", self.name.blue());\n                std::process::exit(0);\n            }\n        }\n\n        self\n    }\n\n    fn get_dims_from_cli(\n        dim_names: \u0026[String],\n        storage: \u0026Storage,\n        context: Option\u003cString\u003e,\n    ) -\u003e Vec\u003cDim\u003e {\n        dim_names\n            .iter()\n            .map(|dim| DimBuilder::new_from_cli(dim, \u0026GLOBAL_CFG.org, storage, context.clone()))\n            .collect::\u003cVec\u003cDim\u003e\u003e()\n    }\n\n    pub fn get_unit_state_path(\u0026self) -\u003e String {\n        let mut dims = self\n            .dimensions\n            .iter()\n            .map(|dim| dim.key_path.to_str().unwrap())\n            .collect::\u003cVec\u003c\u0026str\u003e\u003e();\n        let mut exts = self\n            .extensions\n            .iter()\n            .map(|ext| ext.as_str())\n            .collect::\u003cVec\u003c\u0026str\u003e\u003e();\n        dims.append(\u0026mut exts);\n\n        dims.join(\"/\")\n    }\n\n    pub fn remove_temp_folder(\u0026self) {\n        let path = self.temp_folder.clone();\n        if path.exists() {\n            std::fs::remove_dir_all(\u0026path).unwrap_or_exit(\"Can't remove temp folder\".to_string());\n            debug!(target: \"\", \"Temp folder was removed: \\n{:?}\", path);\n        }\n    }\n\n    pub fn copy_files(\u0026self) {\n        // define destination temp folder\n        let dest_folder = self.temp_folder.clone();\n        debug!(target: \"unit mod\", \"Copying files to temp folder: \\n{:?}\", dest_folder);\n        if !dest_folder.exists() {\n            std::fs::create_dir_all(\u0026dest_folder)\n                .unwrap_or_exit(format!(\"Can't create temp folder: {:?}\", \u0026dest_folder));\n        }\n\n        // --------- Modules --------- //\n        // add modules symlink to $temp folder\n        // if modules_path is absolute =\u003e current_dir will be overwritten by join method\n        let modules_folder_path = std::env::current_dir()\n            .unwrap()\n            .join(\u0026GLOBAL_CFG.modules_path);\n        if !dest_folder.join(\"modules\").exists() {\n            std::os::unix::fs::symlink(modules_folder_path, dest_folder.join(\"modules\"))\n                .unwrap_or_exit(\"Failed to create modules symlink\".to_string());\n        };\n\n        // --------- Plugins --------- //\n        // TODO: move to runner specific logic\n        // copy plugin folder from config to $HOME/.terraform.d/plugins folder if exists\n        // is plugins_path absolute =\u003e current_dir will be overwritten by join method\n        let plugins_folder_path = std::env::current_dir()\n            .unwrap()\n            .join(\u0026GLOBAL_CFG.plugins_path);\n        if plugins_folder_path.exists() {\n            let home_dir = std::env::var(\"HOME\").unwrap();\n            copy_folder(\n                plugins_folder_path,\n                \u0026Path::new(\u0026home_dir).join(\".terraform.d/plugins\"),\n                false,\n            );\n        } else {\n            warn!(target: \"\", \"Plugin folder {plugins_folder_path:?} does not exist. Check cubtera config. Passed...\");\n        }\n\n        // --------- Unit --------- //\n        // self.manifest.overrides.then( ||\n        //     self.generic_unit_folder.clone().map(|source_folder|\n        //         copy_folder(source_folder, \u0026dest_folder, true)\n        //     )\n        // );\n\n        if self.manifest.overwrite {\n            // copy generic unit files to temp folder if set overrides: true in unit_manifest\n            if let Some(generic_unit_folder) = self.generic_unit_folder.clone() {\n                copy_folder(generic_unit_folder, \u0026dest_folder, true);\n            };\n        }\n\n        copy_folder(self.unit_folder.clone(), \u0026dest_folder, true);\n\n        // Generate ALL Opt Dim json files with NULL values for each unit's optional dimension\n        self.opt_dims.iter().for_each(|dim| {\n            dim.iter().for_each(|opt_dim| {\n                opt_dim\n                    .save_json_dim_vars(dest_folder.clone())\n                    .unwrap_or_exit(format!(\n                        \"Failed to save json dim vars for dim: {:?}\",\n                        \u0026dest_folder\n                    ));\n            });\n        });\n\n        // Generate Dim Variables json files with json values for each unit's dimension\n        self.dimensions.iter().for_each(|dim| {\n            dim.save_json_dim_vars(dest_folder.clone())\n                .unwrap_or_exit(format!(\n                    \"Failed to save json dim vars for dim {}\",\n                    \u0026dim.dim_name\n                ));\n\n            dim.save_dim_includes(dest_folder.clone())\n                .unwrap_or_exit(format!(\n                    \"Failed to save dim includes for dim {}\",\n                    \u0026dim.dim_name\n                ));\n\n            dim.save_dim_folders(dest_folder.clone())\n                .unwrap_or_exit(format!(\n                    \"Failed to save dim folders for dim {}\",\n                    \u0026dim.dim_name\n                ));\n        });\n\n        if !\u0026self.extensions.is_empty() {\n            let mut ext_tf_vars = String::new();\n            ext_tf_vars.push_str(\"{\\n\");\n            for extension in \u0026self.extensions {\n                let mut ext = extension.split_terminator(':');\n                ext_tf_vars.push_str(\u0026format!(\n                    \"  \\\"ext_{}_name\\\": \\\"{}\\\",\\n\",\n                    ext.next().unwrap(),\n                    ext.next().unwrap()\n                ));\n            }\n            // remove last comma\n            ext_tf_vars.pop();\n            // remove last CR\n            ext_tf_vars.pop();\n            ext_tf_vars.push_str(\"\\n}\\n\");\n            std::fs::write(dest_folder.join(\"cubtera_ext.json\"), ext_tf_vars)\n                .unwrap_or_exit(\"Failed to write cubtera_ext.json file\".to_string());\n        }\n\n        // --------- Files form Unit Manifest --------- //\n        // copy all files defined in unit_manifest required and optional sections\n        if let Some(spec) = \u0026self.manifest.spec {\n            if let Some(spec_files) = \u0026spec.files {\n                if let Some(required) = spec_files.required.clone() {\n                    copy_files_from_manifest(required, \u0026dest_folder, |src| {\n                        exit_with_error(format!(\n                            \"Required file {} from unit manifest doesn't exist.\",\n                            src.red()\n                        ))\n                    });\n                };\n                if let Some(optional) = spec_files.optional.clone() {\n                    copy_files_from_manifest(\n                        optional,\n                        \u0026dest_folder,\n                        |src| warn!(target:\"\", \"Optional file {} from unit manifest doesn't exist. Passed...\", src.blue()),\n                    );\n                };\n            }\n        }\n    }\n\n    pub fn get_name(\u0026self) -\u003e String {\n        self.name.clone()\n    }\n\n    pub fn get_unit_blob_sha(\u0026self) -\u003e String {\n        let sha = get_blob_sha_by_path(\u0026self.unit_folder);\n        sha.unwrap_or_else(|e| {\n            warn!(\"Failed to get unit blob sha: {e}\");\n            \"undefined\".to_string()\n        })\n    }\n\n    pub fn get_unit_commit_sha(\u0026self) -\u003e String {\n        let sha = get_commit_sha_by_path(\u0026self.unit_folder);\n        sha.unwrap_or_else(|e| {\n            warn!(\"Failed to get unit commit sha: {e}\");\n            \"undefined\".to_string()\n        })\n    }\n\n    pub fn get_dims_blob_sha(\u0026self) -\u003e HashMap\u003cString, String\u003e {\n        self.dimensions\n            .iter()\n            .map(|dim| (format!(\"{}:{}\", dim.dim_type, dim.dim_name), dim.data_sha.clone()))\n            .collect::\u003cHashMap\u003cString, String\u003e\u003e()\n    }\n\n    pub fn get_env_vars(\u0026self) -\u003e Option\u003cHashMap\u003cString, String\u003e\u003e {\n        self.manifest.spec.as_ref()\n            .and_then(|spec| spec.env_vars.as_ref())\n            .map(|env_vars| {\n                env_vars.optional\n                    .iter()\n                    .flatten()\n                    .chain(env_vars.required.iter().flatten())\n                    .map(|(_, v)| std::env::var(v).ok().map(|val| (v.clone(), val)))\n                    .flatten()\n                    .collect::\u003cHashMap\u003cString, String\u003e\u003e()\n            })\n    }\n}\n\nfn copy_files_from_manifest(\n    files: HashMap\u003cString, String\u003e,\n    unit_folder: alized error type for the entire Cubtera application\n/// \n/// This enum provides a unified error handling approach while maintaining\n/// module-specific error contexts. Each variant represents a different\n/// domain/module within the application.\n#[derive(Debug, Error)]\npub enum CubteraError {\n    /// Tools module errors (file operations, JSON, Git, etc.)\n    #[error(\"Tools error: {0}\")]\n    Tools(#[from] crate::tools::ToolsError),\n    \n    /// Configuration module errors\n    #[error(\"Configuration error: {message}\")]\n    Config { message: String },\n    \n    /// Dimension module errors\n    #[error(\"Dimension error: {message}\")]\n    Dimension { message: String },\n    \n    /// Unit module errors\n    #[error(\"Unit error: {message}\")]\n    Unit { message: String },\n    \n    /// Runner module errors\n    #[error(\"Runner error: {runner_type}: {message}\")]\n    Runner { runner_type: String, message: String },\n    \n    /// Image management errors\n    #[error(\"Image management error: {message}\")]\n    Image { message: String },\n    \n    /// Deployment log errors\n    #[error(\"Deployment log error: {message}\")]\n    DeploymentLog { message: String },\n    \n    /// CLI command errors\n    #[error(\"CLI error: {command}: {message}\")]\n    Cli { command: String, message: String },\n    \n    /// API endpoint errors\n    #[error(\"API error: {endpoint}: {message}\")]\n    Api { endpoint: String, message: String },\n    \n    /// Validation errors (cross-module)\n    #[error(\"Validation error: {field}: {message}\")]\n    Validation { field: String, message: String },\n    \n    /// External dependency errors\n    #[error(\"External dependency error: {dependency}: {message}\")]\n    External { dependency: String, message: String },\n    \n    /// Critical system errors that should cause immediate exit\n    #[error(\"Critical system error: {message}\")]\n    Critical { message: String },\n}\n\n/// Result type alias for the entire Cubtera application\n/// \n/// Note: This is intentionally named CubteraResult to avoid conflicts\n/// with existing Result types in the codebase during migration.\npub type CubteraResult\u003cT\u003e = std::result::Result\u003cT, CubteraError\u003e;\n\nimpl CubteraError {\n    /// Create a configuration error\n    pub fn config_error(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Config { message: message.into() }\n    }\n    \n    /// Create a dimension error\n    pub fn dimension_error(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Dimension { message: message.into() }\n    }\n    \n    /// Create a unit error\n    pub fn unit_error(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Unit { message: message.into() }\n    }\n    \n    /// Create a runner error\n    pub fn runner_error(runner_type: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Runner { \n            runner_type: runner_type.into(), \n            message: message.into() \n        }\n    }\n    \n    /// Create an image management error\n    pub fn image_error(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Image { message: message.into() }\n    }\n    \n    /// Create a deployment log error\n    pub fn deployment_log_error(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::DeploymentLog { message: message.into() }\n    }\n    \n    /// Create a CLI error\n    pub fn cli_error(command: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Cli { \n            command: command.into(), \n            message: message.into() \n        }\n    }\n    \n    /// Create an API error\n    pub fn api_error(endpoint: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Api { \n            endpoint: endpoint.into(), \n            message: message.into() \n        }\n    }\n    \n    /// Create a validation error\n    pub fn validation_error(field: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Validation { \n            field: field.into(), \n            message: message.into() \n        }\n    }\n    \n    /// Create an external dependency error\n    pub fn external_error(dependency: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::External { \n            dependency: dependency.into(), \n            message: message.into() \n        }\n    }\n    \n    /// Create a critical system error\n    pub fn critical_error(message: impl Into\u003cString\u003e) -\u003e Self {\n        Self::Critical { message: message.into() }\n    }\n    \n    /// Check if this error is critical and should cause immediate exit\n    pub fn is_critical(\u0026self) -\u003e bool {\n        matches!(self, CubteraError::Critical { .. })\n    }\n    \n    /// Get the error category for logging/metrics\n    pub fn category(\u0026self) -\u003e \u0026'static str {\n        match self {\n            CubteraError::Tools(_) =\u003e \"tools\",\n            CubteraError::Config { .. } =\u003e \"config\",\n            CubteraError::Dimension { .. } =\u003e \"dimension\",\n            CubteraError::Unit { .. } =\u003e \"unit\",\n            CubteraError::Runner { .. } =\u003e \"runner\",\n            CubteraError::Image { .. } =\u003e \"image\",\n            CubteraError::DeploymentLog { .. } =\u003e \"deployment_log\",\n            CubteraError::Cli { .. } =\u003e \"cli\",\n            CubteraError::Api { .. } =\u003e \"api\",\n            CubteraError::Validation { .. } =\u003e \"validation\",\n            CubteraError::External { .. } =\u003e \"external\",\n            CubteraError::Critical { .. } =\u003e \"critical\",\n        }\n    }\n    \n    /// Get error severity level\n    pub fn severity(\u0026self) -\u003e ErrorSeverity {\n        match self {\n            CubteraError::Critical { .. } =\u003e ErrorSeverity::Critical,\n            CubteraError::Config { .. } =\u003e ErrorSeverity::High,\n            CubteraError::Validation { .. } =\u003e ErrorSeverity::High,\n            CubteraError::Runner { .. } =\u003e ErrorSeverity::Medium,\n            CubteraError::Unit { .. } =\u003e ErrorSeverity::Medium,\n            CubteraError::Dimension { .. } =\u003e ErrorSeverity::Medium,\n            CubteraError::Tools(_) =\u003e ErrorSeverity::Low,\n            CubteraError::Image { .. } =\u003e ErrorSeverity::Low,\n            CubteraError::DeploymentLog { .. } =\u003e ErrorSeverity::Low,\n            CubteraError::Cli { .. } =\u003e ErrorSeverity::Medium,\n            CubteraError::Api { .. } =\u003e ErrorSeverity::Medium,\n            CubteraError::External { .. } =\u003e ErrorSeverity::Medium,\n        }\n    }\n}\n\n/// Error severity levels for logging and handling decisions\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]\npub enum ErrorSeverity {\n    Low,\n    Medium,\n    High,\n    Critical,\n}\n\nimpl ErrorSeverity {\n    /// Should this error cause the application to exit?\n    pub fn should_exit(\u0026self) -\u003e bool {\n        matches!(self, ErrorSeverity::Critical)\n    }\n    \n    /// Get the log level for this severity\n    pub fn log_level(\u0026self) -\u003e log::Level {\n        match self {\n            ErrorSeverity::Low =\u003e log::Level::Warn,\n            ErrorSeverity::Medium =\u003e log::Level::Error,\n            ErrorSeverity::High =\u003e log::Level::Error,\n            ErrorSeverity::Critical =\u003e log::Level::Error,\n        }\n    }\n}\n\n/// Automatic conversions from standard library errors\nimpl From\u003cstd::io::Error\u003e for CubteraError {\n    fn from(err: std::io::Error) -\u003e Self {\n        CubteraError::external_error(\"std::io\", err.to_string())\n    }\n}\n\nimpl From\u003cserde_json::Error\u003e for CubteraError {\n    fn from(err: serde_json::Error) -\u003e Self {\n        CubteraError::external_error(\"serde_json\", err.to_string())\n    }\n}\n\nimpl From\u003cgit2::Error\u003e for CubteraError {\n    fn from(err: git2::Error) -\u003e Self {\n        CubteraError::external_error(\"git2\", err.to_string())\n    }\n}\n\nimpl From\u003cmongodb::error::Error\u003e for CubteraError {\n    fn from(err: mongodb::error::Error) -\u003e Self {\n        CubteraError::external_error(\"mongodb\", err.to_string())\n    }\n}\n\nimpl From\u003cmongodb::bson::de::Error\u003e for CubteraError {\n    fn from(err: mongodb::bson::de::Error) -\u003e Self {\n        CubteraError::external_error(\"mongodb::bson::de\", err.to_string())\n    }\n}\n\nimpl From\u003cmongodb::bson::ser::Error\u003e for CubteraError {\n    fn from(err: mongodb::bson::ser::Error) -\u003e Self {\n        CubteraError::external_error(\"mongodb::bson::ser\", err.to_string())\n    }\n}\n\nimpl From\u003cBox\u003cdyn std::error::Error\u003e\u003e for CubteraError {\n    fn from(err: Box\u003cdyn std::error::Error\u003e) -\u003e Self {\n        CubteraError::external_error(\"boxed_error\", err.to_string())\n    }\n}\n\n/// Extension trait for Result types to provide Cubtera-specific error handling\npub trait CubteraResultExt\u003cT\u003e {\n    /// Add context to any error and convert it to CubteraError\n    fn with_context(self, context: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n    \n    /// Convert to a specific Cubtera error type\n    fn to_config_error(self, message: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n    fn to_dimension_error(self, message: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n    fn to_unit_error(self, message: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n    fn to_runner_error(self, runner_type: \u0026str, message: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n    fn to_cli_error(self, command: \u0026str, message: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n    fn to_api_error(self, endpoint: \u0026str, message: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n}\n\nimpl\u003cT, E: std::fmt::Display\u003e CubteraResultExt\u003cT\u003e for std::result::Result\u003cT, E\u003e {\n    fn with_context(self, context: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.map_err(|e| CubteraError::external_error(\"context\", format!(\"{}: {}\", context, e)))\n    }\n    \n    fn to_config_error(self, message: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.map_err(|e| CubteraError::config_error(format!(\"{}: {}\", message, e)))\n    }\n    \n    fn to_dimension_error(self, message: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.map_err(|e| CubteraError::dimension_error(format!(\"{}: {}\", message, e)))\n    }\n    \n    fn to_unit_error(self, message: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.map_err(|e| CubteraError::unit_error(format!(\"{}: {}\", message, e)))\n    }\n    \n    fn to_runner_error(self, runner_type: \u0026str, message: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.map_err(|e| CubteraError::runner_error(runner_type, format!(\"{}: {}\", message, e)))\n    }\n    \n    fn to_cli_error(self, command: \u0026str, message: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.map_err(|e| CubteraError::cli_error(command, format!(\"{}: {}\", message, e)))\n    }\n    \n    fn to_api_error(self, endpoint: \u0026str, message: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.map_err(|e| CubteraError::api_error(endpoint, format!(\"{}: {}\", message, e)))\n    }\n} ","traces":[{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address": [\"b\".to_string(), \"c\".to_string()];\n/// assert!(if_intersect(vec1, vec2));\n/// ```\npub fn if_intersect(vec1: Vec\u003cString\u003e, vec2: Vec\u003cString\u003e) -\u003e bool {\n    let set1: HashSet\u003cString\u003e = vec1.into_iter().collect();\n    let set2: HashSet\u003cString\u003e = vec2.into_iter().collect();\n    let intersect: HashSet\u003cString\u003e = set1.intersection(\u0026set2).cloned().collect();\n    !intersect.is_empty()\n}\n\n/// Finds intersection of two JSON array values\n/// \n/// # Arguments\n/// * `value1` - First JSON value (should be array)\n/// * `value2` - Second JSON value (should be array)\n/// \n/// # Returns\n/// * `Option\u003cHashSet\u003cString\u003e\u003e` - Intersection set or None if no intersection\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::collections::value_intersection;\n/// use serde_json::json;\n/// \n/// let val1 = json!([\"a\", \"b\", \"c\"]);\n/// let val2 = json!([\"b\", \"c\", \"d\"]);\n/// let intersection = value_intersection(val1, val2);\n/// ```\npub fn value_intersection(value1: Value, value2: Value) -\u003e Option\u003cHashSet\u003cString\u003e\u003e {\n    let vec1 = value_to_vec(\u0026value1)?;\n    let vec2 = value_to_vec(\u0026value2)?;\n    let set1: HashSet\u003c_\u003e = vec1.into_iter().collect();\n    let set2: HashSet\u003c_\u003e = vec2.into_iter().collect();\n\n    match set1.intersection(\u0026set2).cloned().collect::\u003cHashSet\u003c_\u003e\u003e() {\n        set if set.is_empty() =\u003e None,\n        set =\u003e Some(set),\n    }\n}\n\n/// Groups tuples by key\n/// \n/// # Arguments\n/// * `tuples` - Vector of key-value tuples\n/// \n/// # Returns\n/// * `HashMap\u003cString, Vec\u003cString\u003e\u003e` - Grouped values by key\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::collections::group_tuples;\n/// \n/// let tuples = vec![\n///     (\"key1\".to_string(), \"value1\".to_string()),\n///     (\"key1\".to_string(), \"value2\".to_string()),\n///     (\"key2\".to_string(), \"value3\".to_string()),\n/// ];\n/// let grouped = group_tuples(tuples);\n/// ```\npub fn group_tuples(tuples: Vec\u003c(String, String)\u003e) -\u003e HashMap\u003cString, Vec\u003cString\u003e\u003e {\n    let mut map: HashMap\u003cString, Vec\u003cString\u003e\u003e = HashMap::new();\n    tuples.into_iter().for_each(|(key, value)| {\n        map.entry(key).or_default().push(value);\n    });\n    map\n}\n\n/// Converts a JSON value to a vector of strings\n/// \n/// # Arguments\n/// * `value` - JSON value to convert\n/// \n/// # Returns\n/// * `Option\u003cVec\u003cString\u003e\u003e` - Vector of strings or None if conversion fails\nfn value_to_vec(value: \u0026Value) -\u003e Option\u003cVec\u003cString\u003e\u003e {\n    value\n        .as_array()?\n        .iter()\n        .map(|v| v.as_str().map(|s| s.to_string()))\n        .collect()\n}\n\n// TODO: Add more collection operations as needed\n// - merge_hashmaps\n// - deduplicate_vec\n// - sort_by_key\n// - filter_by_predicate\n// etc. ","traces":[{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":82,"address":[],"length":0,"stat n a default value if the result is an error\n    /// \n    /// This provides similar behavior to check_with_warn but returns a default\n    /// value instead of continuing with None.\n    /// \n    /// # Arguments\n    /// * `warning` - Warning message to log\n    /// \n    /// # Examples\n    /// ```\n    /// use cubtera::tools::compat::LegacyCompat;\n    /// \n    /// let config = read_optional_config()\n    ///     .warn_and_default(\"Optional config not found, using defaults\");\n    /// ```\n    fn warn_and_default(self, warning: \u0026str) -\u003e T where T: Default;\n    \n    /// Log a warning and return None if the result is an error\n    /// \n    /// This provides similar behavior to check_with_warn for optional operations.\n    /// \n    /// # Arguments\n    /// * `warning` - Warning message to log\n    /// \n    /// # Examples\n    /// ```\n    /// use cubtera::tools::compat::LegacyCompat;\n    /// \n    /// if let Some(cache) = load_cache()\n    ///     .warn_and_continue(\"Cache file corrupted, proceeding without cache\") {\n    ///     // Use cache\n    /// }\n    /// ```\n    fn warn_and_continue(self, warning: \u0026str) -\u003e Option\u003cT\u003e;\n    \n    /// Convert any error to ToolsError with context\n    /// \n    /// This helps migrate from unwrap_or_exit patterns to proper error propagation.\n    /// \n    /// # Arguments\n    /// * `context` - Context message for the error\n    /// \n    /// # Examples\n    /// ```\n    /// use cubtera::tools::compat::LegacyCompat;\n    /// \n    /// fn load_config() -\u003e ToolsResult\u003cConfig\u003e {\n    ///     let content = std::fs::read_to_string(\"config.toml\")\n    ///         .with_context(\"Failed to read config file\")?;\n    ///     // ... rest of function\n    ///     Ok(config)\n    /// }\n    /// ```\n    fn with_context(self, context: \u0026str) -\u003e ToolsResult\u003cT\u003e;\n}\n\nimpl\u003cT, E: std::fmt::Display\u003e LegacyCompat\u003cT\u003e for std::result::Result\u003cT, E\u003e {\n    fn unwrap_or_exit_with_log(self, context: \u0026str) -\u003e T {\n        match self {\n            Ok(value) =\u003e value,\n            Err(e) =\u003e {\n                error!(target: \"\", \"{}: {}\", context, e);\n                std::process::exit(1);\n            }\n        }\n    }\n    \n    fn warn_and_default(self, warning: \u0026str) -\u003e T where T: Default {\n        match self {\n            Ok(value) =\u003e value,\n            Err(e) =\u003e {\n                warn!(target: \"\", \"{}: {}\", warning, e);\n                T::default()\n            }\n        }\n    }\n    \n    fn warn_and_continue(self, warning: \u0026str) -\u003e Option\u003cT\u003e {\n        match self {\n            Ok(value) =\u003e Some(value),\n            Err(e) =\u003e {\n                warn!(target: \"\", \"{}: {}\", warning, e);\n                None\n            }\n        }\n    }\n    \n    fn with_context(self, context: \u0026str) -\u003e ToolsResult\u003cT\u003e {\n        self.map_err(|e| ToolsError::operation_failed(format!(\"{}: {}\", context, e)))\n    }\n}\n\n/// Extension trait for CubteraError results to provide smart error handling\n/// \n/// This trait provides intelligent error handling based on error severity.\npub trait CubteraCompat\u003cT\u003e {\n    /// Handle error based on its severity\n    /// \n    /// - Critical errors: Exit immediately\n    /// - High severity: Log error and exit\n    /// - Medium severity: Log error and return default\n    /// - Low severity: Log warning and return default\n    fn handle_by_severity(self) -\u003e T where T: Default;\n    \n    /// Handle error with custom behavior per severity\n    fn handle_with_strategy\u003cF\u003e(self, strategy: F) -\u003e T \n    where \n        F: Fn(ErrorSeverity, \u0026CubteraError) -\u003e T;\n    \n    /// Convert to tools error for backward compatibility\n    fn to_tools_error(self) -\u003e ToolsResult\u003cT\u003e;\n}\n\nimpl\u003cT\u003e CubteraCompat\u003cT\u003e for CubteraResult\u003cT\u003e {\n    fn handle_by_severity(self) -\u003e T where T: Default {\n        match self {\n            Ok(value) =\u003e value,\n            Err(e) =\u003e {\n                let severity = e.severity();\n                match severity {\n                    ErrorSeverity::Critical =\u003e {\n                        error!(target: \"\", \"Critical error: {}\", e);\n                        std::process::exit(1);\n                    }\n                    ErrorSeverity::High =\u003e {\n                        error!(target: \"\", \"High severity error: {}\", e);\n                        std::process::exit(1);\n                    }\n                    ErrorSeverity::Medium =\u003e {\n                        error!(target: \"\", \"Medium severity error: {}\", e);\n                        T::default()\n                    }\n                    ErrorSeverity::Low =\u003e {\n                        warn!(target: \"\", \"Low severity error: {}\", e);\n                        T::default()\n                    }\n                }\n            }\n        }\n    }\n    \n    fn handle_with_strategy\u003cF\u003e(self, strategy: F) -\u003e T \n    where \n        F: Fn(ErrorSeverity, \u0026CubteraError) -\u003e T\n    {\n        match self {\n            Ok(value) =\u003e value,\n            Err(e) =\u003e {\n                let severity = e.severity();\n                strategy(severity, \u0026e)\n            }\n        }\n    }\n    \n    fn to_tools_error(self) -\u003e ToolsResult\u003cT\u003e {\n        self.map_err(|e| match e {\n            CubteraError::Tools(tools_err) =\u003e tools_err,\n            other =\u003e ToolsError::operation_failed(other.to_string()),\n        })\n    }\n}\n\n/// Extension trait specifically for Option types\n/// \n/// Provides legacy compatibility for Option unwrapping patterns.\npub trait OptionCompat\u003cT\u003e {\n    /// Unwrap the option or exit with an error message\n    /// \n    /// This maintains the old unwrap_or_exit behavior for Option types.\n    /// \n    /// # Arguments\n    /// * `error_message` - Error message to log and exit with\n    /// \n    /// # Examples\n    /// ```\n    /// use cubtera::tools::compat::OptionCompat;\n    /// \n    /// let value = some_option\n    ///     .unwrap_or_exit_with_log(\"Required value not found\");\n    /// ```\n    fn unwrap_or_exit_with_log(self, error_message: \u0026str) -\u003e T;\n    \n    /// Convert None to a ToolsError with context\n    /// \n    /// # Arguments\n    /// * `context` - Context message for the error\n    /// \n    /// # Examples\n    /// ```\n    /// use cubtera::tools::compat::OptionCompat;\n    /// \n    /// let value = some_option\n    ///     .ok_or_context(\"Required configuration value missing\")?;\n    /// ```\n    fn ok_or_context(self, context: \u0026str) -\u003e ToolsResult\u003cT\u003e;\n    \n    /// Convert None to a CubteraError with context\n    fn ok_or_cubtera_context(self, context: \u0026str) -\u003e CubteraResult\u003cT\u003e;\n}\n\nimpl\u003cT\u003e OptionCompat\u003cT\u003e for Option\u003cT\u003e {\n    fn unwrap_or_exit_with_log(self, error_message: \u0026str) -\u003e T {\n        match self {\n            Some(value) =\u003e value,\n            None =\u003e {\n                error!(target: \"\", \"{}\", error_message);\n                std::process::exit(1);\n            }\n        }\n    }\n    \n    fn ok_or_context(self, context: \u0026str) -\u003e ToolsResult\u003cT\u003e {\n        self.ok_or_else(|| ToolsError::operation_failed(context.to_string()))\n    }\n    \n    fn ok_or_cubtera_context(self, context: \u0026str) -\u003e CubteraResult\u003cT\u003e {\n        self.ok_or_else(|| CubteraError::validation_error(\"option\", context))\n    }\n}\n\n/// Macro for easy migration from unwrap_or_exit patterns\n/// \n/// This macro provides a convenient way to migrate from the old patterns\n/// while maintaining similar syntax.\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::compat::unwrap_or_exit;\n/// \n/// let config = unwrap_or_exit!(read_config(), \"Failed to read config\");\n/// ```\n#[macro_export]\nmacro_rules! unwrap_or_exit {\n    ($result:expr, $msg:expr) =\u003e {\n        $crate::tools::compat::LegacyCompat::unwrap_or_exit_with_log($result, $msg)\n    };\n}\n\n/// Macro for warning and continuing with default values\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::compat::warn_and_default;\n/// \n/// let config = warn_and_default!(read_optional_config(), \"Using default config\");\n/// ```\n#[macro_export]\nmacro_rules! warn_and_default {\n    ($result:expr, $msg:expr) =\u003e {\n        $crate::tools::compat::LegacyCompat::warn_and_default($result, $msg)\n    };\n}\n\n/// Macro for smart error handling based on severity\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::compat::handle_smart;\n/// \n/// let config = handle_smart!(load_config());\n/// ```\n#[macro_export]\nmacro_rules! handle_smart {\n    ($result:expr) =\u003e {\n        $crate::tools::compat::CubteraCompat::handle_by_severity($result)\n    };\n}\n\n/// Migration guide and examples\n/// \n/// This module provides examples of how to migrate from old patterns to new ones.\npub mod migration_examples {\n    use super::*;\n    \n    /// Example of migrating from exit_with_error\n    /// \n    /// Old pattern:\n    /// ```ignore\n    /// if config.is_none() {\n    ///     exit_with_error(\"Configuration is required\".to_string());\n    /// }\n    /// ```\n    /// \n    /// New pattern (library code):\n    /// ```ignore\n    /// fn load_config() -\u003e CubteraResult\u003cConfig\u003e {\n    ///     config.ok_or_else(|| CubteraError::config_error(\"Configuration is required\"))\n    /// }\n    /// ```\n    /// \n    /// New pattern (CLI code):\n    /// ```ignore\n    /// let config = load_config()\n    ///     .unwrap_or_exit_with_log(\"Failed to load configuration\");\n    /// ```\n    pub fn migration_example_exit_with_error() {\n        / n(file_name);\n\n            // Skip if file exists and overwrite is disabled\n            if dst_path.exists() \u0026\u0026 !overwrite_existing {\n                continue;\n            }\n\n            std::fs::copy(src_path, \u0026dst_path)\n                .map_err(|e| ToolsError::operation_failed(format!(\"Failed to copy file {:?} to {:?}: {}\", src_path, dst_path, e)))?;\n        }\n    }\n\n    Ok(())\n}\n\n/// Recursively copies a folder and all its contents\n/// \n/// # Arguments\n/// * `src` - Source folder path\n/// * `dst` - Destination folder path\n/// * `overwrite_existing` - Whether to overwrite existing files\n/// \n/// # Returns\n/// * `Result\u003c()\u003e` - Success or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::fs::copy_folder;\n/// use std::path::PathBuf;\n/// \n/// copy_folder(\n///     PathBuf::from(\"src_folder\"),\n///     \u0026PathBuf::from(\"dst_folder\"),\n///     true\n/// )?;\n/// ```\npub fn copy_folder(src: PathBuf, dst: \u0026PathBuf, overwrite_existing: bool) -\u003e Result\u003c()\u003e {\n    // Validate source exists\n    if !src.exists() {\n        return Err(ToolsError::file_not_found(src.to_string_lossy().to_string()));\n    }\n\n    if !src.is_dir() {\n        return Err(ToolsError::invalid_input(format!(\"Source path is not a directory: {:?}\", src)));\n    }\n\n    // Copy files in current directory\n    copy_all_files_in_folder(src.clone(), dst, overwrite_existing)?;\n\n    // Recursively copy subdirectories\n    for entry in WalkDir::new(\u0026src).max_depth(1).into_iter().filter_map(|e| e.ok()) {\n        if entry.file_type().is_dir() \u0026\u0026 entry.path() != src {\n            let folder_name = entry.path().file_name()\n                .ok_or_else(|| ToolsError::operation_failed(\"Failed to get folder name\".to_string()))?;\n            let dst_subfolder = dst.join(folder_name);\n            \n            copy_folder(entry.path().to_path_buf(), \u0026dst_subfolder, overwrite_existing)?;\n        }\n    }\n\n    Ok(())\n}\n\n/// Checks if a path exists and returns it if valid\n/// \n/// # Arguments\n/// * `path` - Path to check\n/// \n/// # Returns\n/// * `Result\u003cPathBuf\u003e` - The path if it exists, error otherwise\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::fs::check_path;\n/// use std::path::PathBuf;\n/// \n/// let valid_path = check_path(PathBuf::from(\"existing_file.txt\"))?;\n/// ```\npub fn check_path(path: PathBuf) -\u003e Result\u003cPathBuf\u003e {\n    if path.exists() {\n        Ok(path)\n    } else {\n        Err(ToolsError::file_not_found(path.to_string_lossy().to_string()))\n    }\n}\n\n/// Creates a directory and all parent directories if they don't exist\n/// \n/// # Arguments\n/// * `path` - Directory path to create\n/// \n/// # Returns\n/// * `Result\u003c()\u003e` - Success or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::fs::create_dir_all;\n/// use std::path::PathBuf;\n/// \n/// create_dir_all(\u0026PathBuf::from(\"path/to/new/directory\"))?;\n/// ```\npub fn create_dir_all(path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    std::fs::create_dir_all(path)\n        .map_err(|e| ToolsError::operation_failed(format!(\"Failed to create directory {:?}: {}\", path, e)))\n}\n\n/// Removes a file\n/// \n/// # Arguments\n/// * `path` - File path to remove\n/// \n/// # Returns\n/// * `Result\u003c()\u003e` - Success or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::fs::remove_file;\n/// use std::path::PathBuf;\n/// \n/// remove_file(\u0026PathBuf::from(\"file_to_delete.txt\"))?;\n/// ```\npub fn remove_file(path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    if !path.exists() {\n        return Err(ToolsError::file_not_found(path.to_string_lossy().to_string()));\n    }\n\n    if !path.is_file() {\n        return Err(ToolsError::invalid_input(format!(\"Path is not a file: {:?}\", path)));\n    }\n\n    std::fs::remove_file(path)\n        .map_err(|e| ToolsError::operation_failed(format!(\"Failed to remove file {:?}: {}\", path, e)))\n}\n\n/// Removes a directory and all its contents\n/// \n/// # Arguments\n/// * `path` - Directory path to remove\n/// \n/// # Returns\n/// * `Result\u003c()\u003e` - Success or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::fs::remove_dir_all;\n/// use std::path::PathBuf;\n/// \n/// remove_dir_all(\u0026PathBuf::from(\"directory_to_delete\"))?;\n/// ```\npub fn remove_dir_all(path: \u0026PathBuf) -\u003e Result\u003c()\u003e {\n    if !path.exists() {\n        return Err(ToolsError::file_not_found(path.to_string_lossy().to_string()));\n    }\n\n    if !path.is_dir() {\n        return Err(ToolsError::invalid_input(format!(\"Path is not a directory: {:?}\", path)));\n    }\n\n    std::fs::remove_dir_all(path)\n        .map_err(|e| ToolsError::operation_failed(format!(\"Failed to remove directory {:?}: {}\", path, e)))\n}\n\n/// Reads the contents of a file as a string\n/// \n/// # Arguments\n/// * `path` - File path to read\n/// \n/// # Returns\n/// * `Result\u003cString\u003e` - File contents or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::fs::read_to_string;\n/// use std::path::PathBuf;\n/// \n/// let contents = read_to_string(\u0026PathBuf::from(\"file.txt\"))?;\n/// ```\npub fn read_to_string(path: \u0026PathBuf) -\u003e Result\u003cString\u003e {\n    if !path.exists() {\n        return Err(ToolsError::file_not_found(path.to_string_lossy().to_string()));\n    }\n\n    if !path.is_file() {\n        return Err(ToolsError::invalid_input(format!(\"Path is not a file: {:?}\", path)));\n    }\n\n    std::fs::read_to_string(path)\n        .map_err(|e| ToolsError::operation_failed(format!(\"Failed to read file {:?}: {}\", path, e)))\n}\n\n/// Writes a string to a file\n/// \n/// # Arguments\n/// * `path` - File path to write to\n/// * `contents` - String contents to write\n/// \n/// # Returns\n/// * `Result\u003c()\u003e` - Success or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools: ory's workdir (root directory)\n    let repo_root = repo.workdir()\n        .ok_or_else(|| ToolsError::Git(git2::Error::from_str(\"Could not get repository working directory\")))?;\n\n    // Convert the absolute path to a path relative to the repository root\n    let relative_path = abs_path.strip_prefix(repo_root)\n        .map_err(|_| ToolsError::Git(git2::Error::from_str(\"Failed to get relative path\")))?;\n\n    // Get the HEAD commit\n    let head = repo.head()?;\n    let commit = head.peel_to_commit()?;\n    \n    // Get the tree from the commit\n    let tree = commit.tree()?;\n    \n    // Get the tree entry for the relative_path\n    let entry = tree.get_path(relative_path)?;\n\n    // Get the object ID (SHA) of the entry\n    let entry_sha = entry.id().to_string();\n\n    Ok(entry_sha)\n}\n\n/// Gets the commit SHA for the repository containing the given path\n/// \n/// # Arguments\n/// * `path` - PathBuf to any file/directory in the repository\n/// \n/// # Returns\n/// * `Result\u003cString\u003e` - SHA of the HEAD commit or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::git::get_commit_sha;\n/// use std::path::PathBuf;\n/// \n/// let sha = get_commit_sha(\u0026PathBuf::from(\".\"))?;\n/// ```\npub fn get_commit_sha(path: \u0026PathBuf) -\u003e Result\u003cString\u003e {\n    let abs_path = path_to_absolute(path)?;\n\n    // Open the repository\n    let repo = git2::Repository::discover(abs_path)?;\n\n    // Get the HEAD commit\n    let head = repo.head()?;\n    let commit = head.peel_to_commit()?;\n\n    // Get the commit ID (SHA)\n    let commit_sha = commit.id().to_string();\n\n    Ok(commit_sha)\n}\n\n/// Gets the current branch name for the repository containing the given path\n/// \n/// # Arguments\n/// * `path` - PathBuf to any file/directory in the repository\n/// \n/// # Returns\n/// * `Result\u003cString\u003e` - Name of the current branch or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::git::get_current_branch;\n/// use std::path::PathBuf;\n/// \n/// let branch = get_current_branch(\u0026PathBuf::from(\".\"))?;\n/// ```\npub fn get_current_branch(path: \u0026PathBuf) -\u003e Result\u003cString\u003e {\n    let abs_path = path_to_absolute(path)?;\n    let repo = git2::Repository::discover(abs_path)?;\n    \n    let head = repo.head()?;\n    let branch_name = head.shorthand()\n        .ok_or_else(|| ToolsError::Git(git2::Error::from_str(\"Failed to get branch name\")))?;\n    \n    Ok(branch_name.to_string())\n}\n\n/// Checks if the repository at the given path has uncommitted changes\n/// \n/// # Arguments\n/// * `path` - PathBuf to any file/directory in the repository\n/// \n/// # Returns\n/// * `Result\u003cbool\u003e` - true if there are uncommitted changes, false otherwise\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::git::has_uncommitted_changes;\n/// use std::path::PathBuf;\n/// \n/// let has_changes = has_uncommitted_changes(\u0026PathBuf::from(\".\"))?;\n/// ```\npub fn has_uncommitted_changes(path: \u0026PathBuf) -\u003e Result\u003cbool\u003e {\n    let abs_path = path_to_absolute(path)?;\n    let repo = git2::Repository::discover(abs_path)?;\n    \n    let mut status_options = git2::StatusOptions::new();\n    status_options.include_untracked(true);\n    \n    let statuses = repo.statuses(Some(\u0026mut status_options))?;\n    \n    Ok(!statuses.is_empty())\n}\n\n/// Gets the remote URL for the repository containing the given path\n/// \n/// # Arguments\n/// * `path` - PathBuf to any file/directory in the repository\n/// * `remote_name` - Name of the remote (default: \"origin\")\n/// \n/// # Returns\n/// * `Result\u003cString\u003e` - URL of the remote or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::git::get_remote_url;\n/// use std::path::PathBuf;\n/// \n/// let url = get_remote_url(\u0026PathBuf::from(\".\"), \"origin\")?;\n/// ```\npub fn get_remote_url(path: \u0026PathBuf, remote_name: \u0026str) -\u003e Result\u003cString\u003e {\n    let abs_path = path_to_absolute(path)?;\n    let repo = git2::Repository::discover(abs_path)?;\n    \n    let remote = repo.find_remote(remote_name)?;\n    let url = remote.url()\n        .ok_or_else(|| ToolsError::Git(git2::Error::from_str(\"Remote URL not found\")))?;\n    \n    Ok(url.to_string())\n}\n\n/// Converts a PathBuf to absolute path\n/// \n/// # Arguments\n/// * `path` - PathBuf to convert\n/// \n/// # Returns\n/// * `Result\u003cPathBuf\u003e` - Absolute path or error\nfn path_to_absolute(path: \u0026PathBuf) -\u003e Result\u003cPathBuf\u003e {\n    if path.is_absolute() {\n        Ok(path.clone())\n    } else {\n        let current_dir = std::env::current_dir()\n            .map_err(|e| ToolsError::path_error(format!(\"Failed to get current directory: {}\", e)))?;\n        Ok(current_dir.join(path))\n    }\n} ","traces":[{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":95,"address":[],"length":0,"stats":{"Line":  read_json_file(\u0026PathBuf::from(\"config.json\"))?;\n/// ```\npub fn read_json_file(path: \u0026PathBuf) -\u003e Result\u003cValue\u003e {\n    if !path.exists() {\n        return Err(ToolsError::file_not_found(path.to_string_lossy().to_string()));\n    }\n\n    let content = std::fs::read_to_string(path)\n        .map_err(|e| ToolsError::operation_failed(format!(\"Failed to read file {:?}: {}\", path, e)))?;\n\n    let json_data: Value = serde_json::from_str(\u0026content)\n        .map_err(|e| ToolsError::validation_error(format!(\"Invalid JSON in file {:?}: {}\", path, e)))?;\n\n    Ok(json_data)\n}\n\n/// Merges two JSON values recursively\n/// \n/// # Arguments\n/// * `target` - Target JSON value to merge into\n/// * `source` - Source JSON value to merge from\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::json::merge_values;\n/// use serde_json::json;\n/// \n/// let mut target = json!({\"a\": 1});\n/// let source = json!({\"b\": 2});\n/// merge_values(\u0026mut target, \u0026source);\n/// ```\npub fn merge_values(target: \u0026mut Value, source: \u0026Value) {\n    if let (Value::Object(target_obj), Value::Object(source_obj)) = (target, source) {\n        for (key, source_value) in source_obj {\n            if let serde_json::map::Entry::Vacant(entry) = target_obj.entry(key) {\n                entry.insert(source_value.clone());\n            } else if let serde_json::map::Entry::Occupied(mut entry) = target_obj.entry(key) {\n                if source_value.is_object() \u0026\u0026 entry.get().is_object() {\n                    merge_values(entry.get_mut(), source_value);\n                }\n            }\n        }\n    }\n}\n\n/// Validates a JSON value against a JSON schema\n/// \n/// # Arguments\n/// * `json` - JSON value to validate\n/// * `schema` - JSON schema to validate against\n/// \n/// # Returns\n/// * `Result\u003cValue\u003e` - Validated JSON or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::json::validate_json_by_schema;\n/// use serde_json::json;\n/// \n/// let json_data = json!({\"name\": \"John\", \"age\": 30});\n/// let schema = json!({\"type\": \"object\", \"properties\": {\"name\": {\"type\": \"string\"}, \"age\": {\"type\": \"number\"}}});\n/// let validated = validate_json_by_schema(\u0026json_data, \u0026schema)?;\n/// ```\npub fn validate_json_by_schema(json: \u0026Value, schema: \u0026Value) -\u003e Result\u003cValue\u003e {\n    let validator = jsonschema::validator_for(schema)\n        .map_err(|e| ToolsError::validation_error(format!(\"Invalid schema: {}\", e)))?;\n\n    validator.validate(json)\n        .map_err(|e| ToolsError::validation_error(format!(\"Validation failed: {}\", e)))?;\n\n    Ok(json.clone())\n}\n\n// TODO: Add more JSON operations as needed\n// - read_and_validate_json\n// - write_json_file\n// - pretty_print_json\n// - json_path operations\n// etc. ","traces":[{"line":20,"address":[],"length":0,"stats":{"Line":7}},{"line":21,"address":[],"length":0,"stats":{"Line":7}},{"line":22,"address":[],"length":0,"stats":{"Line":1}},{"line":25,"address":[],"length":0,"stats":{"Line":18}},{"line":26,"address":[],"length":0,"stats":{"Line":6}},{"line":28,"address":[],"length":0,"stats":{"Line":4}},{"line":29,"address":[],"length":0,"stats":{"Line":8}},{"line":49,"address":[],"length":0,"stats":{"Line":11}},{"line":50,"address":[],"length":0,"stats":{"Line":32}},{"line":51,"address":[],"length":0,"stats":{"Line":1038}},{"line":52,"address":[],"length":0,"stats":{"Line":509}},{"line":54,"address":[],"length":0,"stats":{"Line":15}},{"line":55,"address":[],"length":0,"stats":{"Line":9}},{"line":56,"address":[],"length":0,"stats":{"Line":6}},{"line":81,"address":[],"length":0,"stats":{"Line":6}},{"line":82,"address":[],"length":0,"stats":{"Line":17}},{"line":83,"address":[],"length":0,"stats":{"Line":10}},{"line":86,"address":[],"length":0,"stats":{"Line":8}},{"line":88,"address":[],"length":0,"stats":{"Line":3}}],"covered":19,"coverable":19},{"path":["/","Users"," ror::invalid_input(\"Command cannot be empty\".to_string()));\n    }\n\n    let mut command_parts = command.split_whitespace();\n    let binary = command_parts.next()\n        .ok_or_else(|| ToolsError::invalid_input(\"Command is empty\".to_string()))?;\n    \n    let path = string_to_path(binary)?;\n    let args: Vec\u003c\u0026str\u003e = command_parts.collect();\n\n    let mut process = Command::new(path)\n        .current_dir(current_dir)\n        .args(args)\n        .envs(env_vars)\n        .spawn()\n        .map_err(|e| ToolsError::process_error(format!(\"Failed to spawn process: {}\", e)))?;\n\n    let status = process.wait()\n        .map_err(|e| ToolsError::process_error(format!(\"Failed to wait for process: {}\", e)))?;\n\n    Ok(status)\n}\n\n// TODO: Add more process operations as needed\n// - execute_command_with_output\n// - execute_command_async\n// - kill_process\n// - process_exists\n// etc. ","traces":[{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":16},{"path":["/","Users","denis","Projects","cubtera","src","tools","string.rs"],"content":"use crate::tools::error::{Result, ToolsError};\nuse std::path::{Path, PathBuf};\n\n/// Converts a string path to PathBuf with environment variable expansion and tilde expansion\n/// \n/// # Arguments\n/// * `s` - String path that may contain environment variables and tilde\n/// \n/// # Returns\n/// * `Result\u003cPathBuf\u003e` - Expanded path or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::string::string_to_path;\n/// \n/// let path = string_to_path(\"~/Documents\")?;\n/// let path = string_to_path(\"/$HOME/test\")?;\n/// let path = string_to_path(\"/${USER}/project\")?;\n/// ```\npub fn string_to_path(s: \u0026str) -\u003e Result\u003cPathBuf\u003e {\n    if s.is_empty() {\n        return Ok(PathBuf::from(\"\"));\n    }\n\n    let mut path = s.to_string();\n\n    // Expand tilde to home directory\n    if path.starts_with('~') {\n        let home = std::env::var(\"HOME\")\n            .map_err(|_| ToolsError::path_error(\"HOME environment variable not found\"))?;\n        path = path.replacen('~', \u0026home, 1);\n    }\n\n    // Expand relative path to absolute\n    if path.starts_with(\"./\") {\n        let pwd = std::env::current_dir()\n            .map_err(|e| ToolsError::path_error(format!(\"Failed to get current directory: {}\", e)))?;\n        path = path.replacen(\".\", pwd.to_str().unwrap_or(\"\"), 1);\n    }\n\n    // Expand environment variables in path string\n    // Replace ${VAR} and $VAR with actual values\n    let with_env = std::env::vars().fold(path, |s, (k, v)| {\n        s.replace(\u0026format!(\"${}\", k), \u0026v)\n            .replace(\u0026format!(\"${{{}}}\", k), \u0026v)\n    });\n\n    Ok(PathBuf::from(with_env))\n}\n\n/// Converts a path string to absolute path with tilde and environment variable expansion\n/// \n/// # Arguments\n/// * `s` - String path to convert\n/// \n/// # Returns\n/// * `Result\u003cString\u003e` - Absolute path as string or error\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::string::convert_path_to_absolute;\n/// \n/// let abs_path = convert_path_to_absolute(\"~/Documents\".to_string())?;\n/// let abs_path = convert_path_to_absolute(\"./relative/path\".to_string())?;\n/// ```\npub fn convert_path_to_absolute(s: String) -\u003e Result\u003cString\u003e {\n    if s.starts_with('~') {\n        let home = std::env::var(\"HOME\")\n            .map_err(|_| ToolsError::path_error(\"HOME environment variable not found\"))?;\n        Ok(s.replacen('~', \u0026home, 1))\n    } else if s.starts_with('.') {\n        let pwd = std::env::var(\"PWD\")\n            .or_else(|_| std::env::current_dir().map(|p| p.to_string_lossy().to_string()))\n            .map_err(|e| ToolsError::path_error(format!(\"Failed to get current directory: {}\", e)))?;\n        Ok(s.replacen('.', \u0026pwd, 1))\n    } else if s.starts_with('/') {\n        Ok(s)\n    } else if Path::new(\u0026s).is_relative() {\n        let current_dir = std::env::current_dir()\n            .map_err(|e| ToolsError::path_error(format!(\"Failed to get current directory: {}\", e)))?;\n        Ok(current_dir\n            .join(\u0026s)\n            .to_str()\n            .ok_or_else(|| ToolsError::path_error(\"Failed to convert path to string\"))?\n            .to_string())\n    } else {\n        Ok(s)\n    }\n}\n\n/// Capitalizes the first character of a string\n/// \n/// # Arguments\n/// * `s` - String slice to capitalize\n/// \n/// # Returns\n/// * `String` - String with first character capitalized\n/// \n/// # Examples\n/// ```\n/// use cubtera::tools::string::capitalize_first;\n/// \n/// assert_eq!(capitalize_first(\"hello\"), \"Hello\");\n/// assert_eq!(capitalize_first(\"\"), \"\");\n/// assert_eq!(capitalize_first(\"a\"), \"A\");\n/// ```\npub fn capitalize_first(s: \u0026str) -\u003e String {\n    let mut c = s.chars();\n    match c.next() {\n        None =\u003e String::new(),\n        Some(f) =\u003e f.to_uppercase().collect::\u003cString\u003e() + c.as_str(),\n    }\n}\n\n/// Converts a PathBuf to absolute path\n/// \n/// # Arguments\n/// * `path` - PathBuf to convert\n/// \n/// # Returns\n/// * `Result\u003cPathBuf\u003e` - Absolute path or error\nfn path_to_absolute(path: \u0026PathBuf) -\u003e Result\u003cPathBuf\u003e {\n    if path.is_absolute() {\n        Ok(path.clone())\n    } else {\n        let current_dir = std::env::current_dir()\n            .map_err(|e| ToolsError::path_error(format!(\"Failed to get current directory: {}\", e)))?;\n        Ok(current_dir.join(path))\n    }\n} ","traces":[{"line":20,"address":[],"length":0,"stats":{"Line":14}},{"line":21,"address":[],"length":0,"stats":{"Line":28}},{"line":22,"address":[],"length":0,"stats":{"Line":1}},{"line":29,"address":[],"length":0,"stats":{"Line":7}},{"line":30,"address":[],"length":0,"stats":{"Line":6}},{"line":35,"address":[],"length":0,"stats":{"Line":12}},{"line":36,"address":[],"length":0,"stats":{"Line":2}},{"line":37,"address":[],"length":0,"stats":{"Line":1}},{"line":43,"address":[],"length":0,"stats":{"Line":824}},{"line":44,"address":[],"length":0,"stats":{"Line":3248}},{"line":45,"address":[],"length":0,"stats":{"Line":1624}},{"line":66,"address":[],"length":0,"stats":{"Line":13}},{"line":67,"address":[],"length":0,"stats":{"Line":13}},{"line":68,"address":[],"length":0,"stats":{"Line":7}},{"line":69,"address":[],"length":0,"stats":{"Line":6}},{"line":71,"address":[],"length":0,"stats":{"Line":9}},{"line":72,"address":[],"length":0,"stats":{"Line":2}},{"line":73,"address":[],"length":0,"stats":{"Line":1}},{"line":74,"address":[],"length":0,"stats":{"Line":1}},{"line":76,"address":[],"length":0,"stats":{"Line":8}},{"line":77,"address":[],"length":0,"stats":{"Line":7}},{"line":78,"address":[],"length":0,"stats":{"Line":1}},{"line":79,"address":[],"length":0,"stats":{"Line":2}},{"line":80,"address":[],"length":0,"stats":{"Line":1}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":1}},{"line":87,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":6}},{
