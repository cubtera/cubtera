rate::tools::error::*;\n\n    #[test]\n    fn test_error_creation() {\n        let error = ToolsError::path_error(\"test path error\");\n        assert!(error.to_string().contains(\"test path error\"));\n\n        let error = ToolsError::process_error(\"test process error\");\n        assert!(error.to_string().contains(\"test process error\"));\n\n        let error = ToolsError::validation_error(\"test validation error\");\n        assert!(error.to_string().contains(\"test validation error\"));\n    }\n\n    #[test]\n    fn test_error_from_conversions() {\n        // Test automatic conversions from standard error types\n        let io_error = std::io::Error::new(std::io::ErrorKind::NotFound, \"file not found\");\n        let tools_error: ToolsError = io_error.into();\n        assert!(tools_error.to_string().contains(\"IO error\"));\n\n        let json_error = serde_json::from_str::\u003cserde_json::Value\u003e(\"invalid json\");\n        assert!(json_error.is_err());\n        let tools_error: ToolsError = json_error.unwrap_err().into();\n        assert!(tools_error.to_string().contains(\"JSON error\"));\n    }\n\n    #[test]\n    fn test_result_type() {\n        fn test_function() -\u003e Result\u003cString\u003e {\n            Ok(\"success\".to_string())\n        }\n\n        fn test_error_function() -\u003e Result\u003cString\u003e {\n            Err(ToolsError::operation_failed(\"test error\"))\n        }\n\n        assert!(test_function().is_ok());\n        assert!(test_error_function().is_err());\n    }\n} ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","tools","tests","fs_tests.rs"],"content":"// TODO: Implement comprehensive file system tests\n// - copy_folder tests with temp directories\n// - copy_all_files_in_folder tests\n// - check_path tests\n// - create_dir_all tests\n// - remove_file/remove_dir_all tests\n// - read_to_string/write_string tests\n// - get_metadata tests\n// - error scenarios tests\n// - permission tests\n// - large file tests\n// - concurrent access tests \n\n#[cfg(test)]\nmod tests {\n    use crate::tools::fs::*;\n    use crate::tools::error::ToolsError;\n    use std::fs;\n    use std::path::PathBuf;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_copy_all_files_in_folder_success() {\n        let src_dir = TempDir::new().unwrap();\n        let dst_dir = TempDir::new().unwrap();\n\n        // Create test files\n        fs::write(src_dir.path().join(\"file1.txt\"), \"content1\").unwrap();\n        fs::write(src_dir.path().join(\"file2.txt\"), \"content2\").unwrap();\n        fs::create_dir(src_dir.path().join(\"subdir\")).unwrap(); // Should be ignored\n\n        let result = copy_all_files_in_folder(\n            src_dir.path().to_path_buf(),\n            \u0026dst_dir.path().to_path_buf(),\n            true,\n        );\n\n        assert!(result.is_ok());\n        assert!(dst_dir.path().join(\"file1.txt\").exists());\n        assert!(dst_dir.path().join(\"file2.txt\").exists());\n        assert!(!dst_dir.path().join(\"subdir\").exists()); // Directories not copied\n\n        let content1 = fs::read_to_string(dst_dir.path().join(\"file1.txt\")).unwrap();\n        assert_eq!(content1, \"content1\");\n    }\n\n    #[test]\n    fn test_copy_all_files_in_folder_overwrite_false() {\n        let src_dir = TempDir::new().unwrap();\n        let dst_dir = TempDir::new().unwrap();\n\n        // Create source file\n        fs::write(src_dir.path().join(\"file.txt\"), \"new_content\").unwrap();\n        \n        // Create existing destination file\n        fs::write(dst_dir.path().join(\"file.txt\"), \"old_content\").unwrap();\n\n        let result = copy_all_files_in_folder(\n            src_dir.path().to_path_buf(),\n            \u0026dst_dir.path().to_path_buf(),\n            false, // Don't overwrite\n        );\n\n        assert!(result.is_ok());\n        \n        // File should not be overwritten\n        let content = fs::read_to_string(dst_dir.path().join(\"file.txt\")).unwrap();\n        assert_eq!(content, \"old_content\");\n    }\n\n    #[test]\n    fn test_copy_all_files_in_folder_overwrite_true() {\n        let src_dir = TempDir::new().unwrap();\n        let dst_dir = TempDir::new().unwrap();\n\n        // Create source file\n        fs::write(src_dir.path().join(\"file.txt\"), \"new_content\").unwrap();\n        \n        // Create existing destination file\n        fs::write(dst_dir.path().join(\"file.txt\"), \"old_content\").unwrap();\n\n        let result = copy_all_files_in_folder(\n            src_dir.path().to_path_buf(),\n            \u0026dst_dir.path().to_path_buf(),\n            true, // Overwrite\n        );\n\n        assert!(result.is_ok());\n        \n        // File should be overwritten\n        let content = fs::read_to_string(dst_dir.path().join(\"file.txt\")).unwrap();\n        assert_eq!(content, \"new_content\");\n    }\n\n    #[test]\n    fn test_copy_all_files_in_folder_source_not_exists() {\n        let dst_dir = TempDir::new().unwrap();\n        let non_existent = PathBuf::from(\"/non/existent/path\");\n\n        let result = copy_all_files_in_folder(\n            non_existent,\n            \u0026dst_dir.path().to_path_buf(),\n            true,\n        );\n\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::FileNotFound { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected FileNotFound error\"),\n        }\n    }\n\n    #[test]\n    fn test_copy_all_files_in_folder_source_not_directory() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"file.txt\");\n        fs::write(\u0026file_path, \"content\").unwrap();\n\n        let dst_dir = TempDir::new().unwrap();\n\n        let result = copy_all_files_in_folder(\n            file_path,\n            \u0026dst_dir.path().to_path_buf(),\n            true,\n        );\n\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::InvalidInput { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected InvalidInput error\"),\n        }\n    }\n\n    #[test]\n    fn test_copy_folder_recursive() {\n        let src_dir = TempDir::new().unwrap();\n        let dst_dir = TempDir::new().unwrap();\n\n        // Create nested structure\n        fs::write(src_dir.path().join(\"root_file.txt\"), \"root\").unwrap();\n        fs::create_dir(src_dir.path().join(\"subdir\")).unwrap();\n        fs::write(src_dir.path().join(\"subdir/sub_file.txt\"), \"sub\").unwrap();\n        fs::create_dir(src_dir.path().join(\"subdir/nested\")).unwrap();\n        fs::write(src_dir.path().join(\"subdir/nested/deep_file.txt\"), \"deep\").unwrap();\n\n        let result = copy_folder(\n            src_dir.path().to_path_buf(),\n            \u0026dst_dir.path().to_path_buf(),\n            true,\n        );\n\n        assert!(result.is_ok());\n        \n        // Check all files were copied\n        assert!(dst_dir.path().join(\"root_file.txt\").exists());\n        assert!(dst_dir.path().join(\"subdir/sub_file.txt\").exists());\n        assert!(dst_dir.path().join(\"subdir/nested/deep_file.txt\").exists());\n\n        // Check content\n        let content = fs::read_to_string(dst_dir.path().join(\"subdir/nested/deep_file.txt\")).unwrap();\n        assert_eq!(content, \"deep\");\n    }\n\n    #[test]\n    fn test_check_path_exists() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.txt\");\n        fs::write(\u0026file_path, \"content\").unwrap();\n\n        let result = check_path(file_path.clone());\n        assert!(result.is_ok());\n        assert_eq!(result.unwrap(), file_path);\n    }\n\n    #[test]\n    fn test_check_path_not_exists() {\n        let non_existent = PathBuf::from(\"/non/existent/path\");\n        let result = check_path(non_existent);\n        \n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::FileNotFound { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected FileNotFound error\"),\n        }\n    }\n\n    #[test]\n    fn test_create_dir_all() {\n        let temp_dir = TempDir::new().unwrap();\n        let nested_path = temp_dir.path().join(\"a/b/c/d\");\n\n        let result = create_dir_all(\u0026nested_path);\n        assert!(result.is_ok());\n        assert!(nested_path.exists());\n        assert!(nested_path.is_dir());\n    }\n\n    #[test]\n    fn test_remove_file() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"to_delete.txt\");\n        fs::write(\u0026file_path, \"content\").unwrap();\n\n        assert!(file_path.exists());\n\n        let result = remove_file(\u0026file_path);\n        assert!(result.is_ok());\n        assert!(!file_path.exists());\n    }\n\n    #[test]\n    fn test_remove_file_not_exists() {\n        let non_existent = PathBuf::from(\"/non/existent/file.txt\");\n        let result = remove_file(\u0026non_existent);\n        \n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::FileNotFound { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected FileNotFound error\"),\n        }\n    }\n\n    #[test]\n    fn test_remove_file_is_directory() {\n        let temp_dir = TempDir::new().unwrap();\n        let dir_path = temp_dir.path().join(\"directory\");\n        fs::create_dir(\u0026dir_path).unwrap();\n\n        let result = remove_file(\u0026dir_path);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::InvalidInput { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected InvalidInput error\"),\n        }\n    }\n\n    #[test]\n    fn test_remove_dir_all() {\n        let temp_dir = TempDir::new().unwrap();\n        let dir_path = temp_dir.path().join(\"to_delete\");\n        fs::create_dir_all(\u0026dir_path.join(\"nested\")).unwrap();\n        fs::write(dir_path.join(\"file.txt\"), \"content\").unwrap();\n        fs::write(dir_path.join(\"nested/file.txt\"), \"nested\").unwrap();\n\n        assert!(dir_path.exists());\n\n        let result = remove_dir_all(\u0026dir_path);\n        assert!(result.is_ok());\n        assert!(!dir_path.exists());\n    }\n\n    #[test]\n    fn test_read_to_string() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.txt\");\n        let content = \"Hello, world!\\nMultiline content\\nWith unicode: 🚀\";\n        fs::write(\u0026file_path, content).unwrap();\n\n        let result = read_to_string(\u0026file_path);\n        assert!(result.is_ok());\n        assert_eq!(result.unwrap(), content);\n    }\n\n    #[test]\n    fn test_read_to_string_not_exists() {\n        let non_existent = PathBuf::from(\"/non/existent/file.txt\");\n        let result = read_to_string(\u0026non_existent);\n        \n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::FileNotFound { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected FileNotFound error\"),\n        }\n    }\n\n    #[test]\n    fn test_read_to_string_is_directory() {\n        let temp_dir = TempDir::new().unwrap();\n        let result = read_to_string(\u0026temp_dir.path().to_path_buf());\n        \n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::InvalidInput { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected InvalidInput error\"),\n        }\n    }\n\n    #[test]\n    fn test_write_string() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"output.txt\");\n        let content = \"Test content\\nWith newlines\\nAnd unicode: 🎉\";\n\n        let result = write_string(\u0026file_path, content);\n        assert!(result.is_ok());\n        \n        let read_content = fs::read_to_string(\u0026file_path).unwrap();\n        assert_eq!(read_content, content);\n    }\n\n    #[test]\n    fn test_write_string_create_parent_dirs() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"nested/deep/file.txt\");\n        let content = \"Content in nested directory\";\n\n        let result = write_string(\u0026file_path, content);\n        assert!(result.is_ok());\n        \n        assert!(file_path.exists());\n        let read_content = fs::read_to_string(\u0026file_path).unwrap();\n        assert_eq!(read_content, content);\n    }\n\n    #[test]\n    fn test_get_metadata() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.txt\");\n        let content = \"Test content for metadata\";\n        fs::write(\u0026file_path, content).unwrap();\n\n        let result = get_metadata(\u0026file_path);\n        assert!(result.is_ok());\n        \n        let metadata = result.unwrap();\n        assert!(metadata.is_file());\n        assert_eq!(metadata.len(), content.len() as u64);\n    }\n\n    #[test]\n    fn test_get_metadata_directory() {\n        let temp_dir = TempDir::new().unwrap();\n        let result = get_metadata(\u0026temp_dir.path().to_path_buf());\n        \n        assert!(result.is_ok());\n        let metadata = result.unwrap();\n        assert!(metadata.is_dir());\n    }\n\n    #[test]\n    fn test_get_metadata_not_exists() {\n        let non_existent = PathBuf::from(\"/non/existent/file.txt\");\n        let result = get_metadata(\u0026non_existent);\n        \n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::FileNotFound { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected FileNotFound error\"),\n        }\n    }\n\n    // Performance tests\n    #[test]\n    fn test_performance_copy_many_files() {\n        use std::time::Instant;\n        \n        let src_dir = TempDir::new().unwrap();\n        let dst_dir = TempDir::new().unwrap();\n\n        // Create 100 small files\n        for i in 0..100 {\n            fs::write(src_dir.path().join(format!(\"file_{}.txt\", i)), format!(\"content {}\", i)).unwrap();\n        }\n\n        let start = Instant::now();\n        let result = copy_all_files_in_folder(\n            src_dir.path().to_path_buf(),\n            \u0026dst_dir.path().to_path_buf(),\n            true,\n        );\n        let duration = start.elapsed();\n\n        assert!(result.is_ok());\n        assert!(duration.as_millis() \u003c 1000, \"Copying 100 files took too long: {:?}\", duration);\n        \n        // Verify all files were copied\n        for i in 0..100 {\n            assert!(dst_dir.path().join(format!(\"file_{}.txt\", i)).exists());\n        }\n    }\n\n    // Edge cases\n    #[test]\n    fn test_empty_directory_copy() {\n        let src_dir = TempDir::new().unwrap();\n        let dst_dir = TempDir::new().unwrap();\n\n        let result = copy_all_files_in_folder(\n            src_dir.path().to_path_buf(),\n            \u0026dst_dir.path().to_path_buf(),\n            true,\n        );\n\n        assert!(result.is_ok());\n        // Should succeed even with empty directory\n    }\n\n    #[test]\n    fn test_unicode_filenames() {\n        let src_dir = TempDir::new().unwrap();\n        let dst_dir = TempDir::new().unwrap();\n\n        // Create files with unicode names\n        fs::write(src_dir.path().join(\"файл.txt\"), \"русский текст\").unwrap();\n        fs::write(src_dir.path().join(\"文件.txt\"), \"中文内容\").unwrap();\n        fs::write(src_dir.path().join(\"🚀.txt\"), \"emoji filename\").unwrap();\n\n        let result = copy_all_files_in_folder(\n            src_dir.path().to_path_buf(),\n            \u0026dst_dir.path().to_path_buf(),\n            true,\n        );\n\n        assert!(result.is_ok());\n        assert!(dst_dir.path().join(\"файл.txt\").exists());\n        assert!(dst_dir.path().join(\"文件.txt\").exists());\n        assert!(dst_dir.path().join(\"🚀.txt\").exists());\n\n        let content = fs::read_to_string(dst_dir.path().join(\"файл.txt\")).unwrap();\n        assert_eq!(content, \"русский текст\");\n    }\n} ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","tools","tests","git_tests.rs"],"content":"// TODO: Implement comprehensive git tests\n// - get_commit_sha tests with mock repositories\n// - get_blob_sha tests\n// - get_current_branch tests\n// - has_uncommitted_changes tests\n// - get_remote_url tests\n// - error scenarios (no git repo, invalid paths)\n// - performance tests\n// - concurrent access tests ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","tools","tests","json_tests.rs"],"content":"// TODO: Implement comprehensive JSON tests\n// - read_json_file tests with valid/invalid JSON\n// - merge_values tests with complex nested objects\n// - validate_json_by_schema tests\n// - error scenarios (file not found, invalid JSON, schema validation failures)\n// - performance tests with large JSON files\n// - Unicode and special character tests \n\n#[cfg(test)]\nmod tests {\n    use crate::tools::json::*;\n    use crate::tools::error::ToolsError;\n    use serde_json::{json, Value};\n    use std::fs;\n    use std::path::PathBuf;\n    use tempfile::TempDir;\n\n    #[test]\n    fn test_read_json_file_success() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"test.json\");\n        \n        let json_content = json!({\n            \"name\": \"test\",\n            \"version\": \"1.0.0\",\n            \"features\": [\"feature1\", \"feature2\"],\n            \"config\": {\n                \"debug\": true,\n                \"timeout\": 30\n            }\n        });\n        \n        fs::write(\u0026file_path, json_content.to_string()).unwrap();\n        \n        let result = read_json_file(\u0026file_path);\n        assert!(result.is_ok());\n        \n        let loaded_json = result.unwrap();\n        assert_eq!(loaded_json[\"name\"], \"test\");\n        assert_eq!(loaded_json[\"version\"], \"1.0.0\");\n        assert_eq!(loaded_json[\"config\"][\"debug\"], true);\n        assert_eq!(loaded_json[\"config\"][\"timeout\"], 30);\n    }\n\n    #[test]\n    fn test_read_json_file_not_exists() {\n        let non_existent = PathBuf::from(\"/non/existent/file.json\");\n        let result = read_json_file(\u0026non_existent);\n        \n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::FileNotFound { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected FileNotFound error\"),\n        }\n    }\n\n    #[test]\n    fn test_read_json_file_invalid_json() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"invalid.json\");\n        \n        // Write invalid JSON\n        fs::write(\u0026file_path, \"{ invalid json content }\").unwrap();\n        \n        let result = read_json_file(\u0026file_path);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::Validation { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected Validation error\"),\n        }\n    }\n\n    #[test]\n    fn test_read_json_file_empty_file() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"empty.json\");\n        \n        fs::write(\u0026file_path, \"\").unwrap();\n        \n        let result = read_json_file(\u0026file_path);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::Validation { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected Validation error\"),\n        }\n    }\n\n    #[test]\n    fn test_read_json_file_unicode_content() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"unicode.json\");\n        \n        let json_content = json!({\n            \"русский\": \"текст\",\n            \"中文\": \"内容\",\n            \"emoji\": \"🚀🎉\",\n            \"mixed\": \"Hello мир 世界 🌍\"\n        });\n        \n        fs::write(\u0026file_path, json_content.to_string()).unwrap();\n        \n        let result = read_json_file(\u0026file_path);\n        assert!(result.is_ok());\n        \n        let loaded_json = result.unwrap();\n        assert_eq!(loaded_json[\"русский\"], \"текст\");\n        assert_eq!(loaded_json[\"中文\"], \"内容\");\n        assert_eq!(loaded_json[\"emoji\"], \"🚀🎉\");\n    }\n\n    #[test]\n    fn test_merge_values_simple() {\n        let mut target = json!({\"a\": 1, \"b\": 2});\n        let source = json!({\"c\": 3, \"d\": 4});\n        \n        merge_values(\u0026mut target, \u0026source);\n        \n        assert_eq!(target[\"a\"], 1);\n        assert_eq!(target[\"b\"], 2);\n        assert_eq!(target[\"c\"], 3);\n        assert_eq!(target[\"d\"], 4);\n    }\n\n    #[test]\n    fn test_merge_values_nested_objects() {\n        let mut target = json!({\n            \"config\": {\n                \"database\": {\n                    \"host\": \"localhost\",\n                    \"port\": 5432\n                },\n                \"cache\": {\n                    \"enabled\": true\n                }\n            },\n            \"version\": \"1.0.0\"\n        });\n        \n        let source = json!({\n            \"config\": {\n                \"database\": {\n                    \"name\": \"mydb\",\n                    \"ssl\": true\n                },\n                \"logging\": {\n                    \"level\": \"info\"\n                }\n            },\n            \"author\": \"test\"\n        });\n        \n        merge_values(\u0026mut target, \u0026source);\n        \n        // Original values should be preserved\n        assert_eq!(target[\"config\"][\"database\"][\"host\"], \"localhost\");\n        assert_eq!(target[\"config\"][\"database\"][\"port\"], 5432);\n        assert_eq!(target[\"config\"][\"cache\"][\"enabled\"], true);\n        assert_eq!(target[\"version\"], \"1.0.0\");\n        \n        // New values should be added\n        assert_eq!(target[\"config\"][\"database\"][\"name\"], \"mydb\");\n        assert_eq!(target[\"config\"][\"database\"][\"ssl\"], true);\n        assert_eq!(target[\"config\"][\"logging\"][\"level\"], \"info\");\n        assert_eq!(target[\"author\"], \"test\");\n    }\n\n    #[test]\n    fn test_merge_values_overwrite_non_objects() {\n        let mut target = json!({\"key\": \"original_value\"});\n        let source = json!({\"key\": \"new_value\"});\n        \n        merge_values(\u0026mut target, \u0026source);\n        \n        // Non-object values should not be merged, original should be preserved\n        assert_eq!(target[\"key\"], \"original_value\");\n    }\n\n    #[test]\n    fn test_merge_values_arrays() {\n        let mut target = json!({\"items\": [1, 2, 3]});\n        let source = json!({\"items\": [4, 5, 6]});\n        \n        merge_values(\u0026mut target, \u0026source);\n        \n        // Arrays should not be merged, original should be preserved\n        assert_eq!(target[\"items\"], json!([1, 2, 3]));\n    }\n\n    #[test]\n    fn test_merge_values_empty_objects() {\n        let mut target = json!({});\n        let source = json!({\"key\": \"value\"});\n        \n        merge_values(\u0026mut target, \u0026source);\n        \n        assert_eq!(target[\"key\"], \"value\");\n    }\n\n    #[test]\n    fn test_merge_values_non_objects() {\n        let mut target = json!(\"string\");\n        let source = json!({\"key\": \"value\"});\n        \n        merge_values(\u0026mut target, \u0026source);\n        \n        // Should not merge if target is not an object\n        assert_eq!(target, json!(\"string\"));\n    }\n\n    #[test]\n    fn test_validate_json_by_schema_success() {\n        let json_data = json!({\n            \"name\": \"John Doe\",\n            \"age\": 30,\n            \"email\": \"john@example.com\"\n        });\n        \n        let schema = json!({\n            \"type\": \"object\",\n            \"properties\": {\n                \"name\": {\"type\": \"string\"},\n                \"age\": {\"type\": \"number\"},\n                \"email\": {\"type\": \"string\"}\n            },\n            \"required\": [\"name\", \"age\"]\n        });\n        \n        let result = validate_json_by_schema(\u0026json_data, \u0026schema);\n        assert!(result.is_ok());\n        assert_eq!(result.unwrap(), json_data);\n    }\n\n    #[test]\n    fn test_validate_json_by_schema_missing_required() {\n        let json_data = json!({\n            \"name\": \"John Doe\"\n            // Missing required \"age\" field\n        });\n        \n        let schema = json!({\n            \"type\": \"object\",\n            \"properties\": {\n                \"name\": {\"type\": \"string\"},\n                \"age\": {\"type\": \"number\"}\n            },\n            \"required\": [\"name\", \"age\"]\n        });\n        \n        let result = validate_json_by_schema(\u0026json_data, \u0026schema);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::Validation { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected Validation error\"),\n        }\n    }\n\n    #[test]\n    fn test_validate_json_by_schema_wrong_type() {\n        let json_data = json!({\n            \"name\": \"John Doe\",\n            \"age\": \"thirty\" // Should be number, not string\n        });\n        \n        let schema = json!({\n            \"type\": \"object\",\n            \"properties\": {\n                \"name\": {\"type\": \"string\"},\n                \"age\": {\"type\": \"number\"}\n            },\n            \"required\": [\"name\", \"age\"]\n        });\n        \n        let result = validate_json_by_schema(\u0026json_data, \u0026schema);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::Validation { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected Validation error\"),\n        }\n    }\n\n    #[test]\n    fn test_validate_json_by_schema_invalid_schema() {\n        let json_data = json!({\"name\": \"test\"});\n        let invalid_schema = json!({\"type\": \"invalid_type\"});\n        \n        let result = validate_json_by_schema(\u0026json_data, \u0026invalid_schema);\n        assert!(result.is_err());\n        match result.unwrap_err() {\n            ToolsError::Validation { .. } =\u003e (),\n            _ =\u003e panic!(\"Expected Validation error\"),\n        }\n    }\n\n    #[test]\n    fn test_validate_json_by_schema_array() {\n        let json_data = json!([1, 2, 3, 4, 5]);\n        \n        let schema = json!({\n            \"type\": \"array\",\n            \"items\": {\"type\": \"number\"},\n            \"minItems\": 3,\n            \"maxItems\": 10\n        });\n        \n        let result = validate_json_by_schema(\u0026json_data, \u0026schema);\n        assert!(result.is_ok());\n    }\n\n    #[test]\n    fn test_validate_json_by_schema_nested_objects() {\n        let json_data = json!({\n            \"user\": {\n                \"profile\": {\n                    \"name\": \"John\",\n                    \"settings\": {\n                        \"theme\": \"dark\",\n                        \"notifications\": true\n                    }\n                }\n            }\n        });\n        \n        let schema = json!({\n            \"type\": \"object\",\n            \"properties\": {\n                \"user\": {\n                    \"type\": \"object\",\n                    \"properties\": {\n                        \"profile\": {\n                            \"type\": \"object\",\n                            \"properties\": {\n                                \"name\": {\"type\": \"string\"},\n                                \"settings\": {\n                                    \"type\": \"object\",\n                                    \"properties\": {\n                                        \"theme\": {\"type\": \"string\"},\n                                        \"notifications\": {\"type\": \"boolean\"}\n                                    }\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n        });\n        \n        let result = validate_json_by_schema(\u0026json_data, \u0026schema);\n        assert!(result.is_ok());\n    }\n\n    // Performance tests\n    #[test]\n    fn test_performance_large_json() {\n        use std::time::Instant;\n        \n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"large.json\");\n        \n        // Create a large JSON object\n        let mut large_object = serde_json::Map::new();\n        for i in 0..1000 {\n            large_object.insert(\n                format!(\"key_{}\", i),\n                json!({\n                    \"id\": i,\n                    \"name\": format!(\"item_{}\", i),\n                    \"data\": vec![i; 10],\n                    \"metadata\": {\n                        \"created\": \"2023-01-01\",\n                        \"updated\": \"2023-12-31\"\n                    }\n                })\n            );\n        }\n        let large_json = Value::Object(large_object);\n        \n        fs::write(\u0026file_path, large_json.to_string()).unwrap();\n        \n        let start = Instant::now();\n        let result = read_json_file(\u0026file_path);\n        let duration = start.elapsed();\n        \n        assert!(result.is_ok());\n        assert!(duration.as_millis() \u003c 1000, \"Reading large JSON took too long: {:?}\", duration);\n        \n        let loaded = result.unwrap();\n        assert_eq!(loaded[\"key_0\"][\"id\"], 0);\n        assert_eq!(loaded[\"key_999\"][\"id\"], 999);\n    }\n\n    #[test]\n    fn test_performance_merge_large_objects() {\n        use std::time::Instant;\n        \n        // Create large objects for merging\n        let mut target = serde_json::Map::new();\n        let mut source = serde_json::Map::new();\n        \n        for i in 0..500 {\n            target.insert(format!(\"target_key_{}\", i), json!({\"value\": i}));\n            source.insert(format!(\"source_key_{}\", i), json!({\"value\": i + 1000}));\n        }\n        \n        let mut target_json = Value::Object(target);\n        let source_json = Value::Object(source);\n        \n        let start = Instant::now();\n        merge_values(\u0026mut target_json, \u0026source_json);\n        let duration = start.elapsed();\n        \n        assert!(duration.as_millis() \u003c 100, \"Merging large objects took too long: {:?}\", duration);\n        \n        // Verify merge worked\n        assert_eq!(target_json[\"target_key_0\"][\"value\"], 0);\n        assert_eq!(target_json[\"source_key_0\"][\"value\"], 1000);\n    }\n\n    // Edge cases\n    #[test]\n    fn test_read_json_file_very_nested() {\n        let temp_dir = TempDir::new().unwrap();\n        let file_path = temp_dir.path().join(\"nested.json\");\n        \n        let deeply_nested = json!({\n            \"level1\": {\n                \"level2\": {\n                    \"level3\": {\n                        \"level4\": {\n                            \"level5\": {\n                                \"value\": \"deep\"\n                            }\n                        }\n                    }\n                }\n            }\n        });\n        \n        fs::write(\u0026file_path, deeply_nested.to_string()).unwrap();\n        \n        let result = read_json_file(\u0026file_path);\n        assert!(result.is_ok());\n        \n        let loaded = result.unwrap();\n        assert_eq!(loaded[\"level1\"][\"level2\"][\"level3\"][\"level4\"][\"level5\"][\"value\"], \"deep\");\n    }\n\n    #[test]\n    fn test_merge_values_circular_like_structure() {\n        let mut target = json!({\n            \"a\": {\"ref\": \"b\"},\n            \"b\": {\"ref\": \"a\"}\n        });\n        \n        let source = json!({\n            \"a\": {\"new_field\": \"value\"},\n            \"c\": {\"ref\": \"a\"}\n        });\n        \n        merge_values(\u0026mut target, \u0026source);\n        \n        assert_eq!(target[\"a\"][\"ref\"], \"b\");\n        assert_eq!(target[\"a\"][\"new_field\"], \"value\");\n        assert_eq!(target[\"b\"][\"ref\"], \"a\");\n        assert_eq!(target[\"c\"][\"ref\"], \"a\");\n    }\n}","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","tools","tests","mod.rs"],"content":"pub mod string_tests;\npub mod git_tests;\npub mod fs_tests;\npub mod json_tests;\npub mod process_tests;\npub mod collections_tests;\npub mod crypto_tests;\npub mod db_tests;\npub mod error_tests; ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","tools","tests","process_tests.rs"],"content":"// TODO: Implement comprehensive process tests\n// - execute_command tests with various commands\n// - environment variable passing tests\n// - working directory tests\n// - error scenarios (command not found, permission denied)\n// - timeout tests\n// - output capture tests\n// - concurrent execution tests ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","tools","tests","string_tests.rs"],"content":"#[cfg(test)]\nmod tests {\n    use crate::tools::string::*;\n    use std::env;\n    use std::path::PathBuf;\n\n    #[test]\n    fn test_capitalize_first() {\n        assert_eq!(capitalize_first(\"hello\"), \"Hello\");\n        assert_eq!(capitalize_first(\"\"), \"\");\n        assert_eq!(capitalize_first(\"a\"), \"A\");\n        assert_eq!(capitalize_first(\"HELLO\"), \"HELLO\");\n        assert_eq!(capitalize_first(\"123abc\"), \"123abc\");\n        assert_eq!(capitalize_first(\"добрий ранок\"), \"Добрий ранок\"); // Unicode test\n    }\n\n    #[test]\n    fn test_string_to_path_simple() {\n        let result = string_to_path(\"/usr/bin\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/usr/bin\"));\n    }\n\n    #[test]\n    fn test_string_to_path_empty() {\n        let result = string_to_path(\"\").unwrap();\n        assert_eq!(result, PathBuf::from(\"\"));\n    }\n\n    #[test]\n    fn test_string_to_path_tilde_expansion() {\n        // Set HOME for test\n        env::set_var(\"HOME\", \"/home/testuser\");\n        \n        let result = string_to_path(\"~/Documents\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/home/testuser/Documents\"));\n        \n        let result = string_to_path(\"~/.config/app\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/home/testuser/.config/app\"));\n    }\n\n    #[test]\n    fn test_string_to_path_tilde_expansion_no_home() {\n        // Remove HOME variable\n        env::remove_var(\"HOME\");\n        \n        let result = string_to_path(\"~/Documents\");\n        assert!(result.is_err());\n        assert!(result.unwrap_err().to_string().contains(\"HOME environment variable not found\"));\n    }\n\n    #[test]\n    fn test_string_to_path_env_var_expansion() {\n        env::set_var(\"TEST_VAR\", \"test_value\");\n        env::set_var(\"ANOTHER_VAR\", \"another_value\");\n        \n        let result = string_to_path(\"/$TEST_VAR/path\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/test_value/path\"));\n        \n        let result = string_to_path(\"/${TEST_VAR}/path\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/test_value/path\"));\n        \n        let result = string_to_path(\"/$TEST_VAR/$ANOTHER_VAR\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/test_value/another_value\"));\n    }\n\n    #[test]\n    fn test_string_to_path_relative_expansion() {\n        let current_dir = env::current_dir().unwrap();\n        \n        let result = string_to_path(\"./relative/path\").unwrap();\n        let expected = current_dir.join(\"relative/path\");\n        assert_eq!(result, expected);\n    }\n\n    #[test]\n    fn test_string_to_path_complex() {\n        env::set_var(\"HOME\", \"/home/testuser\");\n        env::set_var(\"USER\", \"testuser\");\n        env::set_var(\"PROJECT\", \"myproject\");\n        \n        let result = string_to_path(\"~/Documents/${USER}/$PROJECT/src\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/home/testuser/Documents/testuser/myproject/src\"));\n    }\n\n    #[test]\n    fn test_convert_path_to_absolute_tilde() {\n        env::set_var(\"HOME\", \"/home/testuser\");\n        \n        let result = convert_path_to_absolute(\"~/Documents\".to_string()).unwrap();\n        assert_eq!(result, \"/home/testuser/Documents\");\n    }\n\n    #[test]\n    fn test_convert_path_to_absolute_relative() {\n        let current_dir = env::current_dir().unwrap();\n        \n        let result = convert_path_to_absolute(\"./relative\".to_string()).unwrap();\n        let expected = current_dir.join(\"relative\").to_string_lossy().to_string();\n        assert_eq!(result, expected);\n    }\n\n    #[test]\n    fn test_convert_path_to_absolute_absolute() {\n        let result = convert_path_to_absolute(\"/absolute/path\".to_string()).unwrap();\n        assert_eq!(result, \"/absolute/path\");\n    }\n\n    #[test]\n    fn test_convert_path_to_absolute_relative_path() {\n        let current_dir = env::current_dir().unwrap();\n        \n        let result = convert_path_to_absolute(\"relative/path\".to_string()).unwrap();\n        let expected = current_dir.join(\"relative/path\").to_string_lossy().to_string();\n        assert_eq!(result, expected);\n    }\n\n    #[test]\n    fn test_convert_path_to_absolute_no_home() {\n        env::remove_var(\"HOME\");\n        \n        let result = convert_path_to_absolute(\"~/Documents\".to_string());\n        assert!(result.is_err());\n        assert!(result.unwrap_err().to_string().contains(\"HOME environment variable not found\"));\n    }\n\n    #[test]\n    fn test_edge_cases() {\n        // Test with special characters\n        env::set_var(\"SPECIAL_VAR\", \"value with spaces\");\n        let result = string_to_path(\"/$SPECIAL_VAR/path\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/value with spaces/path\"));\n        \n        // Test with Unicode\n        env::set_var(\"UNICODE_VAR\", \"значение\");\n        let result = string_to_path(\"/$UNICODE_VAR/путь\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/значение/путь\"));\n    }\n\n    #[test]\n    fn test_nonexistent_env_var() {\n        // Non-existent env vars should remain as-is\n        let result = string_to_path(\"/$NONEXISTENT_VAR/path\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/$NONEXISTENT_VAR/path\"));\n    }\n\n    #[test]\n    fn test_tilde_in_middle() {\n        // Tilde should only expand at the beginning\n        let result = string_to_path(\"/path/~/other\").unwrap();\n        assert_eq!(result, PathBuf::from(\"/path/~/other\"));\n    }\n\n    // Cleanup after tests\n    impl Drop for TestCleanup {\n        fn drop(\u0026mut self) {\n            // Clean up test environment variables\n            env::remove_var(\"TEST_VAR\");\n            env::remove_var(\"ANOTHER_VAR\");\n            env::remove_var(\"USER\");\n            env::remove_var(\"PROJECT\");\n            env::remove_var(\"SPECIAL_VAR\");\n            env::remove_var(\"UNICODE_VAR\");\n            env::remove_var(\"PERF_VAR\");\n        }\n    }\n\n    struct TestCleanup;\n\n    #[test]\n    fn _cleanup() {\n        let _cleanup = TestCleanup;\n    }\n} ","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","utils","helper.rs"],"content":"use log::{debug, error, warn};\nuse serde_json::Value;\nuse std::collections::HashMap;\nuse std::path::{Path, PathBuf};\n\npub fn get_blob_sha_by_path(path: \u0026PathBuf) -\u003e  Result\u003cString, git2::Error\u003e {\n    let abs_path =  path_to_absolute(path);\n\n    // Open the repository\n    let repo = git2::Repository::discover(\u0026abs_path)?;\n\n    // Get the repository's workdir (root directory)\n    let repo_root = repo.workdir().ok_or_else(|| {\n        git2::Error::from_str(\"Could not get repository working directory\")\n    })?;\n\n    // Convert the absolute path to a path relative to the repository root\n    let relative_path = abs_path.strip_prefix(repo_root).map_err(|_| {\n        git2::Error::from_str(\"Failed to get relative path\")\n    })?;\n\n    // Get the HEAD commit\n    let head = repo.head()?;\n    let commit = head.peel_to_commit()?;\n    \n    // Get the tree from the commit\n    let tree = commit.tree()?;\n    \n    // Get the tree entry for the relative_path\n    let entry = tree.get_path(relative_path)?;\n\n    // Get the object ID (SHA) of the entry\n    let entry_sha = entry.id().to_string();\n\n    Ok(entry_sha)\n}\n\nfn path_to_absolute(path: \u0026PathBuf) -\u003e PathBuf {\n    if path.is_absolute() {\n        path.clone()\n    } else {\n        std::env::current_dir().unwrap().join(path)\n    }\n}\n\npub fn get_commit_sha_by_path(path_buf: \u0026PathBuf) -\u003e Result\u003cString, git2::Error\u003e {\n    let abs_path = path_to_absolute(path_buf);\n\n    // Open the repository\n    let repo = git2::Repository::discover(abs_path)?;\n\n    // Get the HEAD commit\n    let head = repo.head()?;\n    let commit = head.peel_to_commit()?;\n\n    // Get the commit ID (SHA)\n    let commit_sha = commit.id().to_string();\n\n    Ok(commit_sha)\n}\n\npub fn get_sha_by_value(value: \u0026Value) -\u003e String {\n    use sha2::Digest;\n    let mut hasher = sha2::Sha256::new();\n    let ordered = order_json(value);\n    let canonical_json = serde_json::to_string(\u0026ordered).unwrap_or_default();\n    hasher.update(canonical_json.as_bytes());\n    format!(\"{:x}\", hasher.finalize())\n}\n\nfn order_json(value: \u0026Value) -\u003e Value {\n    use std::collections::BTreeMap;\n    match value {\n        Value::Object(map) =\u003e {\n            let ordered: BTreeMap\u003c_, _\u003e = map\n                .iter()\n                .map(|(k, v)| (k.clone(), order_json(v)))\n                .collect();\n            Value::Object(ordered.into_iter().collect())\n        }\n        Value::Array(arr) =\u003e {\n            let mut ordered: Vec\u003cValue\u003e = arr.iter().map(order_json).collect();\n            if ordered.iter().all(|v| v.is_number() || v.is_string()) {\n                ordered.sort_by(|a, b| a.to_string().cmp(\u0026b.to_string()));\n            }\n            Value::Array(ordered)\n        }\n        _ =\u003e value.clone(),\n    }\n}\n\npub fn db_connect(db: \u0026str) -\u003e mongodb::sync::Client {\n    let options = match mongodb::options::ClientOptions::parse(db).run() {\n        Ok(client) =\u003e client,\n        Err(e) =\u003e exit_with_error(format!(\"DB connection error: {e}\")),\n    };\n    let client = mongodb::sync::Client::with_options(options);\n    match client {\n        Ok(client) =\u003e client,\n        Err(e) =\u003e exit_with_error(format!(\"DB connection error: {e}\")),\n    }\n}\n\n/// Exits the program with an error message and a status code of 1.\n///\n/// # Arguments\n///\n/// * `error` - A string slice that holds the error message to be logged.\n#[allow(clippy::needless_pass_by_value)]\npub fn exit_with_error(error: String) -\u003e ! {\n    error!(target: \"\", \"{}\", error);\n    std::process::exit(1);\n}\n\n// helper trait for unwrapping Result to value or exit with error message if Error\npub trait ResultExtUnwrap\u003cT, E\u003e {\n    fn unwrap_or_exit(self, error: String) -\u003e T;\n}\n\nimpl\u003cT, E: std::fmt::Display\u003e ResultExtUnwrap\u003cT, E\u003e for Result\u003cT, E\u003e {\n    fn unwrap_or_exit(self, error: String) -\u003e T {\n        match self {\n            Ok(value) =\u003e value,\n            Err(e) =\u003e {\n                error!(target: \"\", \"{}: {}\", error, e);\n                std::process::exit(1);\n            }\n        }\n    }\n}\n\npub trait ResultExtWarn\u003cT, E\u003e {\n    fn check_with_warn(self, warning: \u0026str) -\u003e Result\u003cT, E\u003e;\n}\n\nimpl\u003cT, E: std::fmt::Display\u003e ResultExtWarn\u003cT, E\u003e for Result\u003cT, E\u003e {\n    fn check_with_warn(self, warning: \u0026str) -\u003e Result\u003cT, E\u003e {\n        match self {\n            Ok(value) =\u003e Ok(value),\n            Err(e) =\u003e {\n                warn!(target: \"\", \"{}: {}\", warning, e);\n                Err(e)\n            }\n        }\n    }\n}\n\n// helper trait for unwrapping Option to value or exit with error message if None\npub trait OptionExtUnwrap\u003cT\u003e {\n    fn unwrap_or_exit(self, error: String) -\u003e T;\n}\n\nimpl\u003cT\u003e OptionExtUnwrap\u003cT\u003e for Option\u003cT\u003e {\n    fn unwrap_or_exit(self, error: String) -\u003e T {\n        if let Some(t) = self {\n            t\n        } else {\n            error!(target: \"\", \"{}\", error);\n            std::process::exit(1);\n        }\n    }\n}\n\npub fn convert_path_to_absolute(s: String) -\u003e Option\u003cString\u003e {\n    s.starts_with('~')\n        .then(|| s.replacen(\"~\", \u0026std::env::var(\"HOME\").unwrap(), 1))\n        .or(s\n            .starts_with('.')\n            .then(|| s.replacen(\".\", \u0026std::env::var(\"PWD\").unwrap(), 1)))\n        .or(s.starts_with('/').then(|| s.clone()))\n        .or(Path::new(\u0026s).is_relative().then(|| {\n            std::env::current_dir()\n                .unwrap()\n                .join(\u0026s)\n                .to_str()\n                .unwrap()\n                .to_string()\n        }))\n}\n\n/// Reads a JSON file from the given path and returns its content as a `serde_json::Value` object.\n///\n/// # Arguments\n///\n/// * `path` - A `PathBuf` object representing the path to the JSON file.\n///\n/// # Returns\n///\n/// An `Option` containing the `serde_json::Value` object if the file exists and is a valid JSON file,\n/// otherwise `None`.\npub fn read_json_file(path: \u0026PathBuf) -\u003e Option\u003cValue\u003e {\n    match std::fs::read_to_string(path) {\n        Ok(json) =\u003e {\n            let meta_data = serde_json::from_str::\u003cValue\u003e(\u0026json).unwrap_or_exit(format!(\n                \"Sorry, but file {:?} is not a valid JSON file\",\n                \u0026path\n            ));\n            Some(meta_data)\n        }\n        Err(_) =\u003e {\n            debug!(target:\"\", \"File {:?} doesn't exist. Pass empty data...\", \u0026path.file_name().unwrap());\n            None\n        }\n    }\n}\n\n/// Merges the values from the `source` JSON object into the `target` JSON object.\n/// If a key exists in both objects, the values are merged recursively.\n/// If a key exists in the `target` object but not in the `source` object, the value is added to the `target` object.\n/// If the values are arrays, the `source` array is appended to the `target` array.\n///\n/// # Arguments\n///\n/// * `target` - A mutable reference to the target JSON object.\n/// * `source` - A reference to the source JSON object.\n///\n/// # Example\n///\n/// ```\n/// use serde_json::json;\n/// use cubtera::prelude::merge_values;\n///\n/// let mut target = json!({\n///     \"name\": \"John\",\n///     \"age\": 30,\n///     \"address\": {\n///         \"street\": \"123 Main St\",\n///         \"city\": \"New York\"\n///     },\n///     \"hobbies\": [\"reading\", \"gaming\"]\n/// });\n///\n/// let source = json!({\n///     \"age\": 31,\n///     \"address\": {\n///         \"city\": \"San Francisco\",\n///         \"state\": \"CA\"\n///     },\n///     \"hobbies\": [\"traveling\", \"cooking\"],\n///     \"gender\": \"male\"\n/// });\n///\n/// merge_values(\u0026mut target, \u0026source);\n/// ```\n// pub fn merge_values(target: \u0026mut serde_json::Value, source: \u0026serde_json::Value) {\n//     match (target, source) {\n//         (serde_json::Value::Object(target_obj), serde_json::Value::Object(source_obj)) =\u003e {\n//             for (key, source_value) in source_obj.iter() {\n//                 if !target_obj.contains_key(key) {\n//                     target_obj.insert(key.clone(), source_value.clone());\n//                 } else {\n//                     // Recursively merge if the value is an object\n//                     merge_values(target_obj.get_mut(key).unwrap(), \u0026source_value.clone());\n//                 }\n//             }\n//         }\n//         (serde_json::Value::Array(target_arr), serde_json::Value::Array(source_arr)) =\u003e {\n//             // Merge arrays by extending the target array\n//             for source_value in source_arr {\n//                 if !target_arr.contains(source_value) {\n//                     target_arr.push(source_value.clone());\n//                 }\n//             }\n//         }\n//         _ =\u003e {}\n//     }\n// }\npub fn merge_values(data: \u0026mut serde_json::Value, with: \u0026serde_json::Value) {\n    if let (serde_json::Value::Object(data_obj), serde_json::Value::Object(with_obj)) = (data, with)\n    {\n        for (key, with_value) in with_obj {\n            if let serde_json::map::Entry::Vacant(entry) = data_obj.entry(key) {\n                entry.insert(with_value.clone());\n            } else if let serde_json::map::Entry::Occupied(mut entry) = data_obj.entry(key) {\n                if with_value.is_object() \u0026\u0026 entry.get().is_object() {\n                    merge_values(entry.get_mut(), with_value);\n                }\n            }\n        }\n    }\n}\n\nuse std::collections::HashSet;\nuse std::process::ExitStatus;\n\npub fn if_intersect(vec1: Vec\u003cString\u003e, vec2: Vec\u003cString\u003e) -\u003e bool {\n    let set1: HashSet\u003cString\u003e = vec1.into_iter().collect();\n    let set2: HashSet\u003cString\u003e = vec2.into_iter().collect();\n    let intersect: HashSet\u003cString\u003e = set1.intersection(\u0026set2).cloned().collect();\n    !intersect.is_empty()\n}\n\npub fn value_intersection(value1: Value, value2: Value) -\u003e Option\u003cHashSet\u003cString\u003e\u003e {\n    let vec1 = value_to_vec(\u0026value1);\n    let vec2 = value_to_vec(\u0026value2);\n    let set1: HashSet\u003c_\u003e = vec1?.into_iter().collect();\n    let set2: HashSet\u003c_\u003e = vec2?.into_iter().collect();\n\n    match set1.intersection(\u0026set2).cloned().collect::\u003cHashSet\u003c_\u003e\u003e() {\n        set if set.is_empty() =\u003e None,\n        set =\u003e Some(set),\n    }\n}\n\nfn value_to_vec(value: \u0026Value) -\u003e Option\u003cVec\u003cString\u003e\u003e {\n    value\n        .as_array()?\n        .iter()\n        .map(|v| v.as_str().map(|s| s.to_string()))\n        .collect()\n}\n\npub fn group_tuples(tuples: Vec\u003c(String, String)\u003e) -\u003e HashMap\u003cString, Vec\u003cString\u003e\u003e {\n    let mut map: HashMap\u003cString, Vec\u003cString\u003e\u003e = HashMap::new();\n    tuples.into_iter().for_each(|(key, value)| {\n        map.entry(key).or_default().push(value);\n    });\n    map\n}\n\n/// Validates a JSON object against a JSON schema.\n///\n/// # Arguments\n///\n/// * `json` - A JSON object to be validated.\n/// * `schema` - A JSON schema against which the `json` object is validated.\n///\n/// # Returns\n///\n/// Returns a cloned `json` object if it is valid against the `schema`. Otherwise, returns `None`.\n///\n/// # Example\n///\n/// ```\n/// use serde_json::json;\n/// use cubtera::prelude::validate_json_by_schema;\n///\n/// let json_obj = json!({\n///     \"name\": \"John Doe\",\n///     \"age\": 30,\n///     \"city\": \"New York\"\n/// });\n///\n/// let schema = json!({\n///     \"type\": \"object\",\n///     \"properties\": {\n///         \"name\": {\"type\": \"string\"},\n///         \"age\": {\"type\": \"number\"},\n///         \"city\": {\"type\": \"string\"}\n///     },\n///     \"required\": [\"name\", \"age\", \"city\"]\n/// });\n///\n/// let result = validate_json_by_schema(\u0026json_obj, \u0026schema);\n/// assert_eq!(result, Some(json_obj));\n/// ```\npub fn validate_json_by_schema(json: \u0026Value, schema: \u0026Value) -\u003e Option\u003cValue\u003e {\n    let validator = jsonschema::validator_for(schema).unwrap();\n    validator.validate(json).ok().map(|_| json.clone())\n}\n\n/// Reads and validates a JSON file against a JSON schema file.\n///\n/// # Arguments\n///\n/// * `json_path` - A `PathBuf` representing the path to the JSON file.\n/// * `schema_path` - A `PathBuf` representing the path to the JSON schema file.\n///\n/// # Returns\n///\n/// An `Option\u003cValue\u003e` containing the parsed JSON data if validation succeeds, otherwise `None`.\n///\n/// # Panics\n///\n/// This function will panic if it is unable to read the schema file or if it is unable to parse the schema file.\n/// It will also panic if it is unable to read the JSON file or if it is unable to parse the JSON file.\n/// If validation fails, it will exit with an error message.\npub fn read_and_validate_json(json_path: PathBuf, schema_path: PathBuf) -\u003e Option\u003cValue\u003e {\n    let json_schema = std::fs::read_to_string(\u0026schema_path)\n        .unwrap_or_exit(format!(\"Can't read schema: {:?}.\", \u0026schema_path));\n    let json_schema = serde_json::from_str(\u0026json_schema)\n        .unwrap_or_exit(format!(\"Can't parse schema: {:?}.\", schema_path));\n\n    let validator = jsonschema::validator_for(\u0026json_schema).unwrap();\n\n    let json_data = std::fs::read_to_string(\u0026json_path)\n        .unwrap_or_exit(format!(\"Can't read json: {:?}\", \u0026json_path));\n    let json = serde_json::from_str::\u003cValue\u003e(\u0026json_data)\n        .unwrap_or_exit(format!(\"Can't parse json: {:?}\", json_path));\n    \n    if ! validator.is_valid(\u0026json) {\n        let errors = validator.iter_errors(\u0026json);\n        for error in errors {\n            println!(\"Validation error: {}\", error);\n        }\n        exit_with_error(format!(\"File: {:?}\", json_path)); \n    }\n    \n    Some(json)\n}\n\n/// # Panics\n///\n/// Will panic if there is a problem with files i/o\n/// Copies all files in a folder from the source path to the destination path.\n/// If the destination path does not exist, it will be created.\n///\n/// # Arguments\n///\n/// * `src` - A `PathBuf` representing the source folder path.\n/// * `dst` - A reference to a `PathBuf` representing the destination folder path.\npub fn copy_all_files_in_folder(src: PathBuf, dst: \u0026PathBuf, overwrite_existing: bool) {\n    if !dst.exists() {\n        std::fs::create_dir_all(dst)\n            .unwrap_or_exit(format!(\"Failed to create folder {}\", dst.to_str().unwrap()));\n    }\n    walkdir::WalkDir::new(src)\n        .max_depth(1)\n        .into_iter()\n        .filter_map(Result::ok)\n        .filter(|e| e.file_type().is_file())\n        //.filter(|_| override_existing)\n        .filter(|path| !(dst.join(path.file_name()).exists()) || overwrite_existing)\n        .for_each(|e| {\n            let src_path = e.clone().into_path();\n            let dst_path = dst.join(e.into_path().file_name().unwrap());\n            std::fs::copy(\u0026src_path, \u0026dst_path)\n                .unwrap_or_exit(format!(\"Failed to copy file {src_path:?} to {dst_path:?}\"));\n        });\n}\n\n/// Recursively copies all files and subfolders from the source folder to the destination folder.\n///\n/// # Arguments\n///\n/// * `src` - A `PathBuf` representing the source folder to copy from.\n/// * `dst` - A reference to a `PathBuf` representing the destination folder to copy to.\npub fn copy_folder(src: PathBuf, dst: \u0026PathBuf, overwrite_existing: bool) {\n    copy_all_files_in_folder(src.clone(), dst, overwrite_existing);\n\n    walkdir::WalkDir::new(src)\n        .max_depth(1)\n        .into_iter()\n        .filter_map(Result::ok)\n        .filter(|path| path.path().is_dir())\n        .skip(1)\n        .for_each(|folder| {\n            copy_folder(\n                folder.clone().into_path(),\n                \u0026dst.join(folder.into_path().file_name().unwrap()),\n                overwrite_existing,\n            );\n        });\n}\n\npub fn check_path(path: PathBuf) -\u003e Option\u003cPathBuf\u003e {\n    match std::fs::metadata(\u0026path) {\n        Ok(_) =\u003e Some(path),\n        Err(_) =\u003e None,\n    }\n}\n\npub fn string_to_path(s: \u0026str) -\u003e PathBuf {\n    let mut path = s.to_string();\n\n    // Expand tilde to home directory\n    if path.starts_with(\"~\") {\n        if let Ok(home) = std::env::var(\"HOME\") {\n            path = path.replacen(\"~\", \u0026home, 1);\n        }\n    }\n\n    // Expand relative path to absolute\n    if path.starts_with(\"./\") {\n        if let Ok(pwd) = std::env::var(\"PWD\") {\n            path = path.replacen(\".\", \u0026pwd, 1);\n        }\n    }\n\n    // Expand environment variables in path string\n    // Replace ${VAR} and $VAR with actual values\n    let with_env = std::env::vars().fold(path, |s, (k, v)| {\n        s.replace(\u0026format!(\"${}\", k), \u0026v)\n            .replace(\u0026format!(\"${{{}}}\", k), \u0026v)\n    });\n\n    // Check if path is relative and convert to absolute\n    // if Path::new(\u0026with_env).is_relative() {\n    //     with_env = std::env::current_dir().unwrap()\n    //         .join(\u0026with_env).to_str().unwrap().to_string();\n    // }\n\n    // Convert to PathBuf\n    PathBuf::from(with_env)\n}\n\npub fn execute_command(\n    command: \u0026str,\n    current_dir: \u0026str,\n    env_vars: HashMap\u003cString, String\u003e,\n) -\u003e Result\u003cExitStatus, Box\u003cdyn std::error::Error\u003e\u003e {\n    let mut command = command.split_whitespace();\n    let binary = command.next().unwrap_or_exit(\"Command is empty\".into());\n    let path = string_to_path(binary);\n    let args = command.collect::\u003cVec\u003c\u0026str\u003e\u003e();\n\n    let mut process = std::process::Command::new(path)\n        .current_dir(current_dir)\n        .args(args)\n        .envs(env_vars)\n        .spawn()?;\n\n    let result = process.wait();\n\n    match result {\n        Ok(status) =\u003e Ok(status),\n        Err(e) =\u003e Err(e.into()),\n    }\n}\n\npub fn capitalize_first(s: \u0026str) -\u003e String {\n    let mut c = s.chars();\n    match c.next() {\n        None =\u003e String::new(),\n        Some(f) =\u003e f.to_uppercase().collect::\u003cString\u003e() + c.as_str(),\n    }\n}\n\n#[test]\nfn test_copy_all_files_in_folder() {\n    use std::fs;\n\n    // Prepare a temporary test directory with some files\n    let src_dir = tempfile::tempdir().unwrap();\n    let file1_path = src_dir.path().join(\"file1.txt\");\n    let file2_path = src_dir.path().join(\"file2.txt\");\n    fs::write(file1_path, \"Hello, world!\").unwrap();\n    fs::write(file2_path, \"Goodbye, world!\").unwrap();\n\n    // Prepare a temporary test destination directory\n    let dst_dir = tempfile::tempdir().unwrap();\n    let dst_path = dst_dir.path();\n\n    // Copy the files from the source directory to the destination directory\n    copy_all_files_in_folder(src_dir.path().to_path_buf(), \u0026dst_path.to_path_buf(), true);\n\n    // Check that the files were copied correctly\n    let copied_file1_path = dst_path.join(\"file1.txt\");\n    let copied_file2_path = dst_path.join(\"file2.txt\");\n    assert!(copied_file1_path.exists());\n    assert!(copied_file2_path.exists());\n    assert_eq!(\n        fs::read_to_string(\u0026copied_file1_path).unwrap(),\n        \"Hello, world!\"\n    );\n    assert_eq!(\n        fs::read_to_string(\u0026copied_file2_path).unwrap(),\n        \"Goodbye, world!\"\n    );\n}\n\n#[test]\nfn test_copy_folder() {\n    use std::fs;\n    use std::path::Path;\n\n    // Create a temporary source directory with some files and subdirectories.\n    let src_dir = tempfile::tempdir().unwrap();\n    let src_path = Path::new(src_dir.path());\n    let file1_path = src_path.join(\"file1.txt\");\n    let file2_path = src_path.join(\"file2.txt\");\n    fs::write(file1_path, \"hello\").unwrap();\n    fs::write(file2_path, \"world\").unwrap();\n    let sub_dir = src_path.join(\"sub.dir.test\");\n    fs::create_dir(\u0026sub_dir).unwrap();\n    let sub_file_path = sub_dir.join(\"sub_file.txt\");\n    fs::write(sub_file_path, \"sub\").unwrap();\n\n    // Create a temporary destination directory.\n    let dst_dir = tempfile::tempdir().unwrap();\n    let dst_path = Path::new(dst_dir.path());\n\n    // Call the function to copy the source directory to the destination directory.\n    copy_folder(src_path.to_path_buf(), \u0026dst_path.to_path_buf(), true);\n\n    // Assert that the files and subdirectories were copied successfully.\n    let dst_file1_path = dst_path.join(\"file1.txt\");\n    let dst_file2_path = dst_path.join(\"file2.txt\");\n    let dst_sub_dir_path = dst_path.join(\"sub.dir.test\");\n    let dst_sub_file_path = dst_sub_dir_path.join(\"sub_file.txt\");\n    assert!(dst_file1_path.exists());\n    assert!(dst_file2_path.exists());\n    assert!(dst_sub_dir_path.exists());\n    assert!(dst_sub_file_path.exists());\n    assert_eq!(fs::read_to_string(\u0026dst_file1_path).unwrap(), \"hello\");\n    assert_eq!(fs::read_to_string(\u0026dst_file2_path).unwrap(), \"world\");\n    assert_eq!(fs::read_to_string(\u0026dst_sub_file_path).unwrap(), \"sub\");\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::env;\n    use std::path::PathBuf;\n\n    #[test]\n    fn test_merge_values() {\n        let mut target = serde_json::json!({\n            \"name_not_in_defaults\": \"John\",\n            \"age\": 30,\n            \"list_not_in_defaults\" : [\"test\"],\n            \"address\": {\n                \"street\": \"123 Main St\",\n                \"city\": \"New York\"\n            },\n            \"list_differ_from_target\": [\"reading\", \"gaming\"]\n        });\n        // default values\n        let defaults = serde_json::json!({\n            \"age\": 31,\n            \"key_not_in_target\": \"test\",\n            \"address\": {\n                \"city\": \"San Francisco\",\n                \"state\": \"CA\",\n                \"nested\": {\n                    \"key1\": \"value1\",\n                    \"key2\": \"value2\"\n                }\n            },\n            \"list_differ_from_target\": [\"traveling\", \"cooking\"],\n            \"list_not_in_target\" : [\"test\"],\n            \"gender\": \"male\"\n        });\n\n        merge_values(\u0026mut target, \u0026defaults);\n\n        let expected_result = serde_json::json!({\n            \"name_not_in_defaults\": \"John\",\n            \"age\": 30,\n            \"address\": {\n                \"nested\": {\n                    \"key1\": \"value1\",\n                    \"key2\": \"value2\"\n                },\n                \"street\": \"123 Main St\",\n                \"city\": \"New York\",\n                \"state\": \"CA\"\n            },\n            \"list_differ_from_target\": [\"reading\", \"gaming\"],\n            \"list_not_in_target\" : [\"test\"],\n            \"list_not_in_defaults\" : [\"test\"],\n            \"gender\": \"male\",\n            \"key_not_in_target\": \"test\",\n        });\n\n        assert_eq!(target, expected_result);\n    }\n\n    #[test]\n    fn test_simple_path() {\n        assert_eq!(string_to_path(\"/usr/bin\"), PathBuf::from(\"/usr/bin\"));\n    }\n\n    // #[test]\n    // fn test_tilde_expansion() {\n    //     env::set_var(\"HOME\", \"/home/user\");\n    //     let home = env::var(\"HOME\").expect(\"HOME environment variable should be set\");\n    //     assert_eq!(\n    //         string_to_path(\"~/Documents\"),\n    //         PathBuf::from(format!(\"{}/Documents\", home))\n    //     );\n    // }\n\n    #[test]\n    fn test_env_var_expansion() {\n        env::set_var(\"TEST_VAR\", \"test_value\");\n        assert_eq!(\n            string_to_path(\"/$TEST_VAR/path\"),\n            PathBuf::from(\"/test_value/path\")\n        );\n        assert_eq!(\n            string_to_path(\"/${TEST_VAR}/path\"),\n            PathBuf::from(\"/test_value/path\")\n        );\n    }\n\n    #[test]\n    fn test_multiple_env_vars() {\n        env::set_var(\"VAR1\", \"value1\");\n        env::set_var(\"VAR2\", \"value2\");\n        assert_eq!(\n            string_to_path(\"/$VAR1/$VAR2\"),\n            PathBuf::from(\"/value1/value2\")\n        );\n    }\n\n    // #[test]\n    // fn test_tilde_and_env_var() {\n    //     env::set_var(\"HOME\", \"/home/user\");\n    //     let home = env::var(\"HOME\").expect(\"HOME environment variable should be set\");\n    //     env::set_var(\"TEST_VAR\", \"test_value\");\n    //     assert_eq!(\n    //         string_to_path(\"~/$TEST_VAR\"),\n    //         PathBuf::from(format!(\"{}/test_value\", home))\n    //     );\n    // }\n\n    #[test]\n    fn test_non_existent_env_var() {\n        assert_eq!(\n            string_to_path(\"/$NONEXISTENT_VAR/path\"),\n            PathBuf::from(\"/$NONEXISTENT_VAR/path\")\n        );\n    }\n\n    #[test]\n    fn test_tilde_in_middle() {\n        assert_eq!(\n            string_to_path(\"/path/~/other\"),\n            PathBuf::from(\"/path/~/other\")\n        );\n    }\n\n    #[test]\n    fn test_empty_string() {\n        assert_eq!(string_to_path(\"\"), PathBuf::from(\"\"));\n    }\n\n    // #[test]\n    // fn test_complex_path() {\n    //     env::set_var(\"USER\", \"testuser\");\n    //     env::set_var(\"PROJECT\", \"myproject\");\n    //     env::set_var(\"HOME\", \"/home/user\");\n    //     let home = env::var(\"HOME\").expect(\"HOME environment variable should be set\");\n    //     assert_eq!(\n    //         string_to_path(\"~/Documents/${USER}/$PROJECT/src\"),\n    //         PathBuf::from(format!(\"{}/Documents/testuser/myproject/src\", home))\n    //     );\n    // }\n}\n","traces":[{"line":6,"address":[],"length":0,"stats":{"Line":0}},{"line":7,"address":[],"length":0,"stats"
