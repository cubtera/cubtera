<!doctype html>
<html>
<head>

    <style>html, body {
  margin: 0;
  padding: 0;
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: #ddd;
}

}

  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: #fcc;
}
.files-list__file_medium {
  background: #ffc;

  content: '\01F4C1';

}

  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: white;
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: #338;
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
    content: counter(line);
    margin-right: 10px;
}
.code-line {
  margin: 0;
  padding: 0.3em;
  height: 1em;
  counter-increment: line;
}
.code-line_covered {
  background: #cfc;
}
.code-line_uncovered {
  background: #fcc;
}
</style>
</head>

ialize};\nuse std::collections::HashMap;\nuse std::path::Path;\nuse serde_json::json;\nuse sha2::{Sha256, Digest};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct Bom {\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    unit_name: Option\u003cString\u003e,\n\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    unit_sha: Option\u003cString\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    unit_blob_sha: Option\u003cString\u003e,\n\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    inventory_sha: Option\u003cString\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    inventory_blob_sha: Option\u003cString\u003e,\n\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    env_vars: Option\u003cHashMap\u003cString, String\u003e\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    env_vars_blob_sha: Option\u003cString\u003e,\n\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    bom_atom_blob_sha: Option\u003cString\u003e, // composite sha of unit, inventory, env_vars\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    bom_atom_id: Option\u003cString\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    bom_dim_id: Option\u003cString\u003e,\n\n    // _id: Option\u003cString\u003e,\n    //\n\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    timestamp: Option\u003cu64\u003e,\n    #[serde(skip_serializing_if = \"Option::is_none\")]\n    datetime: Option\u003cString\u003e,\n}\n\n#[allow(clippy::too_many_arguments)]\nimpl Bom {\n    pub fn build(unit: Unit) -\u003e Self {\n        let timestamp = std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .unwrap()\n            .as_secs();\n        let hr_time = chrono::DateTime::from_timestamp(timestamp as i64, 0).unwrap_or_default();\n\n        let unit_commit_sha = unit.get_unit_commit_sha();\n        let unit_blob_sha = unit.get_unit_blob_sha();\n\n        let inventory_sha = get_commit_sha_by_path(\n            \u0026Path::new(\u0026GLOBAL_CFG.inventory_path).to_path_buf()\n        ).unwrap_or(\"undefined\".into());\n\n        let inventory_blob_sha = unit.get_dims_blob_sha();\n        let env_vars =  unit.get_env_vars();\n\n        let mut y_dims = unit.dimensions.clone();\n        let x_dim = y_dims.remove(0);\n        dbg!(x_dim.data_sha);\n\n        let y_hashes = y_dims.iter()\n            .map(|dim| dim.data_sha.clone())\n            .fold(Sha256::new(), |mut acc, sha| {\n                acc.update(sha.as_bytes());\n                acc\n            }).finalize();\n\n        let inventory_blob_sha = format!(\"{:x}\", y_hashes);\n        let env_vars_blob_sha = get_sha_by_value(\u0026json!(env_vars));\n\n        let bom_atom_blob_sha = format!(\"{:}\", get_sha_by_value(\u0026json!(\n            vec![\n                unit_blob_sha.clone(),\n                inventory_blob_sha.clone(),\n                env_vars_blob_sha.clone()\n            ]\n        )));\n\n\n        let bom_atom_id = y_dims.is_empty()\n            .then_some(unit.get_name())\n            .unwrap_or(unit.get_name() + \"#\" + \u0026y_dims\n                .iter()\n                .map(|dim| format!(\"{}:{}\",\u0026dim.dim_type, \u0026dim.dim_name))\n                .collect::\u003cVec\u003cString\u003e\u003e()\n                .join(\"#\")\n            );\n\n\n        let bom_dim_id = format!(\"{}:{}#latest\", x_dim.dim_type, x_dim.dim_name);\n\n        let x = Root{\n            _id: format!(\"{}#{}#latest\", x_dim.dim_name, bom_atom_id),\n            hash: unit_blob_sha.clone(),\n            atom: Atom{\n                unit: unit.get_name(),\n                x: x_dim.dim_name,\n                y: y_dims\n                    .iter()\n                    .map(|dim| format!(\"{}:{}\", \u0026dim.dim_type, \u0026dim.dim_name))\n                    .collect::\u003cVec\u003cString\u003e\u003e()\n                    .join(\"#\"),\n  {\n        let client: Option\u003cmongodb::sync::Client\u003e =\n            GLOBAL_CFG.dlog_db.as_ref().map(|db| db_connect(db));\n        if let Some(cl) = client {\n            let db = cl.database(org);\n            let col = db.collection::\u003cmongodb::bson::Bson\u003e(\"bom\");\n            //let col = MongoCollection::new(org, \"dlog\", \u0026cl);\n            let data = json!(self);\n            let doc = mongodb::bson::to_bson(\u0026data)?;\n            col.insert_one(doc).run()?;\n            return Ok(());\n        }\n        anyhow::bail!(\"Can't connect to bom DB\");\n    }\n}\n\n#[derive(Serialize, Deserialize, Debug, Clone)]\nstruct Vars {\n    pub values: HashMap\u003cString, String\u003e,\n    pub hash: String,\n}\n\n#[derive(Serialize, Deserialize, Debug, Clone)]\nstruct Struct {\n    pub sha: String,\n    pub hash: String,\n}\n\n#[derive(Serialize, Deserialize, Debug, Clone)]\nstruct Refs {\n    pub unit: String,\n    pub dims: String,\n    pub vars: HashMap\u003cString, String\u003e\n}\n\n#[derive(Serialize, Deserialize, Debug, Clone)]\nstruct Hashes {\n    pub unit: String,\n    pub dims: String,\n    pub vars: String\n}\n\n#[derive(Serialize, Deserialize, Debug, Clone)]\nstruct Atom {\n    pub unit: String,\n    pub x: String,\n    pub y: String,\n    pub version: String,\n}\n\n#[derive(Serialize, Deserialize, Debug, Clone)]\nstruct Root {\n    pub _id: String,\n    pub hash: String,\n    pub atom: Atom,\n    pub unit: Struct,\n    pub hashes: Hashes,\n    pub refs: Refs,\n    pub inventory: Struct,\n    pub vars: Vars,\n    pub timestamp: i64,\n    pub datetime: String,\n}","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","core","cfg","config.rs"],"content":"use super::error::{ConfigError, ConfigResult, ConfigResultExt};\nuse super::loader::ConfigLoader;\nuse crate::tools::{convert_path_to_absolute, db};\nuse log::{debug, warn};\nuse serde::{Deserialize, Deserializer, Serialize, Serializer};\nu ip_serializing_if = \"Option::is_none\")]\n    pub state: Option\u003cHashMap\u003cString, HashMap\u003cString, String\u003e\u003e\u003e,\n    #[serde(skip)]\n    pub db_client: Option\u003cmongodb::sync::Client\u003e,\n    #[serde(default = \"default_file_name_separator\")]\n    pub file_name_separator: String,\n}\n\n// Default value functions\nfn default_workspace_path() -\u003e String {\n    \"~/.cubtera/workspace\".into()\n}\n\nfn default_temp_folder_path() -\u003e String {\n    \"~/.cubtera/tmp\".into()\n}\n\nfn default_units_folder() -\u003e String {\n    \"units\".into()\n}\n\nfn default_units_path() -\u003e String {\n    default_workspace_path().add(\u0026format!(\"/{}\", default_units_folder()))\n}\n\nfn default_modules_folder() -\u003e String {\n    \"modules\".into()\n}\n\nfn default_modules_path() -\u003e String {\n    default_workspace_path().add(\u0026format!(\"/{}\", default_modules_folder()))\n}\n\nfn default_plugins_folder() -\u003e String {\n    \"plugins\".into()\n}\n\nfn default_plugins_path() -\u003e String {\n    default_workspace_path().add(\u0026format!(\"/{}\", default_plugins_folder()))\n}\n\nfn default_inventory_folder() -\u003e String {\n    \"inventory\".into()\n}\n\nfn default_inventory_path() -\u003e String {\n    default_workspace_path().add(\u0026format!(\"/{}\", default_inventory_folder()))\n}\n\nfn default_dim_relations() -\u003e Vec\u003cString\u003e {\n    [\"dome\".into(), \"env\".into(), \"dc\".into()].into()\n}\n\nfn default_orgs() -\u003e Vec\u003cString\u003e {\n    [\"cubtera\".into()].into()\n}\n\nfn default_org() -\u003e String {\n    \"cubtera\".into()\n}\n\nfn default_file_name_separator() -\u003e String {\n    \":\".into()\n}\n\nimpl Default for CubteraConfig {\n    fn default() -\u003e Self {\n        Self {\n            workspace_path: default_workspace_path(),\n            inventory_path: default_inventory_path(),\n            units_path: default_units_path(),\n            modules_path: default_modules_path(),\n            plugins_path: default_plugins_path(),\n            temp_folder_path: default_temp_folder_path(),\n            org: default_org(),\n            orgs: default_orgs(),\n            dim_relations: default_dim_relations(),\n            db: None,\n            dlog_db: None,\n            dlog_job_user_name_env: None,\n            dlog_job_number_env: None,\n            dlog_job_name_env: None,\n            clean_cache: false,\n            always_copy_files: true,\n            runner: None,\n            state: None,\n            db_client: None,\n            file_name_separator: default_file_name_separator(),\n        }\n    }\n}\n\nimpl CubteraConfig {\n    /// Create a new configuration with default values\n    pub fn new() -\u003e Self {\n        Self::default()\n    }\n    \n    /// Load configuration from all sources (env vars, config file, defaults)\n    pub fn load() -\u003e ConfigResult\u003cSelf\u003e {\n        let loader = ConfigLoader::new();\n        let config_data = loader.load_complete_config()?;\n        \n        if config_data.is_empty() {\n            debug!(\"No configuration data found, using defaults\");\n            let config = Self::default();\n            config.validate()?;\n            return Ok(config);\n        }\n        \n        Self::from_config_data(config_data)\n    }\n    \n    /// Load configuration with custom loader\n    pub fn load_with_loader(loader: ConfigLoader) -\u003e ConfigResult\u003cSelf\u003e {\n        let config_data = loader.load_complete_config()?;\n        \n        if config_data.is_empty() {\n            debug!(\"No configuration data found, using defaults\");\n            let config = Self::default();\n            config.validate()?;\n            return Ok(config);\n        }\n        \n        Self::from_config_data(config_data)\n    }\n    \n    /// Create configuration from raw config data\n    fn from_config_data(config_data: HashMap\u003cString, Value\u003e) -\u003e ConfigResult\u003cSelf\u003e {\n        debug!(\"Creating Cubtera config from {} config values\", config_data.len());\n        \n        // Convert HashMap to JSON Value for deserialization\n        let config_value = serde_json::to_value(\u0026config_data)\n            .serialization_error(\"json\")?;\n        \n        // Deserialize to CubteraConfig\n        let mut config = serde_json::from_value::\u003cCubteraConfig\u003e(config_value)\n            .serialization_error(\"json\")?;\n        \n        // Post-process paths\n        config.resolve_paths(\u0026config_data)?;\n        \n        // Initialize database connection if configured\n        config.initialize_database()?;\n        \n        // Validate the final configuration\n        config.validate()?;\n        \n        debug!(\"Cubtera config created successfully\");\n        Ok(config)\n    }\n    \n    /// Resolve and validate all paths in the configuration\n    fn resolve_paths(\u0026mut self, config_data: \u0026HashMap\u003cString, Value\u003e) -\u003e ConfigResult\u003c()\u003e {\n        debug!(\"Resolving configuration paths\");\n        \n        // Resolve workspace path\n        self.workspace_path = convert_path_to_absolute(self.workspace_path.clone())\n            .unwrap_or_else(|_| {\n                warn!(\"Failed to resolve workspace_path: {}\", self.workspace_path);\n                self.workspace_path.clone()\n            });\n        \n        // Resolve other paths based on workspace or explicit configuration\n        self.modules_path = self.resolve_path(config_data, \"modules\")?;\n        self.units_path = self.resolve_path(config_data, \"units\")?;\n        self.plugins_path = self.resolve_path(config_data, \"plugins\")?;\n        self.inventory_path = self.resolve_path(config_data, \"inventory\")?;\n        \n        // Resolve temp folder path\n        self.temp_folder_path = convert_path_to_absolute(self.temp_folder_path.clone())\n            .unwrap_or_else(|_| {\n                warn!(\"Failed to resolve temp_folder_path: {}\", self.temp_folder_path);\n                self.temp_folder_path.clone()\n            });\n        \n        debug!(\"All paths resolved successfully\");\n        Ok(())\n    }\n    \n    /// Resolve a specific path type (modules, units, plugins, inventory)\n    fn resolve_path(\u0026self, config_data: \u0026HashMap\u003cString, Value\u003e, path_type: \u0026str) -\u003e ConfigResult\u003cString\u003e {\n        let path = config_data\n            .get(\u0026format!(\"{}_path\", path_type))\n            .and_then(|v| v.as_str().map(|s| s.to_string()))\n            .unwrap_or_else(|| {\n                // Use folder name if specified, otherwise use default\n                let folder_name = config_data\n                    .get(\u0026format!(\"{}_folder\", path_type))\n                    .and_then(|v| v.as_str().map(|s| s.to_string()))\n                    .unwrap_or_else(|| match path_type {\n                        \"plugins\" =\u003e default_plugins_folder(),\n                        \"modules\" =\u003e default_modules_folder(),\n                        \"units\" =\u003e default_units_folder(),\n                        \"inventory\" =\u003e default_inventory_folder(),\n                        _ =\u003e path_type.to_string(),\n                    });\n                \n                format!(\"{}/{}\", self.workspace_path, folder_name)\n            });\n        \n        // Convert to absolute path\n        let absolute_path = convert_path_to_absolute(path.clone())\n            .unwrap_or_else(|_| {\n                warn!(\"Failed to resolve {}_path: {}\", path_type, path);\n                path.clone()\n            });\n        \n        Ok(absolute_path)\n    }\n    \n    /// Initialize database connection if configured\n    fn initialize_database(\u0026mut self) -\u003e ConfigResult\u003c()\u003e {\n        if let Some(db_connection_string) = \u0026self.db {\n            debug!(\"Initializing database connection\");\n            \n            match db::connect(db_connection_string) {\n                Ok(client) =\u003e {\n                    self.db_client = Some(client);\n                    debug!(\"Database connection established successfully\");\n                }\n                Err(e) =\u003e {\n                    warn!(\"Failed to connect to database: {}\", e);\n                    // Don't fail the entire config loading for database connection issues\n                    // Just log the warning and continue without database\n                }\n            }\n        }\n        \n        Ok(())\n    }\n    \n    /// Get database client if available\n    pub fn get_db(\u0026self) -\u003e Option\u003cmongodb::sync::Client\u003e {\n        self.db_client.clone()\n    }\n    \n    /// Get runner configuration by type\n    pub fn get_runner_by_type(\u0026self, runner_type: \u0026str) -\u003e Option\u003cHashMap\u003cString, String\u003e\u003e {\n        self.runner\n            .as_ref()\n            .and_then(|r| r.get(runner_type).cloned())\n    }\n    \n    /// Get configuration as pretty-printed JSON\n    pub fn get_json(\u0026self) -\u003e ConfigResult\u003cString\u003e {\n        serde_json::to_string_pretty(self)\n            .serialization_error(\"json\")\n    }\n    \n    /// Validate the configuration\n    pub fn validate(\u0026self) -\u003e ConfigResult\u003c()\u003e {\n        // Validate workspace path\n        if self.workspace_path.is_empty() {\n            return Err(ConfigError::validation(\"workspace_path\", \"cannot be empty\"));\n        }\n        \n        // Validate organization\n        if self.org.is_empty() {\n            return Err(ConfigError::validation(\"org\", \"cannot be empty\"));\n        }\n        \n        // Validate that orgs list contains the current org\n        if !self.orgs.contains(\u0026self.org) {\n            warn!(\"Current org '{}' is not in the orgs list: {:?}\", self.org, self.orgs);\n        }\n        \n        // Validate file name separator\n        if self.file_name_separator.is_empty() {\n            return Err(ConfigError::validation(\"file_name_separator\", \"cannot be empty\"));\n        }\n        \n        // Validate paths exist or can be created (basic check)\n        for (name, path) in [\n            (\"workspace_path\", \u0026self.workspace_path),\n            (\"inventory_path\", \u0026self.inventory_path),\n            (\"units_path\", \u0026self.units_path),\n            (\"modules_path\", \u0026self.modules_path),\n            (\"plugins_path\", \u0026self.plugins_path),\n            (\"temp_folder_path\", \u0026self.temp_folder_path),\n        ] {\n            if path.is_empty() {\n                return Err(ConfigError::validation(name, \"cannot be empty\"));\n            }\n        }\n        \n        debug!(\"Configuration validation passed\");\n        Ok(())\n    }\n}\n\n// Serde helper functions for colon-separated lists\nfn deserialize_colon_list\u003c'de, D\u003e(deserializer: D) -\u003e std::result::Result\u003cVec\u003cString\u003e, D::Error\u003e\nwhere\n    D: Deserializer\u003c'de\u003e,\n{\n    let s: String = String::deserialize(deserializer)?;\n    Ok(s.split(':').map(|s| s.to_string()).collect())\n}\n\n#[allow(clippy::ptr_arg)]\nfn serialize_colon_list\u003cS\u003e(list: \u0026Vec\u003cString\u003e, serializer: S) -\u003e std::result::Result\u003cS::Ok, S::Error\u003e\nwhere\n    S: Serializer,\n{\n    let joined = list.join(\":\");\n    serializer.serialize_str(\u0026joined)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde_json::json;\n    use std::env;\n    \n    #[test]\n    fn test_default_config() {\n        let config = CubteraConfig::default();\n        assert_eq!(config.org, \"cubtera\");\n        assert_eq!(config.workspace_path, \"~/.cubtera/workspace\");\n        assert!(!config.clean_cache);\n        assert!(config.always_copy_files);\n    }\n    \n    #[test]\n    fn test_new_config() {\n        let config = CubteraConfig::new();\n        assert_eq!(config.org, \"cubtera\");\n    }\n    \n    #[test]\n    fn test_from_config_data() {\n        let mut config_data = HashMap::new();\n        config_data.insert(\"org\".to_string(), json!(\"testorg\"));\n        config_data.insert(\"workspace_path\".to_string(), json!(\"/test/workspace\"));\n        config_data.insert(\"clean_cache\".to_string(), json!(true));\n        \n        let config = CubteraConfig::from_config_data(config_data).unwrap();\n        assert_eq!(config.org, \"testorg\");\n        assert!(config.clean_cache);\n    }\n    \n    #[test]\n    fn test_validate_valid_config() {\n        let config = CubteraConfig::default();\n        assert!(config.validate().is_ok());\n    }\n    \n    #[test]\n    fn test_validate_empty_workspace_path() {\n        let mut config = CubteraConfig::default();\n        config.workspace_path = String::new();\n        \n        let result = config.validate();\n        assert!(result.is_err());\n    }\n    \n    #[test]\n    fn test_validate_empty_org() {\n        let mut config = CubteraConfig::default();\n        config.org = String::new();\n        \n        let result = config.validate();\n        assert!(result.is_err());\n    }\n    \n    #[test]\n    fn test_get_runner_by_type() {\n        let mut config = CubteraConfig::default();\n        let mut runners = HashMap::new();\n        let mut terraform_config = HashMap::new();\n        terraform_config.insert(\"version\".to_string(), \"1.0.0\".to_string());\n        runners.insert(\"terraform\".to_string(), terraform_config.clone());\n        config.runner = Some(runners);\n        \n        let result = config.get_runner_by_type(\"terraform\");\n        assert!(result.is_some());\n        assert_eq!(result.unwrap().get(\"version\").unwrap(), \"1.0.0\");\n        \n        let result = config.get_runner_by_type(\"nonexistent\");\n        assert!(result.is_none());\n    }\n    \n    #[test]\n    fn test_colon_list_serialization() {\n        let list = vec![\"a\".to_string(), \"b\".to_string(), \"c\".to_string()];\n        let serialized = serde_json::to_string(\u0026list).unwrap();\n        // This tests the normal JSON serialization, not our custom colon serialization\n        assert!(serialized.contains(\"a\") \u0026\u0026 serialized.contains(\"b\") \u0026\u0026 serialized.contains(\"c\"));\n    }\n} ","traces":[{"line":64,"address":[],"length":0,"stats":{"Line":44}},{"line":65,"address":[],"length":0,"stats":{"Line":88}},{"line":68,"address":[],"length":0,"stats":{"Line":9}},{"line":69,"address":[],"length":0,"stats":{"Line":18}},{"line":72,"address":[],"length":0,"stats":{"Line":10}},{"line":73,"address":[],"length":0,"stats":{"Line":20}},{"line":76,"address":[],"length":0,"stats":{"Line":9}},{"line":77,"address":[],"length":0,"stats":{"Line":36}},{"line":80,"address":[],"length":0,"stats":{"Line":10}},{"line":81,"address":[],"length":0,"stats":{"Line":20}},{"line":84,"address":[],"length":0,"stats":{"Line":9}},{"line":85,"address":[],"length":0,"stats":{"Line":36}},{"line":88,"address":[],"length":0,"stats":{"Line":10}},{"line":89,"address":[],"length":0,"stats":{"Line":20}},{"line":92,"address":[],"length":0,"stats":{"Line":9}},{"line":93,"address":[],"length":0,"stats":{"Line":36}},{"line":96,"address":[],"length":0,"stats":{"Line":10}},{"line":97,"address":[],"length":0,"stats":{"Line":20}},{"line":100,"address":[],"length":0,"stats":{"Line":9}},{"line":101,"address":[],"length":0,"stats":{"Line":36}},{"line":104,"address":[],"length":0,"stats":{"Line":9}},{"line":105,"address":[],"length":0,"stats":{"Line":54}},{"line":108,"address":[],"length":0,"stats":{"Line":9}},{"line":109,"address":[],"length":0,"stats":{"Line":18}},{"line":112,"address":[],"length":0,"stats":{"Line":8}},{"line":113,"address":[],"length":0,"stats":{"Line":16}},{"line":116,"address":[],"length":0,"stats":{"Line":9}},{"line":117,"address":[],"length":0,"stats":{"Line":18}},{"line":121,"address":[],"length":0,"stats":{"Line":8}},{"line":123,"add \")]\n    ConfigFile { path: String, message: String },\n    \n    /// Serialization/deserialization errors\n    #[error(\"Serialization error: {format}: {message}\")]\n    Serialization { format: String, message: String },\n    \n    /// Path resolution errors\n    #[error(\"Path error: {path}: {message}\")]\n    Path { path: String, message: String },\n    \n    /// Database connection errors\n    #[error(\"Database connection error: {connection_string}: {message}\")]\n    Database { connection_string: String, message: String },\n    \n    /// Validation errors\n    #[error(\"Validation error: {field}: {message}\")]\n    Validation { field: String, message: String },\n}\n\n/// Result type for configuration operations\npub type ConfigResult\u003cT\u003e = CubteraResult\u003cT\u003e;\n\nimpl ConfigError {\n    /// Create an environment variable error\n    pub fn env_var(message: impl Into\u003cString\u003e) -\u003e CubteraError {\n        CubteraError::Config { \n            message: format!(\"Environment variable error: {}\", message.into())\n        }\n    }\n    \n    /// Create a config file error\n    pub fn config_file(path: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e CubteraError {\n        CubteraError::Config { \n            message: format!(\"Config file error: {}: {}\", path.into(), message.into())\n        }\n    }\n    \n    /// Create a serialization error\n    pub fn serialization(format: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e CubteraError {\n        CubteraError::Config { \n            message: format!(\"Serialization error: {}: {}\", format.into(), message.into())\n        }\n    }\n    \n    /// Create a path error\n    pub fn path_error(path: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e CubteraError {\n        CubteraError::Config { \n            message: format!(\"Path error: {}: {}\", path.into(), message.into())\n        }\n    }\n    \n    /// Create a database error\n    pub fn database(connection_string: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e CubteraError {\n        CubteraError::Config { \n            message: format!(\"Database connection error: {}: {}\", connection_string.into(), message.into())\n        }\n    }\n    \n    /// Create a validation error\n    pub fn validation(field: impl Into\u003cString\u003e, message: impl Into\u003cString\u003e) -\u003e CubteraError {\n        CubteraError::Config { \n            message: format!(\"Validation error: {}: {}\", field.into(), message.into())\n        }\n    }\n}\n\n/// Extension trait for config-specific error handling\npub trait ConfigResultExt\u003cT\u003e {\n    /// Convert any error to a config file error\n    fn config_file_error(self, path: \u0026str) -\u003e ConfigResult\u003cT\u003e;\n    \n    /// Convert any error to an environment variable error\n    fn env_var_error(self, var_name: \u0026str) -\u003e ConfigResult\u003cT\u003e;\n    \n    /// Convert any error to a serialization error\n    fn serialization_error(self, format: \u0026str) -\u003e ConfigResult\u003cT\u003e;\n    \n    /// Convert any error to a path error\n    fn path_error(self, path: \u0026str) -\u003e ConfigResult\u003cT\u003e;\n    \n    /// Convert any error to a database error\n    fn database_error(self, connection_string: \u0026str) -\u003e ConfigResult\u003cT\u003e;\n    \n    /// Convert any error to a validation error\n    fn validation_error(self, field: \u0026str) -\u003e ConfigResult\u003cT\u003e;\n}\n\nimpl\u003cT, E: std::fmt::Display\u003e ConfigResultExt\u003cT\u003e for std::result::Result\u003cT, E\u003e {\n    fn config_file_error(self, path: \u0026str) -\u003e ConfigResult\u003cT\u003e {\n        self.map_err(|e| ConfigError::config_file(path, e.to_string()))\n    }\n    \n    fn env_var_error(self, var_name: \u0026str) -\u003e ConfigResult\u003cT\u003e {\n        self.map_err(|e| ConfigError::env_var(format!(\"{}: {}\", var_name, e)))\n    }\n    \n    fn serialization_error(self, format: \u0026str) -\u003e ConfigResult\u003cT\u003e {\n        self.map_err(|e| ConfigError::serialization(format, e.to_string()))\n    }\n    \n    fn path_error(self, path: \u0026str) -\u003e ConfigResult\u003cT\u003e {\n        self.map_err(|e| ConfigError::path_error(path, e.to_string()))\n    }\n    \n    fn database_error(self, connection_string: \u0026str) -\u003e ConfigResult\u003cT\u003e {\n        self.map_err(|e| ConfigError::database(connection_string, e.to_string()))\n    }\n    \n    fn validation_error(self, field: \u0026str) -\u003e ConfigResult\u003cT\u003e {\n        self.map_err(|e| ConfigError::validation(field, e.to_string()))\n    }\n} ","traces":[{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":3}},{"line":74,"address":[],"length":0,"stats":{"Line":15}},{"line":101,"address":[],"length":0,"stats":{"Line":0}},{"line":102,"address":[],"length":0,"stats":{"Line":0}},{"line":105,"address":[],"length":0,"stats":{"Line":4}},{"line":106,"address":[],"length":0,"stats":{"Line":8}},{"line":109,"address":[],"length":0,"stats":{"Line":2}},{"line":110,"address":[],"length":0,"stats":{"Line":4}},{"line":113,"address":[],"length":0,"stats":{"Line":0}},{"line":114,"address":[],"length":0,"stats":{"Line":0}},{"line":117,"address":[],"length":0,"stats":{"Line":0}},{"line":118,"address":[],"length":0,"stats":{"Line":0}},{"line":121,"address":[],"length":0,"stats":{"Line":0}},{"line":122,"address":[],"length":0,"stats":{"Line":0}}],"covered":6,"coverable":24},{"path":["/","Users","denis","Projects","cubtera","src","core","cfg","loader.rs"],"content":"use super::error::{ConfigError, ConfigResult, ConfigResultExt};\nuse crate::tools::convert_path_to_absolute;\nuse log::{warn, debug};\nuse serde_json::Value;\nuse std::collections::HashMap;\nuse std::path::Path;\nuse yansi::Paint;\n\n/// Configuration loader responsible for reading config from various sources\npub struct ConfigLoader {\n    /// Environment variable prefix\n    env_prefix: String,\n    /// Default config file path\n    default_config_path: String,\n}\n\nimpl Default for ConfigLoader {\n    fn default() -\u003e Self {\n        Self {\n            env_prefix: \"CUBTERA\".to_string(),\n            default_config_path: \"~/.cubtera/config.toml\".to_string(),\n        }\n    }\n}\n\nimpl ConfigLoader {\n    /// Create a new config loader\n    pub fn new() -\u003e Self {\n        Self::default()\n    }\n    \n    /// Set custom environment variable prefix\n    pub fn with_env_prefix(mut self, prefix: impl Into\u003cString\u003e) -\u003e Self {\n        self.env_prefix = prefix.into();\n        self\n    }\n    \n    /// Set custom default config file path\n    pub fn with_default_config_path(mut self, path: impl Into\u003cString\u003e) -\u003e Self {\n        self.default_config_path = path.into();\n        self\n    }\n    \n    /// Load environment variables with the configured prefix\n    pub fn load_env_vars(\u0026self) -\u003e ConfigResult\u003cHashMap\u003cString, Value\u003e\u003e {\n        debug!(\"Loading environment variables with prefix: {}\", self.env_prefix.yellow());\n        \n        config::Config::builder()\n            .add_source(\n                config::Environment::with_prefix(\u0026self.env_prefix)\n                    .ignore_empty(true)\n                    .prefix_separator(\"_\")\n                    .separator(\"__\"),\n            )\n            .build()\n            .env_var_error(\u0026format!(\"{}_*\", self.env_prefix))?\n            .try_deserialize::\u003cHashMap\u003cString, Value\u003e\u003e()\n            .env_var_error(\u0026format!(\"{}_* deserialization\", self.env_prefix))\n    }\n    \n    /// Determine config file path from environment variables or use default\n    pub fn determine_config_path(\u0026self, env_vars: \u0026HashMap\u003cString, Value\u003e) -\u003e ConfigResult\u003cString\u003e {\n        let config_path = env_vars\n            .get(\"config\")\n            .and_then(|v| v.as_str().map(|s| s.to_string()))\n            .map(|s| {\n                convert_path_to_absolute(s.clone())\n                    .unwrap_or_else(|_| {\n                        warn!(\"Failed to convert config path to absolute: {}\", s);\n                        s\n                    })\n            })\n            .unwrap_or_else(|| {\n                warn!(\n                    target: \"cfg\", \n                    \"{}_CONFIG is not provided. Using: {}\", \n                    self.env_prefix,\n                    self.default_config_path.blue()\n                );\n                \n                convert_path_to_absolute(self.default_config_path.clone())\n                    .unwrap_or_else(|_| {\n                        warn!(\"Failed to convert default config path to absolute: {}\", self.default_config_path);\n                        self.default_config_path.clone()\n                    })\n            });\n            \n        Ok(config_path)\n    }\n    \n    /// Load configuration from file (TOML format)\n    pub fn load_config_file(\u0026self, path: \u0026str) -\u003e ConfigResult\u003cHashMap\u003cString, HashMap\u003cString, Value\u003e\u003e\u003e {\n        debug!(\"Loading config file: {}\", path.blue());\n        \n        // Try to load the config file, but don't fail if it doesn't exist\n        let config_result = config::Config::builder()\n            .add_source(config::File::from(Path::new(path)))\n            .build()\n            .and_then(|cfg| cfg.try_deserialize::\u003cHashMap\u003cString, HashMap\u003cString, Value\u003e\u003e\u003e());\n            \n        match config_result {\n            Ok(config) =\u003e {\n                debug!(\"Successfully loaded config file: {}\", path);\n                Ok(config)\n            }\n            Err(e) =\u003e {\n                // Check if it's a file not found error (which is acceptable)\n                if e.to_string().contains(\"not found\") || e.to_string().contains(\"No such file\") {\n                    warn!(target: \"cfg\", \"Config file not found: {}. Using default configuration.\", path.blue());\n                    Ok(HashMap::new())\n                } else {\n                    // Other errors are more serious\n                    warn!(\"Failed to read config file {}: {}. Using default configuration.\", path.blue(), e);\n                    Ok(HashMap::new())\n                }\n            }\n        }\n    }\n    \n    /// Determine organization from environment variables or use default\n    pub fn determine_org(\u0026self, env_vars: \u0026HashMap\u003cString, Value\u003e) -\u003e String {\n        env_vars\n            .get(\"org\")\n            .and_then(|v| v.as_str().map(|s| s.to_string()))\n            .unwrap_or_else(|| {\n                warn!(\n                    target: \"cfg\", \n                    \"{}_ORG is not provided. Using: {}\", \n                    self.env_prefix,\n                    \"cubtera\".blue()\n                );\n                \"cubtera\".to_string()\n            })\n    }\n    \n    /// Merge configuration from multiple sources with priority:\n    /// 1. Environment variables (highest priority)\n    /// 2. Organization-specific config section\n    /// 3. Default config section (lowest priority)\n    pub fn merge_config_sources(\n        \u0026self,\n        config_file: HashMap\u003cString, HashMap\u003cString, Value\u003e\u003e,\n        env_vars: HashMap\u003cString, Value\u003e,\n        org: \u0026str,\n    ) -\u003e HashMap\u003cString, Value\u003e {\n        debug!(\"Merging config sources for org: {}\", org);\n        \n        // Start with default section from config file\n        let mut merged_config = config_file.get(\"default\").cloned().unwrap_or_default();\n        \n        // Override with organization-specific section\n        if let Some(org_config) = config_file.get(org) {\n            debug!(\"Found organization-specific config for: {}\", org);\n            merged_config.extend(org_config.clone());\n        }\n        \n        // Override with environment variables (highest priority)\n        merged_config.extend(env_vars);\n        \n        debug!(\"Merged config has {} keys\", merged_config.len());\n        merged_config\n    }\n    \n    /// Validate that required configuration values are present\n    pub fn validate_config(\u0026self, config: \u0026HashMap\u003cString, Value\u003e) -\u003e ConfigResult\u003c()\u003e {\n        // Basic validation - just check for obviously invalid values\n        // Detailed validation will be done in CubteraConfig::validate()\n        \n        if let Some(workspace_path) = config.get(\"workspace_path\") {\n            if let Some(path_str) = workspace_path.as_str() {\n                if path_str.is_empty() {\n                    return Err(ConfigError::validation(\"workspace_path\", \"cannot be empty\"));\n                }\n            }\n        }\n        \n        if let Some(org) = config.get(\"org\") {\n            if let Some(org_str) = org.as_str() {\n                if org_str.is_empty() {\n                    return Err(ConfigError::validation(\"org\", \"cannot be empty\"));\n                }\n            }\n        }\n        \n        Ok(())\n    }\n    \n    /// Load complete configuration from all sources\n    pub fn load_complete_config(\u0026self) -\u003e ConfigResult\u003cHashMap\u003cString, Value\u003e\u003e {\n        // Load environment variables\n        let env_vars = self.load_env_vars()?;\n        \n        // Determine config file path\n        let config_path = self.determine_config_path(\u0026env_vars)?;\n        \n        // Load config file\n        let config_file = self.load_config_file(\u0026config_path)?;\n        \n        // Determine organization\n        let org = self.determine_org(\u0026env_vars);\n        \n        // Merge all sources\n        let merged_config = self.merge_config_sources(config_file, env_vars, \u0026org);\n        \n        // Validate configuration\n        self.validate_config(\u0026merged_config)?;\n        \n        if merged_config.is_empty() {\n            warn!(target: \"cfg\", \"No configuration found. Using default values\");\n        } else {\n            debug!(\"Configuration loaded successfully with {} keys\", merged_config.len());\n        }\n        \n        Ok(merged_config)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use serde_json::json;\n    use std::env;\n    \n    #[test]\n    fn test_config_loader_creation() {\n        let loader = ConfigLoader::new();\n        assert_eq!(loader.env_prefix, \"CUBTERA\");\n        assert_eq!(loader.default_config_path, \"~/.cubtera/config.toml\");\n    }\n    \n    #[test]\n    fn test_config_loader_with_custom_prefix() {\n        let loader = ConfigLoader::new().with_env_prefix(\"TEST\");\n        assert_eq!(loader.env_prefix, \"TEST\");\n    }\n    \n    #[test]\n    fn test_config_loader_with_custom_path() {\n        let loader = ConfigLoader::new().with_default_config_path(\"/custom/path.toml\");\n        assert_eq!(loader.default_config_path, \"/custom/path.toml\");\n    }\n    \n    #[test]\n    fn test_determine_org_from_env() {\n        let loader = ConfigLoader::new();\n        let mut env_vars = HashMap::new();\n        env_vars.insert(\"org\".to_string(), json!(\"myorg\"));\n        \n        let org = loader.determine_org(\u0026env_vars);\n        assert_eq!(org, \"myorg\");\n    }\n    \n    #[test]\n    fn test_determine_org_default() {\n        let loader = ConfigLoader::new();\n        let env_vars = HashMap::new();\n        \n        let org = loader.determine_org(\u0026env_vars);\n        assert_eq!(org, \"cubtera\");\n    }\n    \n    #[test]\n    fn test_merge_config_sources() {\n        let loader = ConfigLoader::new();\n        \n        // Config file with default and org sections\n        let mut config_file = HashMap::new();\n        let mut default_section = HashMap::new();\n        default_section.insert(\"key1\".to_string(), json!(\"default_value1\"));\n        default_section.insert(\"key2\".to_string(), json!(\"default_value2\"));\n        config_file.insert(\"default\".to_string(), default_section);\n        \n        let mut org_section = HashMap::new();\n        org_section.insert(\"key2\".to_string(), json!(\"org_value2\"));\n        org_section.insert(\"key3\".to_string(), json!(\"org_value3\"));\n        config_file.insert(\"myorg\".to_string(), org_section);\n        \n        // Environment variables\n        let mut env_vars = HashMap::new();\n        env_vars.insert(\"key3\".to_string(), json!(\"env_value3\"));\n        env_vars.insert(\"key4\".to_string(), json!(\"env_value4\"));\n        \n        let merged = loader.merge_config_sources(config_file, env_vars, \"myorg\");\n        \n        // Check priority: env \u003e org \u003e default\n        assert_eq!(merged.get(\"key1\").unwrap(), \u0026json!(\"default_value1\")); // from default\n        assert_eq!(merged.get(\"key2\").unwrap(), \u0026json!(\"org_value2\"));     // from org (overrides default)\n        assert_eq!(merged.get(\"key3\").unwrap(), \u0026json!(\"env_value3\"));     // from env (overrides org)\n        assert_eq!(merged.get(\"key4\").unwrap(), \u0026json!(\"env_value4\"));     // from env only\n    }\n    \n    #[test]\n    fn test_validate_config_empty_workspace_path() {\n        let loader = ConfigLoader::new();\n        let mut config = HashMap::new();\n        config.insert(\"workspace_path\".to_string(), json!(\"\"));\n        \n        let result = loader.validate_config(\u0026config);\n        assert!(result.is_err());\n    }\n    \n    #[test]\n    fn test_validate_config_valid() {\n        let loader = ConfigLoader::new();\n        let mut config = HashMap::new();\n        config.insert(\"workspace_path\".to_string(), json!(\"/valid/path\"));\n        \n        let result = loader.validate_config(\u0026config);\n        assert!(result.is_ok());\n    }\n} ","traces":[{"line":18,"address":[],"length":0,"stats":{"Line":10}},{"line":20,"address":[],"length":0,"stats":{"Line":30}},{"line":21,"address":[],"length":0,"stats":{"Line":10}},{"line":28,"address":[],"length":0,"stats":{"Line":10}},{"line":29,"address":[],"length":0,"stats":{"Line":10}},{"line":33,"address":[],"length":0,"stats":{"Line":2}},{"line":34,"address":[],"length":0,"stats":{"Line":6}},{"line":35,"address":[],"length":0,"stats":{"Line":2}},{"line":39,"address":[],"length":0,"stats":{"Line":2}},{"line":40,"address":[],"length":0,"stats":{"Line":6}},{"line":41,"address":[],"length":0,"stats":{"Line":2}},{"line":45,"address":[],"length":0,"stats":{"Line":2}},{"line":46,"address":[],"length":0,"stats":{"Line":2}},{"line":48,"address":[],"length":0,"stats":{"Line":2}},{"line":50,"address":[],"length":0,"stats":{"Line":4}},{"line":51,"address":[],"length":0,"stats":{"Line":2}},{"line":52,"address":[],"length":0,"stats":{"Line":4}},{"line":53,"address":[],"length":0,"stats":{"Line":4}},{"line":56,"address":[],"length":0,"stats":{"Line":4}},{"line":62,"address":[],"length":0,"stats":{"Line":2}},{"line":63,"address":[],"length":0,"stats":{"Line":4}},{"line":65,"address":[],"length":0,"stats":{"Line":2}},{"line":66,"address":[],"length":0,"stats":{"Line":2}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"  configuration errors, exit the application\n            exit_with_error(format!(\"Failed to load configuration: {}\", e));\n        }\n    }\n});\n\n/// Initialize global configuration with custom error handling\n/// \n/// This function allows for custom initialization of the global configuration\n/// with specific error handling strategies.\npub fn init_global_config() -\u003e ConfigResult\u003c()\u003e {\n    // Force initialization of the global config\n    Lazy::force(\u0026GLOBAL_CFG);\n    Ok(())\n}\n\n/// Get a reference to the global configuration\n/// \n/// This is a safe way to access the global configuration that has been\n/// initialized with proper error handling.\npub fn get_global_config() -\u003e \u0026'static CubteraConfig {\n    \u0026GLOBAL_CFG\n}\n\n/// Load configuration with custom settings\n/// \n/// This function provides a way to load configuration with custom\n/// environment prefix or config file path for testing or special use cases.\npub fn load_custom_config(\n    env_prefix: Option\u003c\u0026str\u003e,\n    config_path: Option\u003c\u0026str\u003e,\n) -\u003e ConfigResult\u003cCubteraConfig\u003e {\n    let mut loader = ConfigLoader::new();\n    \n    if let Some(prefix) = env_prefix {\n        loader = loader.with_env_prefix(prefix);\n    }\n    \n    if let Some(path) = config_path {\n        loader = loader.with_default_config_path(path);\n    }\n    \n    CubteraConfig::load_with_loader(loader)\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::env;\n    \n    #[test]\n    fn test_global_config_access() {\n        let config = get_global_config();\n        assert!(!config.org.is_empty());\n    }\n    \n    #[test]\n    fn test_load_custom_config() {\n        let result = load_custom_config(Some(\"TEST\"), Some(\"/nonexistent/config.toml\"));\n        // Should succeed with defaults even if config file doesn't exist\n        assert!(result.is_ok());\n    }\n    \n    #[test]\n    fn test_init_global_config() {\n        let result = init_global_config();\n        assert!(result.is_ok());\n    }\n} ","traces":[{"line":18,"address":[],"length":0,"stats":{"Line":1}},{"line":19,"address":[],"length":0,"stats":{"Line":1}},{"line":20,"address":[],"length":0,"stats":{"Line":1}},{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":1}},{"line":34,"address":[],"length":0,"stats":{"Line":2}},{"line":35,"address":[],"length":0,"stats":{"Line":1}},{"line":42,"address":[],"length":0,"stats":{"Line":1}},{"line":43,"address":[],"length":0,"stats":{"Line":1}},{"line":50,"address":[],"length":0,"stats":{"Line":1}},{"line":54,"address":[],"length":0,"stats":{"Line":2}},{"line":56,"address":[],"length":0,"stats":{"Line":2}},{"line":60,"address":[],"length":0,"stats":{"Line":2}},{"line":64,"address":[],"length":0,"stats":{"Line":2}}],"covered":13,"coverable":15},{"path":["/","Users","denis","Projects","cubtera","src","core","dim","builder.rs"],"content":"use super::{Dim, data::*};\nuse super::error::{DimError, DimResult};\nuse crate::prelude::*;\nuse serde_json::{json, Value};\nuse std::collections::HashMap;\nuse std::ops::Not;\nuse std::path::{Path, PathBuf};\n\n/// Builder pattern for creating Dim instances with various configurations\npub struct DimBuilder {\n    pub(crate) dim_name: String,\n    pub(crate) dim_type: String,\n    pub(crate) org: String,\n    pub(crate) dim_path: PathBuf,\n    pub(crate) data: Value,\n    pub(crate) default_data: Value,\n    pub(crate) datasource: Box\u003cdyn DataSource\u003e,\n    pub(crate) storage: Storage,\n}\n\nimpl Default for DimBuilder {\n    fn default() -\u003e Self {\n        Self {\n            dim_name: String::new(),\n            dim_type: String::new(),\n            org: String::new(),\n            dim_path: PathBuf::new(),\n            datasource: data_src_init(\"\", \"\", Storage::FS),\n            storage: Storage::FS,\n            data: Value::Null,\n            default_data: Value::Null,\n        }\n    }\n}\n\nimpl DimBuilder {\n    /// Switch the datasource to a different storage backend\n    pub fn switch_datasource(mut self, storage: \u0026Storage) -\u003e Self {\n        self.storage = storage.clone();\n        self.datasource = data_src_init(\u0026self.org, \u0026self.dim_type, storage.clone());\n        self\n    }\n\n    /// Create a new DimBuilder with specified type, organization, and storage\n    pub fn new(dim_type: \u0026str, org: \u0026str, storage: \u0026Storage) -\u003e Self {\n        let datasource = data_src_init(org, dim_type, storage.clone());\n        Self {\n            dim_path: Path::new(\u0026GLOBAL_CFG.inventory_path)\n                .join(org)\n                .join(dim_type),\n            dim_type: dim_type.into(),\n            org: org.into(),\n            datasource,\n            storage: storage.clone(),\n            ..Default::default()\n        }\n    }\n\n    /// Create a Dim from CLI input (exits on error)\n    pub fn new_from_cli(dim: \u0026str, org: \u0026str, storage: \u0026Storage, context: Option\u003cString\u003e) -\u003e Dim {\n        match Self::new_from_cli_safe(dim, org, storage, context) {\n            Ok(dim) =\u003e dim,\n            Err(e) =\u003e exit_with_error(format!(\"{}\", e)),\n        }\n    }\n    \n    /// Safe version of new_from_cli that returns Result instead of exiting\n    pub fn new_from_cli_safe(dim: \u0026str, org: \u0026str, storage: \u0026Storage, context: Option\u003cString\u003e) -\u003e DimResult\u003cDim\u003e {\n        let (dim_type, dim_name) = Self::split_by_colon_safe(dim)?;\n        Ok(Self::new(\u0026dim_type, org, storage)\n            .with_name(\u0026dim_name)\n            .with_context(context)\n            .full_build())\n    }\n\n    /// Create an undefined dimension with null values for all fields\n    pub fn new_undefined(dim_type: \u0026str) -\u003e Self {\n        let storage = match \u0026GLOBAL_CFG.db_client {\n            Some(_) =\u003e Storage::DB,\n            None =\u003e Storage::FS,\n        };\n\n        let dim = Self::new(dim_type, \u0026GLOBAL_CFG.org, \u0026storage).read_default_data();\n\n        let null_data: Value = dim\n            .default_data\n            .clone()\n            .as_object_mut()\n            .unwrap_or(\u0026mut serde_json::Map::new())\n            .keys()\n            .map(|key| key.to_string())\n            .filter(|key| !key.starts_with(\"name\"))\n            .map(|key| (key, Value::Null))\n            .collect();\n\n        Self {\n            dim_type: dim_type.into(),\n            dim_name: \"undefined\".to_string(),\n            data: null_data,\n            ..Default::default()\n        }\n    }\n\n    /// Set the dimension name\n    pub fn with_name(mut self, dim_name: \u0026str) -\u003e Self {\n        self.dim_name = dim_name.into();\n        self.data[\"name\"] = json!(self.dim_name);\n        self\n    }\n\n    /// Set the context for the datasource\n    pub fn with_context(mut self, context: Option\u003cString\u003e) -\u003e Self {\n        self.datasource.set_context(context);\n        self\n    }\n\n    /// Get all dimension data from the datasource\n    pub fn get_all_dim_data(\u0026self) -\u003e Vec\u003cValue\u003e {\n        self.datasource.get_all_data().unwrap_or_default()\n    }\n\n    /// Get all child dimensions grouped by type\n    pub fn get_all_kids_by_name(\u0026self) -\u003e HashMap\u003cString, Vec\u003cString\u003e\u003e {\n        if GLOBAL_CFG.dim_relations.is_empty() {\n            warn!(\n                \"No dim_relations found in config for {}:{}\",\n                \u0026self.dim_type, \u0026self.dim_name\n            );\n            return HashMap::new();\n        }\n        let child_index = GLOBAL_CFG\n            .dim_relations\n            .iter()\n            .position(|r| r == \u0026self.dim_type)\n            .map(|x| x + 1)\n            .unwrap_or_default();\n        if child_index \u003e= GLOBAL_CFG.dim_relations.len() || child_index == 0 {\n            debug!(\"No child dim found for {}\", \u0026self.dim_type);\n            return HashMap::new();\n        }\n        let child_dim_type = \u0026GLOBAL_CFG.dim_relations[child_index];\n        let data = DimBuilder::new(child_dim_type, \u0026self.org, \u0026self.storage)\n            .with_context(self.datasource.get_context())\n            .get_all_dim_data()\n            .into_iter()\n            .filter(|data| data[\"name\"].is_string())\n            .filter(|data| {\n                let parent = data[\"meta\"][\"parent\"].as_str().unwrap_or_default();\n                parent == format!(\"{}:{}\", \u0026self.dim_type, \u0026self.dim_name)\n            })\n            .map(|data| data[\"name\"].as_str().unwrap_or_default().into())\n            .collect::\u003cVec\u003cString\u003e\u003e();\n\n        let mut kids: HashMap\u003cString, Vec\u003cString\u003e\u003e = HashMap::new();\n        kids.insert(child_dim_type.into(), data);\n        kids\n    }\n\n    /// Merge default data with current data\n    pub fn merge_defaults(mut self) -\u003e Self {\n        let mut data = self.data.clone();\n        merge_values(\u0026mut data, \u0026self.default_data);\n        self.data = data;\n        self\n    }\n\n    /// Get all dimension names from the datasource\n    pub fn get_all_dim_names(\u0026self) -\u003e Vec\u003cString\u003e {\n        self.datasource.get_all_names().unwrap_or_default()\n    }\n\n    /// Build a complete Dim with data loading and default merging\n    pub fn full_build(self) -\u003e Dim {\n        self.read_data()\n            .read_default_data()\n            .merge_defaults()\n            .build()\n    }\n\n    /// Build a Dim instance from the current builder state\n    pub fn build(mut self) -\u003e Dim {\n        // ------------------ parent (optional) ------------------\n        let parent = match self.data[\"meta\"].get(\"parent\") {\n            Some(parent) =\u003e {\n                let parent = parent\n                    .as_str()\n                    .unwrap_or_exit(format!(\"Parent should be a string. Got: {parent}\"));\n                if parent.find(':').is_none() {\n                    exit_with_error(format!(\n                        \"Parent must be in format \u003cparent_dim_type\u003e:\u003cparent_dim_name\u003e. Got: {parent}\"\n                    ))\n                }\n                let (parent_type, parent_name) = Self::split_by_colon(parent);\n                let parent_dim = DimBuilder::new(\u0026parent_type, \u0026self.org, \u0026self.storage)\n                    .with_name(\u0026parent_name)\n                    .with_context(self.datasource.get_context())\n                    .full_build();\n                Some(Box::new(parent_dim))\n            }\n            None =\u003e None,\n        };\n\n        let kids: Vec\u003cString\u003e = self\n            .get_all_kids_by_name()\n            .into_iter()\n            .flat_map(|(k, v)| v.into_iter().map(move |x| format!(\"{}:{}\", k, x)))\n            .collect();\n\n        // ------------------ state key path ------------------\n        // recursively combine parent path with current dim path\n        // schema: \".../{parent_dim_type}:{parent_dim_name}/{dim_type}:{dim_name}\"\n        let key_path = match parent.clone() {\n            Some(parent) =\u003e parent.key_path,\n            None =\u003e Path::new(\"\").to_path_buf(),\n        }\n        .join(format!(\"{}:{}\", \u0026self.dim_type, \u0026self.dim_name));\n\n        self.data[\"name\"] = Value::String(self.dim_name.clone());\n\n        let data_sha = get_sha_by_value(\u0026self.data);\n\n        Dim {\n            dim_name: self.dim_name,\n            dim_type: self.dim_type,\n            key_path,\n            dim_path: self.dim_path,\n            parent,\n            data: self.data,\n            data_sha,\n            kids: kids.is_empty().not().then(|| kids),\n        }\n    }\n\n    // --------------------- data operations ---------------------\n    \n    /// Get a copy of the current data\n    pub fn get_data(\u0026self) -\u003e Value {\n        self.data.clone()\n    }\n\n    /// Read data from the datasource by dimension name\n    pub fn read_data(mut self) -\u003e Self {\n        let data = self\n            .datasource\n            .get_data_by_name(\u0026self.dim_name)\n            .unwrap_or_default();\n        data.get(\"meta\").is_none().then(|| match self.storage {\n            Storage::FS =\u003e exit_with_error(format!(\n                \"Can't find meta data for dimension {}:{}\",\n                self.dim_type, self.dim_name\n            )),\n            Storage::DB =\u003e {\n                warn!(target: \"\",\n                    \"Can't find meta data for dimension {}:{}\",\n                    self.dim_type, self.dim_name\n                )\n            }\n        });\n        self.data = data.clone();\n        self\n    }\n\n    /// Save current data to the datasource\n    pub fn save_data(\u0026self) {\n        let mut data = self.data.clone();\n        data[\"name\"] = json!(self.dim_name);\n        self.datasource\n            .upsert_data_by_name(\u0026self.dim_name, data)\n            .unwrap_or_exit(format!(\"Error saving dim {} data to DB:\", \u0026self.dim_name));\n    }\n\n    /// Save all dimension data of this type to database\n    pub fn save_all_data_by_type(\u0026self) {\n        use yansi::Paint;\n        let data = self.get_all_dim_data();\n        let count = data.clone().len();\n\n        let builder = DimBuilder::new(\u0026self.dim_type, \u0026self.org, \u0026Storage::DB)\n            .with_context(self.datasource.get_context());\n        builder\n            .datasource\n            .upsert_all_data(data)\n            .unwrap_or_exit(format!(\n                \"Error saving dim {} data to DB:\",\n                \u0026self.dim_type.red()\n            ));\n        info!(target: \"im\", \"Saved {} dimensions of {} type\", count.blue(), \u0026self.dim_type.blue());\n    }\n\n    /// Delete data from the datasource\n    pub fn delete_data(\u0026self) {\n        self.datasource\n            .delete_data_by_name(\u0026self.dim_name)\n            .unwrap_or_exit(format!(\n                \"Error deleting dim {} data from DB:\",\n                \u0026self.dim_name\n            ));\n    }\n\n    // ------------------ default data operations ------------------\n    \n    /// Get a copy of the default data\n    pub fn get_default_data(\u0026self) -\u003e Value {\n        self.default_data.clone()\n    }\n\n    /// Read default data from the datasource\n    pub fn read_default_data(mut self) -\u003e Self {\n        let data = self\n            .datasource\n            .get_data_by_name(\"_default\")\n            .unwrap_or_default();\n\n        // TODO: remove \"data\" key usage and read default data as is\n        self.default_data = match self.storage {\n            Storage::DB =\u003e data.get(\"data\").cloned().unwrap_or_default(),\n            Storage::FS =\u003e data,\n        };\n\n        self\n    }\n\n    /// Save default data to the datasource\n    pub fn save_default_data(\u0026self) {\n        let data = self.default_data.clone();\n\n        // TODO: remove \"data\" key usage and save default data as is\n        let data = json!({\n            \"data\" : data\n        });\n\n        self.datasource\n            .upsert_data_by_name(\"_default\", data)\n            .unwrap_or_exit(format!(\n                \"Error saving default data {} to DB\",\n                \u0026self.dim_type\n            ));\n    }\n\n    /// Delete default data from the datasource\n    pub fn delete_default_data(\u0026self) {\n        self.datasource\n            .delete_data_by_name(\"_default\")\n            .unwrap_or_exit(format!(\n                \"Error deleting default data {} from DB:\",\n                \u0026self.dim_type\n            ));\n    }\n\n    /// Delete all data by context from the datasource\n    pub fn delete_all_data_by_context(\u0026self) {\n        if let Some(context) = self.datasource.get_context() {\n            self.datasource\n                .delete_all_by_context(\u0026context)\n                .unwrap_or_exit(format!(\n                    \"Error deleting all data by context {} from DB:\",\n                    \u0026self.dim_type\n                ));\n        }\n        self.datasource\n            .delete_all_by_context(\u0026self.datasource.get_context().unwrap_or_default())\n            .unwrap_or_exit(format!(\n                \"Error deleting all data by context {} from DB:\",\n                \u0026self.dim_type\n            ));\n    }\n\n    // ------------------ helper methods ------------------\n    \n    /// Split dimension string by colon (exits on error)\n    fn split_by_colon(dim: \u0026str) -\u003e (String, String) {\n        match Self::split_by_colon_safe(dim) {\n            Ok((dim_type, dim_name)) =\u003e (dim_type, dim_name),\n            Err(e) =\u003e exit_with_error(format!(\"{}\", e)),\n        }\n    }\n    \n    /// Safe version of split_by_colon that returns Result instead of exiting\n    fn split_by_colon_safe(dim: \u0026str) -\u003e DimResult\u003c(String, String)\u003e {\n        match dim.split_once(':') {\n            Some((dim_type, dim_name)) =\u003e {\n                if dim_type.is_empty() || dim_name.is_empty() {\n                    Err(DimError::invalid_format(dim))\n                } else {\n                    Ok((dim_type.to_string(), dim_name.to_string()))\n                }\n            }\n            None =\u003e Err(DimError::invalid_format(dim)),\n        }\n    }\n} ","traces":[{"line":22,"address":[],"length":0,"stats":{"Line":12}},{"line":24,"address":[],"length":0,"stats":{"Line":24}},{"line":25,"address":[],"length":0,"stats":{"Line":24}},{"line":26,"address":[],"length":0,"stats":{"Line":24}},{"line":27,"address":[],"length":0,"stats":{"Line":24}},{"line":28,"address":[],"leng
