(\"{:?}: {}\", self.path, e) \n            })\n    }\n\n\n\n    fn read_json_file_safe(\u0026self, file_path: \u0026std::path::Path) -\u003e DataResult\u003cValue\u003e {\n        let path_buf = file_path.to_path_buf();\n        read_json_file(\u0026path_buf)\n            .ok_or_else(|| DataSourceError::ParseError { \n                message: format!(\"Failed to parse JSON from {:?}\", file_path) \n            })\n    }\n\n    fn get_file_name_separator(\u0026self) -\u003e \u0026str {\n        \u0026self.config.file_name_separator\n    }\n\n    // Helper methods for file type determination and filtering\n    fn determine_file_type(\u0026self, filename: \u0026str, search_name: \u0026str) -\u003e String {\n        if filename == search_name {\n            \"meta\".to_string()\n        } else if filename == \".schema\" {\n            \"schema\".to_string()\n        } else {\n            let mut filter = format!(\"{}{}\", search_name, self.get_file_name_separator());\n            self.convert_underscore_prefix(\u0026mut filter);\n            filename.trim_start_matches(\u0026filter).to_string()\n        }\n    }\n\n    fn should_include_file_for_data(\u0026self, filename: \u0026str, search_name: \u0026str) -\u003e bool {\n        let mut filter = format!(\"{}{}\", search_name, self.get_file_name_separator());\n        self.convert_underscore_prefix(\u0026mut filter);\n        filename.starts_with(\u0026filter) || filename == search_name\n    }\n\n    fn should_include_file_for_names(\u0026self, filename: \u0026str) -\u003e bool {\n        let meta_suffix = format!(\"{}meta\", self.get_file_name_separator());\n        !filename.starts_with('.') \n            \u0026\u0026 !filename.contains(\"schema\")\n            \u0026\u0026 (!filename.contains(self.get_file_name_separator()) || filename.contains(\u0026meta_suffix))\n    }\n\n    fn extract_dimension_name_from_filename(\u0026self, filename: \u0026str) -\u003e String {\n        let meta_suffix = format!(\"{}meta\", self.get_file_name_separator());\n        filename.trim_end_matches(\u0026meta_suffix).to_string()\n    }\n\n    fn convert_underscore_prefix(\u0026self, filter: \u0026mut String) {\n        // this replacement required for be aligned with MongoDB restriction for \".\" in key names\n        if filter.starts_with('_') {\n            filter.replace_range(0..1, \".\")\n        }\n    }\n\n    /// Optimized method to get all relevant files in one pass\n    fn get_filtered_files(\u0026self, filter_fn: impl Fn(\u0026str) -\u003e bool) -\u003e DataResult\u003cVec\u003c(String, std::path::PathBuf)\u003e\u003e {\n        let dir_entries = self.read_directory_safe()?;\n        let mut files = Vec::new();\n        \n        for entry in dir_entries {\n            let entry = entry.map_err(|e| DataSourceError::IOError { \n                message: format!(\"Failed to read directory entry: {}\", e) \n            })?;\n            \n            let file_path = entry.path();\n            if !file_path.is_file() || file_path.extension().unwrap_or_default() != \"json\" {\n                continue;\n            }\n\n            if let Some(filename) = file_path.file_stem().and_then(std::ffi::OsStr::to_str) {\n                if filter_fn(filename) {\n                    files.push((filename.to_string(), file_path));\n                }\n            }\n        }\n\n        Ok(files)\n    }\n}\n\nimpl DataSource for JsonDataSource {\n    // Legacy methods - now call safe methods internally for backward compatibility\n    fn get_data_by_name(\u0026self, name: \u0026str) -\u003e Result\u003cValue, Box\u003cdyn std::error::Error\u003e\u003e {\n        self.get_data_by_name_safe(name)\n            .map_err(|e| Box::new(e) as Box\u003cdyn std::error::Error\u003e)\n    }\n\n    fn get_all_data(\u0026self) -\u003e Result\u003cVec\u003cValue\u003e, Box\u003cdyn std::error::Error\u003e\u003e {\n        self.get_all_data_safe()\n            .map_err(|e| Box::new(e) as Box\u003cdyn std::error::Error\u003e)\n    }\n\n    fn get_all_names(\u0026self) -\u003e Result\u003cVec\u003cString\u003e, Box\u003cdyn std::error::Error\u003e\u003e {\n        self.get_all_names_safe()\n            .map_err(|e| Box::new(e) as Box\u003cdyn std::error::Error\u003e)\n    }\n\n    fn get_all_types(\u0026self) -\u003e Result\u003cVec\u003cString\u003e, Box\u003cdyn std::error::Error\u003e\u003e {\n        self.get_all_types_safe()\n            .map_err(|e| Box::new(e) as Box\u003cdyn std::error::Error\u003e)\n    }\n\n    fn set_context(\u0026mut self, context: Option\u003cString\u003e) {\n        self.context = context;\n    }\n\n    fn get_context(\u0026self) -\u003e Option\u003cString\u003e {\n        self.context.clone()\n    }\n\n    // Safe methods with proper error handling - core implementation moved here\n    fn get_data_by_name_safe(\u0026self, name: \u0026str) -\u003e DataResult\u003cValue\u003e {\n        let mut filter = format!(\"{}{}\", name, self.get_file_name_separator());\n        // this replacement required for be aligned with MongoDB restriction for \".\" in key names\n        self.convert_underscore_prefix(\u0026mut filter);\n\n        let dir_entries = self.read_directory_safe()?;\n        \n        let mut data = HashMap::\u003cString, Value\u003e::new();\n        \n        for entry in dir_entries {\n            let entry = entry.map_err(|e| DataSourceError::IOError { \n                message: format!(\"Failed to read directory entry: {}\", e) \n            })?;\n            \n            let file_path = entry.path();\n            if !file_path.is_file() || file_path.extension().unwrap_or_default() != \"json\" {\n                continue;\n            }\n\n            let file_name = file_path.file_stem()\n                .and_then(std::ffi::OsStr::to_str)\n                .ok_or_else(|| DataSourceError::FileNotFound { \n                    filename: format!(\"{:?}\", file_path) \n                })?;\n\n            if self.should_include_file_for_data(file_name, \u0026name) {\n                let data_type = self.determine_file_type(file_name, name);\n                let file_data = self.read_json_file_safe(\u0026file_path)?;\n                data.insert(data_type, file_data);\n            }\n        }\n\n        data.insert(\"name\".into(), json!(name));\n        Ok(json!(data))\n    }\n\n    fn get_all_names_safe(\u0026self) -\u003e DataResult\u003cVec\u003cString\u003e\u003e {\n        // Use optimized filtering to get all relevant files in one pass\n        let files = self.get_filtered_files(|filename| {\n            self.should_include_file_for_names(filename)\n        })?;\n        \n        let names: Vec\u003cString\u003e = files.into_iter()\n            .map(|(filename, _)| self.extract_dimension_name_from_filename(\u0026filename))\n            .collect();\n\n        Ok(names)\n    }\n\n    fn get_all_data_safe(\u0026self) -\u003e DataResult\u003cVec\u003cValue\u003e\u003e {\n        // First get all names efficiently\n        let names = self.get_all_names_safe()?;\n        let mut data = Vec::new();\n        \n        for name in names {\n            match self.get_data_by_name_safe(\u0026name) {\n                Ok(dim_data) =\u003e data.push(dim_data),\n                Err(e) =\u003e {\n                    // Log error but continue processing other dimensions\n                    log::warn!(\"Failed to load data for dimension '{}': {}\", name, e);\n                }\n            }\n        }\n\n        Ok(data)\n    }\n\n    fn get_all_types_safe(\u0026self) -\u003e DataResult\u003cVec\u003cString\u003e\u003e {\n        let parent_path = self.path.parent()\n            .ok_or_else(|| DataSourceError::PathNotFound { \n                path: format!(\"No parent directory for {:?}\", self.path) \n            })?;\n            \n        let dir_entries = std::fs::read_dir(parent_path)\n            .map_err(|e| DataSourceError::PathNotFound { \n                path: format!(\"{:?}: {}\", parent_path, e) \n            })?;\n\n        let mut types = Vec::new();\n        \n        for entry in dir_entries {\n            let entry = entry.map_err(|e| DataSourceError::IOError { \n                message: format!(\"Failed to read directory entry: {}\", e) \n            })?;\n            \n            let path = entry.path();\n            if path.is_dir() {\n                if let Some(type_name) = path.file_name().and_then(std::ffi::OsStr::to_str) {\n                    types.push(type_name.to_string());\n                }\n            }\n        }\n\n        Ok(types)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::fs;\n    use std::io::Write;\n    use tempfile::tempdir;\n\n    fn create_test_file(dir: \u0026std::path::Path, name: \u0026str, content: \u0026str) {\n        let file_path = dir.join(name);\n        let mut file = fs::File::create(file_path).unwrap();\n        writeln!(file, \"{}\", content).unwrap();\n    }\n\n    #[test]\n    fn test_get_data_by_name() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name = \"stg1-use1\";\n        let json_content = r#\"{ \"region\": \"us-east-2\", \"vpc_cidr\": \"10.0.0.0/16\" }\"#;\n\n        // Create test directory structure and files\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name), json_content);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_data_by_name(name).unwrap();\n\n        assert_eq!(result[\"name\"], name);\n        assert_eq!(result[\"meta\"][\"region\"], \"us-east-2\");\n        assert_eq!(result[\"meta\"][\"vpc_cidr\"], \"10.0.0.0/16\");\n    }\n\n    #[test]\n    fn test_get_all_data() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name1 = \"stg1-use1\";\n        let name2 = \"stg1-use2\";\n        let json_content1 = r#\"{ \"region\": \"us-east-1\", \"vpc_cidr\": \"10.1.0.0/16\" }\"#;\n        let json_content2 = r#\"{ \"region\": \"us-east-2\", \"vpc_cidr\": \"10.2.0.0/16\" }\"#;\n\n        // Create test directory structure and files\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n        create_test_file(\u0026dim_path, \u0026format!(\"{}.json\", name1), json_content1);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name2), json_content2);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_all_data().unwrap();\n        let names = result\n            .iter()\n            .map(|v| v[\"name\"].as_str().unwrap())\n            .collect::\u003cVec\u003c\u0026str\u003e\u003e();\n        let meta = result\n            .iter()\n            .map(|v| v[\"meta\"].clone())\n            .collect::\u003cVec\u003cValue\u003e\u003e();\n\n        assert_eq!(result.len(), 2);\n        assert!(names.contains(\u0026name1));\n        assert!(names.contains(\u0026name2));\n        assert!(meta.contains(\u0026serde_json::from_str::\u003cValue\u003e(json_content1).unwrap()));\n        assert!(meta.contains(\u0026serde_json::from_str::\u003cValue\u003e(json_content2).unwrap()));\n    }\n\n    #[test]\n    fn test_get_all_names() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name1 = \"stg1-use1\";\n        let name2 = \"stg1-use2\";\n        let json_content1 = r#\"{ \"region\": \"us-east-1\", \"vpc_cidr\": \"10.1.0.0/16\" }\"#;\n        let json_content2 = r#\"{ \"region\": \"us-east-2\", \"vpc_cidr\": \"10.2.0.0/16\" }\"#;\n\n        // Create test directory structure and files\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name1), json_content1);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name2), json_content2);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_all_names().unwrap();\n\n        assert_eq!(result.len(), 2);\n        assert!(result.contains(\u0026name1.to_string()));\n        assert!(result.contains(\u0026name2.to_string()));\n    }\n\n    #[test]\n    fn test_get_all_types() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type1 = \"dc\";\n        let dim_type2 = \"env\";\n        let dim_type3 = \"dome\";\n\n        // Create test directory structure and files\n        let dim_path1 = dir.path().join(org).join(dim_type1);\n        let dim_path2 = dir.path().join(org).join(dim_type2);\n        let dim_path3 = dir.path().join(org).join(dim_type3);\n        fs::create_dir_all(\u0026dim_path1).unwrap();\n        fs::create_dir_all(\u0026dim_path2).unwrap();\n        fs::create_dir_all(\u0026dim_path3).unwrap();\n\n        let data_source = JsonDataSource::new(org, dim_type1, dir.path().to_str().unwrap());\n        let result = data_source.get_all_types().unwrap();\n\n        assert_eq!(result.len(), 3);\n        assert!(result.contains(\u0026dim_type1.to_string()));\n        assert!(result.contains(\u0026dim_type2.to_string()));\n        assert!(result.contains(\u0026dim_type3.to_string()));\n    }\n\n    // Tests for new safe methods\n    #[test]\n    fn test_get_data_by_name_safe() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name = \"stg1-use1\";\n        let json_content = r#\"{ \"region\": \"us-east-2\", \"vpc_cidr\": \"10.0.0.0/16\" }\"#;\n\n        // Create test directory structure and files\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name), json_content);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_data_by_name_safe(name).unwrap();\n\n        assert_eq!(result[\"name\"], name);\n        assert_eq!(result[\"meta\"][\"region\"], \"us-east-2\");\n        assert_eq!(result[\"meta\"][\"vpc_cidr\"], \"10.0.0.0/16\");\n    }\n\n    #[test]\n    fn test_get_data_by_name_safe_nonexistent_path() {\n        let data_source = JsonDataSource::new(\"nonexistent\", \"dc\", \"/nonexistent/path\");\n        let result = data_source.get_data_by_name_safe(\"test\");\n        \n        assert!(result.is_err());\n        match result.unwrap_err() {\n            super::DataSourceError::PathNotFound { .. } =\u003e {},\n            _ =\u003e panic!(\"Expected PathNotFound error\"),\n        }\n    }\n\n    #[test]\n    fn test_get_all_names_safe() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name1 = \"stg1-use1\";\n        let name2 = \"stg1-use2\";\n        let json_content1 = r#\"{ \"region\": \"us-east-1\", \"vpc_cidr\": \"10.1.0.0/16\" }\"#;\n        let json_content2 = r#\"{ \"region\": \"us-east-2\", \"vpc_cidr\": \"10.2.0.0/16\" }\"#;\n\n        // Create test directory structure and files\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name1), json_content1);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name2), json_content2);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_all_names_safe().unwrap();\n\n        assert_eq!(result.len(), 2);\n        assert!(result.contains(\u0026name1.to_string()));\n        assert!(result.contains(\u0026name2.to_string()));\n    }\n\n    #[test]\n    fn test_get_all_data_safe() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name1 = \"stg1-use1\";\n        let name2 = \"stg1-use2\";\n        let json_content1 = r#\"{ \"region\": \"us-east-1\", \"vpc_cidr\": \"10.1.0.0/16\" }\"#;\n        let json_content2 = r#\"{ \"region\": \"us-east-2\", \"vpc_cidr\": \"10.2.0.0/16\" }\"#;\n\n        // Create test directory structure and files\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n        create_test_file(\u0026dim_path, \u0026format!(\"{}.json\", name1), json_content1);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", name2), json_content2);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_all_data_safe().unwrap();\n        \n        assert_eq!(result.len(), 2);\n        \n        let names: Vec\u003c\u0026str\u003e = result\n            .iter()\n            .map(|v| v[\"name\"].as_str().unwrap())\n            .collect();\n        assert!(names.contains(\u0026name1));\n        assert!(names.contains(\u0026name2));\n    }\n\n    #[test]\n    fn test_get_all_types_safe() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type1 = \"dc\";\n        let dim_type2 = \"env\";\n        let dim_type3 = \"dome\";\n\n        // Create test directory structure and files\n        let dim_path1 = dir.path().join(org).join(dim_type1);\n        let dim_path2 = dir.path().join(org).join(dim_type2);\n        let dim_path3 = dir.path().join(org).join(dim_type3);\n        fs::create_dir_all(\u0026dim_path1).unwrap();\n        fs::create_dir_all(\u0026dim_path2).unwrap();\n        fs::create_dir_all(\u0026dim_path3).unwrap();\n\n        let data_source = JsonDataSource::new(org, dim_type1, dir.path().to_str().unwrap());\n        let result = data_source.get_all_types_safe().unwrap();\n\n        assert_eq!(result.len(), 3);\n        assert!(result.contains(\u0026dim_type1.to_string()));\n        assert!(result.contains(\u0026dim_type2.to_string()));\n        assert!(result.contains(\u0026dim_type3.to_string()));\n    }\n\n    // Additional edge case tests\n    #[test]\n    fn test_complex_file_naming_patterns() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name = \"prod-east1\";\n\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n\n        // Create various file types for one dimension\n        // Note: name.json and name:meta.json both map to \"meta\" type, so only use one\n        // Note: .schema.json is NOT included for specific dimensions (global schema)\n        create_test_file(\u0026dim_path, \u0026format!(\"{}.json\", name), r#\"{\"env\": \"prod\", \"region\": \"us-east-1\"}\"#);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:manifest.json\", name), r#\"{\"version\": \"1.0\"}\"#);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:terraform.json\", name), r#\"{\"backend\": \"s3\"}\"#);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:config.json\", name), r#\"{\"debug\": true}\"#);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_data_by_name_safe(name).unwrap();\n\n        // Should have all types plus name\n        assert_eq!(result[\"name\"], name);\n        // meta type comes from name.json\n        assert_eq!(result[\"meta\"][\"env\"], \"prod\");\n        assert_eq!(result[\"meta\"][\"region\"], \"us-east-1\");\n        // other types come from name:type.json files\n        assert_eq!(result[\"manifest\"][\"version\"], \"1.0\");\n        assert_eq!(result[\"terraform\"][\"backend\"], \"s3\");\n        assert_eq!(result[\"config\"][\"debug\"], true);\n    }\n\n    #[test]\n    fn test_defaults_file_handling() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let underscore_name = \"_defaults\";\n\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n\n        // Create defaults files - note the underscore-to-dot conversion logic\n        // When searching for \"_defaults\", the system converts it to \".defaults:\" \n        // So we need to create \".defaults:config.json\" file for it to be found\n        create_test_file(\u0026dim_path, \".defaults:config.json\", r#\"{\"default\": true}\"#);\n        create_test_file(\u0026dim_path, \"regular-dim:meta.json\", r#\"{\"regular\": true}\"#);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        \n        // Test the underscore-to-dot conversion behavior\n        let defaults_result = data_source.get_data_by_name_safe(underscore_name).unwrap();\n        \n        // Should now find the config data\n        assert_eq!(defaults_result[\"name\"], underscore_name);\n        assert_eq!(defaults_result[\"config\"][\"default\"], true);\n        \n        // get_all_names should not include defaults in regular listing\n        let names = data_source.get_all_names_safe().unwrap();\n        assert!(names.contains(\u0026\"regular-dim\".to_string()));\n        // _defaults should not be in regular listing due to the filtering logic\n        assert!(!names.contains(\u0026underscore_name.to_string()));\n    }\n\n    #[test]\n    fn test_underscore_to_dot_conversion() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name = \"_special_dim\";\n\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n\n        // Create file with dot prefix (the system converts _ to . when searching)\n        // So when we search for \"_special_dim\", it looks for \".special_dim:config.json\"\n        create_test_file(\u0026dim_path, \".special_dim:config.json\", r#\"{\"special\": true}\"#);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_data_by_name_safe(name).unwrap();\n\n        assert_eq!(result[\"name\"], name);\n        assert_eq!(result[\"config\"][\"special\"], true);\n    }\n\n    #[test]\n    fn test_file_name_separator_customization() {\n        use super::DataSourceConfig;\n        \n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name = \"test-dim\";\n\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n\n        // Create files with custom separator\n        create_test_file(\u0026dim_path, \u0026format!(\"{}___meta.json\", name), r#\"{\"custom\": true}\"#);\n        create_test_file(\u0026dim_path, \u0026format!(\"{}___config.json\", name), r#\"{\"separator\": \"___\"}\"#);\n\n        // Use custom separator configuration\n        let config = DataSourceConfig::new(\n            dir.path().to_str().unwrap().to_string(),\n            \"___\".to_string(),\n            None,\n        );\n        let data_source = JsonDataSource::new_with_config(org, dim_type, \u0026config);\n        let result = data_source.get_data_by_name_safe(name).unwrap();\n\n        assert_eq!(result[\"name\"], name);\n        assert_eq!(result[\"meta\"][\"custom\"], true);\n        assert_eq!(result[\"config\"][\"separator\"], \"___\");\n    }\n\n    #[test]\n    fn test_empty_directory_handling() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n        // Leave directory empty\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        \n        let names = data_source.get_all_names_safe().unwrap();\n        assert!(names.is_empty());\n        \n        let all_data = data_source.get_all_data_safe().unwrap();\n        assert!(all_data.is_empty());\n        \n        let nonexistent_data = data_source.get_data_by_name_safe(\"nonexistent\").unwrap();\n        assert_eq!(nonexistent_data[\"name\"], \"nonexistent\");\n        // Should only have the name field\n        assert_eq!(nonexistent_data.as_object().unwrap().len(), 1);\n    }\n\n    #[test]\n    fn test_special_characters_in_names() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let special_name = \"test-dim_v2.0\";\n\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n\n        create_test_file(\u0026dim_path, \u0026format!(\"{}:meta.json\", special_name), r#\"{\"special\": \"chars\"}\"#);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_data_by_name_safe(special_name).unwrap();\n\n        assert_eq!(result[\"name\"], special_name);\n        assert_eq!(result[\"meta\"][\"special\"], \"chars\");\n    }\n\n    #[test]\n    fn test_schema_file_logic() {\n        let dir = tempdir().unwrap();\n        let org = \"cubtera\";\n        let dim_type = \"dc\";\n        let name = \"test-dim\";\n\n        let dim_path = dir.path().join(org).join(dim_type);\n        fs::create_dir_all(\u0026dim_path).unwrap();\n\n        // Create dimension file and schema file\n        create_test_file(\u0026dim_path, \u0026format!(\"{}.json\", name), r#\"{\"data\": \"test\"}\"#);\n        create_test_file(\u0026dim_path, \".schema.json\", r#\"{\"$schema\": \"https://json-schema.org\"}\"#);\n\n        let data_source = JsonDataSource::new(org, dim_type, dir.path().to_str().unwrap());\n        let result = data_source.get_data_by_name_safe(name).unwrap();\n\n        println!(\"Result: {:#}\", result);\n        \n        // Test what we actually get\n        assert_eq!(result[\"name\"], name);\n        assert_eq!(result[\"meta\"][\"data\"], \"test\");\n        \n        // Check if schema is included (current implementation might not include it for specific dimensions)\n        if result.get(\"schema\").is_some() {\n            assert_eq!(result[\"schema\"][\"$schema\"], \"https://json-schema.org\");\n        } else {\n            println!(\"Schema not included for specific dimension - this is the current behavior\");\n        }\n    }\n}\n","traces":[{"line":19,"address":[],"length":0,"stats":{"Line":15}},{"line":20,"address":[],"length":0,"stats":{"Line":60}},{"line":21,"address":[],"length":0,"stats":{"Line":60}},{"line":25,"address":[],"length":0,"stats":{"Line":165}},{"line":26,"address":[],"length":0,"stats":{"Line":660}},{"line":29,"address":[],"length":0,"stats":{"Line":495}},{"line":30,"address":[],"length":0,"stats":{"Line":330}},{"line":36,"address":[],"length":0,"stats":{"Line":319}},{"line":37,"address":[],"length":0,"stats":{"Line":638}},{"line":38,"address":[],"length":0,"stats":{"Line":319}},{"line":39,"address":[],"length":0,"stats":{"Line":26}},{"line":45,"address":[],"length":0,"stats":{"Line":298}},{"line":46,"address":[],"length":0,"stats":{"Line":894}},{"line":47,"address":[],"length":0,"stats":{"Line":596}},{"line":48,"address":[],"length":0,"stats":{"Line":298}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":3148}},{"line":54,"address":[],"length":0,"stats":{"Line":3148}},{"line":58,"address":[],"length":0,"stats":{"Line":298}},{"line":59,"address":[],"length":0,"stats":{"Line":298}},{"line":60,"address":[],"length":0,"stats {\n                DataSourceError::PathNotFound { path } =\u003e write!(f, \"Path not found: {}\", path),\n                DataSourceError::FileNotFound { filename } =\u003e write!(f, \"File not found: {}\", filename),\n                DataSourceError::ParseError { message } =\u003e write!(f, \"Parse error: {}\", message),\n                DataSourceError::DatabaseError { message } =\u003e write!(f, \"Database error: {}\", message),\n                DataSourceError::ConfigurationError { message } =\u003e write!(f, \"Configuration error: {}\", message),\n                DataSourceError::IOError { message } =\u003e write!(f, \"IO error: {}\", message),\n                DataSourceError::ValidationError { message } =\u003e write!(f, \"Validation error: {}\", message),\n            }\n        }\n    }\n\n    impl std::error::Error for DataSourceError {}\n\n    /// Convenience Result type for data source operations\n    pub type DataResult\u003cT\u003e = Result\u003cT, DataSourceError\u003e;\n}\n\n// Re-export for convenience\npub use error::{DataSourceError, DataResult};\n\nuse crate::globals::GLOBAL_CFG;\nuse serde_json::Value;\n\n/// Configuration abstraction for data sources\n/// This provides a unified way to access configuration, defaulting to GLOBAL_CFG\n/// but allowing explicit overrides when needed\n#[derive(Debug, Clone)]\npub struct DataSourceConfig {\n    pub inventory_path: String,\n    pub file_name_separator: String,\n    pub db_client: Option\u003c::mongodb::sync::Client\u003e,\n}\n\nimpl DataSourceConfig {\n    /// Create configuration from GLOBAL_CFG (default behavior)\n    pub fn from_global() -\u003e Self {\n        Self {\n            inventory_path: GLOBAL_CFG.inventory_path.clone(),\n            file_name_separator: GLOBAL_CFG.file_name_separator.clone(),\n            db_client: GLOBAL_CFG.db_client.clone(),\n        }\n    }\n    \n    /// Create custom configuration (for testing or special cases)\n    pub fn new(\n        inventory_path: String,\n        file_name_separator: String,\n        db_client: Option\u003c::mongodb::sync::Client\u003e,\n    ) -\u003e Self {\n        Self {\n            inventory_path,\n            file_name_separator,\n            db_client,\n        }\n    }\n    \n    /// Override inventory path while keeping other values from GLOBAL_CFG\n    pub fn with_inventory_path(inventory_path: String) -\u003e Self {\n        let mut config = Self::from_global();\n        config.inventory_path = inventory_path;\n        config\n    }\n    \n    /// Override file name separator while keeping other values from GLOBAL_CFG\n    pub fn with_file_name_separator(separator: String) -\u003e Self {\n        let mut config = Self::from_global();\n        config.file_name_separator = separator;\n        config\n    }\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub enum Storage {\n    FS,\n    DB,\n}\n\nimpl Default for Storage {\n    fn default() -\u003e Self {\n        Storage::FS\n    }\n}\n\nimpl Storage {\n    pub fn from_str(s: \u0026str) -\u003e Self {\n        match s {\n            \"fs\" =\u003e Storage::FS,\n            \"db\" =\u003e Storage::DB,\n            _ =\u003e unreachable!(\"Unknown storage type\"),\n        }\n    }\n\n    pub fn to_str(\u0026self) -\u003e \u0026str {\n        match self {\n            Storage::FS =\u003e \"fs\",\n            Storage::DB =\u003e \"db\",\n        }\n    }\n\n    // TODO: make configurable\n    pub fn get_defaults_prefix(\u0026self) -\u003e \u0026str {\n        match self {\n            Storage::FS =\u003e \".defaults:\",\n            Storage::DB =\u003e \"_defaults:\",\n        }\n    }\n}\n\npub trait CloneBox {\n    fn clone_box(\u0026self) -\u003e Box\u003cdyn DataSource\u003e;\n}\n\nimpl\u003cT: DataSource + Clone\u003e CloneBox for T {\n    fn clone_box(\u0026self) -\u003e Box\u003cdyn DataSource\u003e {\n        Box::new(self.clone())\n    }\n}\n\npub trait DataSource: CloneBox + 'static {\n    // Legacy methods - kept for backward compatibility\n    fn get_data_by_name(\u0026self, name: \u0026str) -\u003e Result\u003cValue, Box\u003cdyn std::error::Error\u003e\u003e;\n    fn get_all_data(\u0026self) -\u003e Result\u003cVec\u003cValue\u003e, Box\u003cdyn std::error::Error\u003e\u003e;\n    fn get_all_names(\u0026self) -\u003e Result\u003cVec\u003cString\u003e, Box\u003cdyn std::error::Error\u003e\u003e;\n    fn get_all_types(\u0026self) -\u003e Result\u003cVec\u003cString\u003e, Box\u003cdyn std::error::Error\u003e\u003e;\n\n    // only for DB (json files are source of truth)\n    fn upsert_all_data(\u0026self, _data: Vec\u003cValue\u003e) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        log::debug!(\"this data source doesn't support upsert_all_data\");\n        Ok(())\n    }\n\n    fn upsert_data_by_name(\n        \u0026self,\n        name: \u0026str,\n        data: Value,\n    ) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        log::debug!(\n            \"this data source doesn't support upsert_data_by_name: {}: {}\",\n            name,\n            serde_json::json!(data)\n        );\n        Ok(())\n    }\n\n    fn delete_data_by_name(\u0026self, name: \u0026str) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        log::debug!(\n            \"this data source doesn't support delete_data_by_name: {}\",\n            name\n        );\n        Ok(())\n    }\n\n    fn delete_all_by_context(\u0026self, context: \u0026str) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        log::debug!(\n            \"this data source doesn't support delete_all_by_context: {}\",\n            context\n        );\n        Ok(())\n    }\n\n    fn set_context(\u0026mut self, context: Option\u003cString\u003e);\n    fn get_context(\u0026self) -\u003e Option\u003cString\u003e;\n\n    // New \"safe\" methods with proper error types - default implementations call legacy methods\n    fn get_data_by_name_safe(\u0026self, name: \u0026str) -\u003e DataResult\u003cValue\u003e {\n        self.get_data_by_name(name)\n            .map_err(|e| DataSourceError::ParseError { message: e.to_string() })\n    }\n\n    fn get_all_data_safe(\u0026self) -\u003e DataResult\u003cVec\u003cValue\u003e\u003e {\n        self.get_all_data()\n            .map_err(|e| DataSourceError::ParseError { message: e.to_string() })\n    }\n\n    fn get_all_names_safe(\u0026self) -\u003e DataResult\u003cVec\u003cString\u003e\u003e {\n        self.get_all_names()\n            .map_err(|e| DataSourceError::ParseError { message: e.to_string() })\n    }\n\n    fn get_all_types_safe(\u0026self) -\u003e DataResult\u003cVec\u003cString\u003e\u003e {\n        self.get_all_types()\n            .map_err(|e| DataSourceError::ParseError { message: e.to_string() })\n    }\n\n    fn upsert_all_data_safe(\u0026self, data: Vec\u003cValue\u003e) -\u003e DataResult\u003c()\u003e {\n        self.upsert_all_data(data)\n            .map_err(|e| DataSourceError::DatabaseError { message: e.to_string() })\n    }\n\n    fn upsert_data_by_name_safe(\u0026self, name: \u0026str, data: Value) -\u003e DataResult\u003c()\u003e {\n        self.upsert_data_by_name(name, data)\n            .map_err(|e| DataSourceError::DatabaseError { message: e.to_string() })\n    }\n\n    fn delete_data_by_name_safe(\u0026self, name: \u0026str) -\u003e DataResult\u003c()\u003e {\n        self.delete_data_by_name(name)\n            .map_err(|e| DataSourceError::DatabaseError { message: e.to_string() })\n    }\n\n    fn delete_all_by_context_safe(\u0026self, context: \u0026str) -\u003e DataResult\u003c()\u003e {\n        self.delete_all_by_context(context)\n            .map_err(|e| DataSourceError::DatabaseError { message: e.to_string() })\n    }\n}\n\n/// Create a DataSource using GLOBAL_CFG (legacy function, maintained for compatibility)\npub fn data_src_init(org: \u0026str, dim_type: \u0026str, storage: Storage) -\u003e Box\u003cdyn DataSource\u003e {\n    data_src_init_with_config(org, dim_type, storage, \u0026DataSourceConfig::from_global())\n}\n\n/// Create a DataSource with explicit configuration\npub fn data_src_init_with_config(\n    org: \u0026str, \n    dim_type: \u0026str, \n    storage: Storage, \n    config: \u0026DataSourceConfig\n) -\u003e Box\u003cdyn DataSource\u003e {\n    match storage {\n        Storage::DB =\u003e Box::new(mongodb::MongoDBDataSource::new_with_config(org, dim_type, config)),\n        Storage::FS =\u003e Box::new(jsonfile::JsonDataSource::new_with_config(org, dim_type, config)),\n    }\n}\n\n// pub enum DataSrc {\n//     MongoDB(mongodb::MongoDBDataSource),\n//     Json(jsonfile::JsonDataSource),\n//     // Add other data source types here...\n// }\n\n// impl Clone for DataSrc {\n//     fn clone(\u0026self) -\u003e Self {\n//         match self {\n//             DataSrc::MongoDB(ds) =\u003e DataSrc::MongoDB(ds.clone()),\n//             DataSrc::Json(ds) =\u003e DataSrc::Json(ds.clone()),\n//             // Handle other data source types here...\n//         }\n//     }\n// }\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tempfile::tempdir;\n    use std::fs;\n\n    #[test]\n    fn test_data_source_config_from_global() {\n        // Test that we can create config from GLOBAL_CFG\n        let config = DataSourceConfig::from_global();\n        \n        // Should match GLOBAL_CFG values\n        assert_eq!(config.inventory_path, GLOBAL_CFG.inventory_path);\n        assert_eq!(config.file_name_separator, GLOBAL_CFG.file_name_separator);\n    }\n\n    #[test]\n    fn test_data_source_config_overrides() {\n        let custom_path = \"/custom/path\".to_string();\n        let custom_separator = \"___\".to_string();\n        \n        // Test inventory path override\n        let config1 = DataSourceConfig::with_inventory_path(custom_path.clone());\n        assert_eq!(config1.inventory_path, custom_path);\n        assert_eq!(config1.file_name_separator, GLOBAL_CFG.file_name_separator); // Should keep global value\n        \n        // Test separator override\n        let config2 = DataSourceConfig::with_file_name_separator(custom_separator.clone());\n        assert_eq!(config2.file_name_separator, custom_separator);\n        assert_eq!(config2.inventory_path, GLOBAL_CFG.inventory_path); // Should keep global value\n    }\n\n    #[test]\n    fn test_data_src_init_backward_compatibility() {\n        // Test that legacy function still works\n        let datasource = data_src_init(\"test_org\", \"test_type\", Storage::FS);\n        \n        // Should be able to use it normally\n        assert!(datasource.get_context().is_none());\n    }\n\n    #[test]\n    fn test_data_src_init_with_custom_config() {\n        let dir = tempdir().unwrap();\n        let custom_config = DataSourceConfig::with_inventory_path(\n            dir.path().to_str().unwrap().to_string()\n        );\n        \n        // Create test directory structure\n        let test_path = dir.path().join(\"test_org\").join(\"test_type\");\n        fs::create_dir_all(\u0026test_path).unwrap();\n        \n        // Test new function with custom config\n        let datasource = data_src_init_with_config(\n            \"test_org\", \n            \"test_type\", \n            Storage::FS, \n            \u0026custom_config\n        );\n        \n        // Should work with custom config\n        assert!(datasource.get_context().is_none());\n        \n        // Test that safe methods work\n        let names = datasource.get_all_names_safe().unwrap();\n        assert!(names.is_empty()); // Empty directory should return empty list\n    }\n}\n","traces":[{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,  {\n                    client: client.clone(),\n                    col,\n                    db,\n                    db_name,\n                    col_name,\n                    config: config.clone(),\n                    context: None,\n                }\n            }\n            None =\u003e exit_with_error(\"No DB config found\".to_string()),\n        }\n    }\n}\n\nimpl DataSource for MongoDBDataSource {\n    fn get_data_by_name(\u0026self, name: \u0026str) -\u003e Result\u003cValue, Box\u003cdyn std::error::Error\u003e\u003e {\n        if let Some(ctx) = \u0026self.context {\n            if !ctx.is_empty() {\n                let filter = doc! { \"name\": name, \"context\": ctx };\n                let bson = self.col.find_one(filter)\n                    .run()?;\n                if bson.is_some() {\n                    let bson = bson.unwrap();\n                    let mut res = mongodb::bson::from_bson::\u003cValue\u003e(bson)?;\n                    res.as_object_mut().unwrap().remove(\"_id\");\n                    //TODO: remove comment after testing\n                    //res.as_object_mut().unwrap().remove(\"context\");\n                    return Ok(res);\n                }\n            }\n        }\n\n        let filter = doc! { \"name\": name, \"context\": { \"$exists\": false }};\n        let bson = self.col.find_one(filter).run()?;\n\n        let res = match bson {\n            Some(bson) =\u003e bson,\n            None =\u003e return Ok(json!({})),\n        };\n\n        let mut res = mongodb::bson::from_bson::\u003cValue\u003e(res)?;\n        res.as_object_mut().unwrap().remove(\"_id\");\n        Ok(res)\n    }\n\n    fn get_all_data(\u0026self) -\u003e Result\u003cVec\u003cValue\u003e, Box\u003cdyn std::error::Error\u003e\u003e {\n        let filter = doc! {\n            \"context\": { \"$exists\": false },\n            \"name\": { \"$not\": { \"$regex\": \"^_default\", \"$options\": \"i\" }}\n        };\n        let bson = self.col.find(filter).run()?;\n        let res = bson\n            .map(|doc| doc.unwrap())\n            .map(|doc| mongodb::bson::from_bson::\u003cValue\u003e(doc).unwrap_or_default())\n            .collect::\u003cVec\u003cValue\u003e\u003e();\n        Ok(res)\n    }\n\n    fn get_all_names(\u0026self) -\u003e Result\u003cVec\u003cString\u003e, Box\u003cdyn std::error::Error\u003e\u003e {\n        let data = self\n            .get_all_data()?\n            .iter()\n            //.filter(|doc| doc[\"context\"].is_null())\n            .map(|doc| doc[\"name\"].as_str().unwrap_or_default().to_string())\n            .filter(|name| !name.eq(\"\"))\n            //.filter(|name| !name.starts_with(\"_default:\"))\n            .collect::\u003cVec\u003cString\u003e\u003e();\n\n        Ok(data)\n    }\n\n    fn get_all_types(\u0026self) -\u003e Result\u003cVec\u003cString\u003e, Box\u003cdyn std::error::Error\u003e\u003e {\n        Ok(self.db.list_collection_names().run()?)\n    }\n\n    fn upsert_all_data(\u0026self, data: Vec\u003cValue\u003e) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        // let mut session = self.client.start_session()?;\n        let mut data = data;\n        data.iter_mut().for_each(|doc| {\n            if let Some(name) = doc.get(\"name\").and_then(|name| name.as_str()) {\n                let mut query = doc! { \"name\": name, \"context\": { \"$exists\": false } };\n                if let Some(ctx) = \u0026self.context {\n                    if !ctx.is_empty() {\n                        query = doc! { \"name\": name, \"context\": ctx };\n                        doc[\"context\"] = json!(ctx);\n                    }\n                }\n                let replacement = mongodb::bson::to_bson(\u0026doc).unwrap_or_default();\n                rocket::tokio::task::block_in_place(|| {\n                    let res = self.col.replace_one(\n                        query,\n                        replacement,\n                    )\n                        .upsert(true)\n                        .run();\n                    if res.is_err() {\n                        debug!(\"Upsert failed: {:?}\", res.err());\n                    }\n                });\n            }\n        });\n\n        Ok(())\n    }\n\n    fn upsert_data_by_name(\n        \u0026self,\n        name: \u0026str,\n        data: Value,\n    ) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        let mut data = data;\n        data[\"name\"] = json!(name);\n\n        let mut query = doc! { \"name\": name, \"context\": { \"$exists\": false } };\n        if let Some(ctx) = \u0026self.context {\n            if !ctx.is_empty() {\n                query = doc! { \"name\": name, \"context\": ctx };\n                data[\"context\"] = json!(ctx);\n            }\n        }\n        let replacement = mongodb::bson::to_bson(\u0026data)?;\n        let _ = self.col.replace_one(query, replacement)\n            .upsert(true)\n            .run()?;\n        Ok(())\n    }\n\n    fn delete_data_by_name(\u0026self, name: \u0026str) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        let mut filter = doc! { \"name\": name, \"context\": { \"$exists\": false } };\n        if let Some(ctx) = \u0026self.context {\n            if !ctx.is_empty() {\n                filter = doc! { \"name\": name, \"context\": ctx };\n            }\n        }\n        let _ = self.col.delete_one(filter).run()?;\n        Ok(())\n    }\n\n    fn delete_all_by_context(\u0026self, context: \u0026str) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        let db_names = \u0026self.config\n            .db_client\n            .as_ref()\n            .unwrap()\n            .list_database_names().run()?;\n        db_names.iter()\n            .for_each(|name| {\n                let db = self.config.db_client.as_ref().unwrap().database(name);\n                db.list_collection_names().run().unwrap()\n                    .iter()\n                    .for_each(|col| {\n                        let col = db.collection::\u003cBson\u003e(col);\n                        let filter = doc! { \"context\": context };\n                        let res = col.delete_many(filter).run();\n                        //count deleted\n                        if let Ok(res) = res {\n                            if res.deleted_count \u003e 0 {\n                                info!(target: \"\", \"Deleted {} docs from {} with context {context}.\", res.deleted_count, col.name());\n                            }\n                        }\n                    });\n            });\n        Ok(())\n    }\n\n    fn set_context(\u0026mut self, context: Option\u003cString\u003e) {\n        self.context = context;\n    }\n\n    fn get_context(\u0026self) -\u003e Option\u003cString\u003e {\n        self.context.clone()\n    }\n}\n","traces":[{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":27,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72 .rs"],"content":"use serde_json::{json, Value};\nuse std::path::PathBuf;\n\n/// Core dimension structure representing a single dimension with its data and relationships\n#[derive(Debug, Clone, Default)]\npub struct Dim {\n    pub dim_name: String,\n    pub dim_type: String,\n    pub key_path: PathBuf,\n    pub(crate) dim_path: PathBuf,\n    pub parent: Option\u003cBox\u003cDim\u003e\u003e,\n    pub(crate) data: Value,\n    pub data_sha: String,\n    pub kids: Option\u003cVec\u003cString\u003e\u003e,\n}\n\nimpl Dim {\n    /// Get immutable reference to dimension data\n    pub fn get_data(\u0026self) -\u003e \u0026Value {\n        \u0026self.data\n    }\n\n    /// Get mutable reference to dimension data\n    pub fn get_data_mut(\u0026mut self) -\u003e \u0026mut Value {\n        \u0026mut self.data\n    }\n\n    /// Generate json with dim data (clone of internal data)\n    pub fn get_dim_data(\u0026self) -\u003e Value {\n        self.data.clone()\n    }\n\n    /// Generate list of dimensions with all parents (recursively)\n    /// Returns a vector starting with current dimension, followed by parents\n    pub fn get_dim_tree(\u0026self) -\u003e Vec\u003cString\u003e {\n        let mut dim_tree = vec![self.dim_name.clone()];\n        if let Some(parent) = \u0026self.parent {\n            dim_tree.extend(parent.get_dim_tree());\n        }\n        dim_tree\n    }\n\n    /// Save dimension variables values to json file\n    /// Returns the filename of the created JSON file\n    pub fn save_json_dim_vars(\u0026self, path: PathBuf) -\u003e Result\u003cString, std::io::Error\u003e {\n        let json_content = self.get_json_dim_vars();\n        let json_vars_file_name = format!(\"cubtera_dim_{}.json\", \u0026self.dim_type);\n        let json_vars_file_path = path.join(\u0026json_vars_file_name);\n        std::fs::write(\n            json_vars_file_path,\n            serde_json::to_string_pretty(\u0026json_content).unwrap(),\n        )?;\n        Ok(json_vars_file_name)\n    } r) -\u003e DimResult\u003cT\u003e;\n    \n    /// Convert any error to a data source error\n    fn data_source_error(self, message: \u0026str) -\u003e DimResult\u003cT\u003e;\n    \n    /// Convert any error to a file operation error\n    fn file_operation_error(self, path: \u0026str) -\u003e DimResult\u003cT\u003e;\n    \n    /// Convert any error to a validation error\n    fn validation_error(self, field: \u0026str) -\u003e DimResult\u003cT\u003e;\n    \n    /// Convert any error to a hierarchy error\n    fn hierarchy_error(self, message: \u0026str) -\u003e DimResult\u003cT\u003e;\n}\n\nimpl\u003cT, E: std::fmt::Display\u003e DimResultExt\u003cT\u003e for std::result::Result\u003cT, E\u003e {\n    fn dim_not_found(self, name: \u0026str) -\u003e DimResult\u003cT\u003e {\n        self.map_err(|e| DimError::not_found(format!(\"{}: {}\", name, e)))\n    }\n    \n    fn data_source_error(self, message: \u0026str) -\u003e DimResult\u003cT\u003e {\n        self.map_err(|e| DimError::data_source(format!(\"{}: {}\", message, e)))\n    }\n    \n    fn file_operation_error(self, path: \u0026str) -\u003e DimResult\u003cT\u003e {\n        self.map_err(|e| DimError::file_operation(path, e.to_string()))\n    }\n    \n    fn validation_error(self, field: \u0026str) -\u003e DimResult\u003cT\u003e {\n        self.map_err(|e| DimError::validation(field, e.to_string()))\n    }\n    \n    fn hierarchy_error(self, message: \u0026str) -\u003e DimResult\u003cT\u003e {\n        self.map_err(|e| DimError::hierarchy(format!(\"{}: {}\", message, e)))\n    }\n} ","traces":[{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats" irectory based on prefix and filter function\n    fn get_filtered_entries\u003cF\u003e(\n        \u0026self,\n        prefix: \u0026str,\n        entry_filter: F,\n    ) -\u003e std::io::Result\u003cVec\u003cPathBuf\u003e\u003e\n    where\n        F: Fn(\u0026Path) -\u003e bool,\n    {\n        Ok(std::fs::read_dir(\u0026self.dim_path)?\n            .filter_map(|entry| entry.ok())\n            .map(|entry| entry.path())\n            .filter(move |entry| entry_filter(entry))\n            .filter_map(move |entry| {\n                entry\n                    .clone()\n                    .file_name()\n                    .and_then(std::ffi::OsStr::to_str)\n                    .filter(|name| name.starts_with(prefix))\n                    .map(|_| entry)\n            })\n            .collect())\n    }\n\n    /// Process dimension entries (files or folders) and copy them to target path\n    fn process_dim_entries\u003cF\u003e(\u0026self, path: PathBuf, entry_filter: F) -\u003e Result\u003c(), std::io::Error\u003e\n    where\n        F: Fn(\u0026Path) -\u003e bool,\n    {\n        let default_prefix = format!(\".default{}\", \u0026GLOBAL_CFG.file_name_separator);\n        let dim_prefix = format!(\"{}{}\", \u0026self.dim_name, \u0026GLOBAL_CFG.file_name_separator);\n\n        let default_entries = self.get_filtered_entries(\u0026default_prefix, \u0026entry_filter)?;\n        let dim_entries = self.get_filtered_entries(\u0026dim_prefix, \u0026entry_filter)?;\n\n        default_entries\n            .into_iter()\n            .chain(dim_entries)\n            .try_for_each(|entry| {\n                let entry_name = entry\n                    .file_name()\n                    .and_then(|f| f.to_str())\n                    .and_then(|s| s.split(\u0026GLOBAL_CFG.file_name_separator).last())\n                    .filter(|s| !s.is_empty());\n\n                match entry_name {\n                    Some(name) =\u003e self.copy_entry(\u0026entry, \u0026path.join(name), entry.is_dir()),\n                    None =\u003e Ok(()),\n                }\n            })\n    }\n\n    /// Copy a single entry (file or directory) from source to destination\n    fn copy_entry(\u0026self, src: \u0026Path, dest: \u0026Path, is_dir: bool) -\u003e std::io::Result\u003c()\u003e {\n        if is_dir {\n            copy_folder(src.to_path_buf(), \u0026dest.to_path_buf(), true);\n            Ok(())\n        } else {\n            std::fs::copy(src, dest).map(|_| ())\n        }\n    }\n} ","traces":[{"line":7,"address":[],"length":0,"stats":{"Line":66}},{"line":8,"address":[],"length":0,"stats":{"Line":66}},{"line":9,"address":[],"length":0,"stats":{"Line":0}},{"line":11,"address":[],"length":0,"stats":{"Line":264}},{"line":15,"address":[],"length":0,"stats":{"Line":61}},{"line":16,"address":[],"length":0,"stats":{"Line":61}},{"line":18,"address":[],"length":0,"stats":{"Line":244}},{"line":22,"address":[],"length":0,"stats":{"Line":127}},{"line":30,"address":[],"length":0,"stats":{"Line":381}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":33,"address":[],"length":0,"stats":{"Line":0}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":35,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":127}},{"line":50,"address":[],"length":0,"stats":{"Line":508}},{"line":51,"address":[],"length":0,"stats":{"Line":635}},{"line":53,"address":[],"length":0,"stats":{"Line":635}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Li          .and_then(|var| std::env::var(var).ok())\n            .unwrap_or(\"undefined\".into());\n\n        let inventory_commit_sha = get_commit_sha_by_path(\n            \u0026Path::new(\u0026GLOBAL_CFG.inventory_path).to_path_buf()\n        ).unwrap_or(\"undefined\".into());\n        let unit_commit_sha = unit.get_unit_commit_sha();\n        let unit_blob_sha = unit.get_unit_blob_sha();\n        let dims_blob_sha = unit.get_dims_blob_sha();\n        let env_vars =  unit.get_env_vars();\n\n        Self {\n            unit_name: Some(unit.get_name()),\n            state_path: Some(state_path),\n            dims: Some(dims),\n            job_host_name: whoami::fallible::hostname().ok(),\n            job_user_name: Some(job_user_name),\n            job_number: Some(job_build_number),\n            job_name: Some(job_name),\n            tf_command: Some(tf_command),\n            exitcode: Some(exitcode),\n            unit_sha: Some(unit_commit_sha),\n            unit_blob_sha: Some(unit_blob_sha),\n            inventory_sha: Some(inventory_commit_sha),\n            dims_blob_sha: Some(dims_blob_sha),\n            timestamp: Some(timestamp),\n            datetime: Some(hr_time.to_string()),\n            extended_log: get_extended_log(),\n            env_vars,\n        }\n    }\n\n    /// Inserts a log entry into the MongoDB collection for the specified organization.\n    ///\n    /// # Arguments\n    ///\n    /// * `org` - The name of the organization to insert the log entry for.\n    ///\n    /// # Returns\n    ///\n    /// Returns `Ok(())` if the log entry was successfully inserted, otherwise returns an `anyhow::Error`.\n    pub fn put(\u0026self, org: \u0026str) -\u003e anyhow::Result\u003c()\u003e {\n        let client: Option\u003cmongodb::sync::Client\u003e =\n            GLOBAL_CFG.dlog_db.as_ref().map(|db| db_connect(db));\n        if let Some(cl) = client {\n            let db = cl.database(org);\n            let col = db.collection::\u003cmongodb::bson::Bson\u003e(\"dlog\");\n            //let col = MongoCollection::new(org, \"dlog\", \u0026cl);\n            let data = serde_json::json!(self);\n            let doc = mongodb::bson::to_bson(\u0026data)?;\n            col.insert_one(doc).run()?;\n            return Ok(());\n        }\n        anyhow::bail!(\"Can't connect to dLog DB\");\n    }\n}\n\n/// Reads extended log data from standard input and returns it as a JSON value.\n///\n/// # Returns\n///\n/// An `Option` containing the JSON value if the standard input is not a terminal, otherwise `None`.\nfn get_extended_log() -\u003e Option\u003cHashMap\u003cString, String\u003e\u003e {\n    use std::io::Read;\n    if unsafe { libc::isatty(libc::STDIN_FILENO) == 0 } {\n        let mut buffer = String::new();\n        std::io::stdin()\n            .read_to_string(\u0026mut buffer)\n            .unwrap_or_default();\n        let buffer = buffer.trim().replace('\\n', \" \");\n        let log_data: Value = serde_json::from_str(\u0026buffer)\n            .check_with_warn(\"Skip extended log data. Broken JSON\")\n            .unwrap_or_default();\n        let extended_log: Option\u003cHashMap\u003cString, String\u003e\u003e = serde_json::from_value(log_data).ok();\n        return extended_log;\n    }\n    None\n}\n","traces":[{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":60,"address":[],"length":0,"stats":{"Line":0}},{"line":61,"address":[],"length":0,"stats":{"Line":0}},{"line":62,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"l  \"type\": dim_type,\n        \"data\": dims,\n    })\n}\n\npub fn get_dims_data_by_type(dim_type: \u0026str, org: \u0026str, storage: \u0026Storage) -\u003e Value {\n    let names = DimBuilder::new(dim_type, org, storage).get_all_dim_names();\n\n    let data = names\n        .iter()\n        .map(|name| {\n            let dim = DimBuilder::new(dim_type, org, storage)\n                .with_name(name)\n                .read_data()\n                .merge_defaults()\n                .build();\n            dim.get_dim_data()\n        })\n        .collect::\u003cVec\u003cValue\u003e\u003e();\n\n    json!({\n        \"status\": \"ok\",\n        \"id\": \"dimsDataByType\",\n        \"type\": dim_type,\n        \"data\": data,\n    })\n}\n\npub fn get_dim_defaults_by_type(dim_type: \u0026str, org: \u0026str, storage: \u0026Storage) -\u003e Value {\n    let defaults = DimBuilder::new(dim_type, org, storage)\n        .read_default_data()\n        .get_default_data();\n\n    json!({\n        \"status\": \"ok\",\n        \"id\": \"dimsDefaultsByType\",\n        \"type\": dim_type,\n        \"data\": defaults,\n    })\n}\n\npub fn get_dim_kids(dim_type: \u0026str, dim_name: \u0026str, org: \u0026str, storage: \u0026Storage) -\u003e Value {\n    let kids = DimBuilder::new(dim_type, org, storage)\n        .with_name(dim_name)\n        .get_all_kids_by_name();\n\n    json!({\n        \"status\": \"ok\",\n        \"id\": \"dimsByParent\",\n        \"parent_type\": dim_type,\n        \"parent_name\": dim_name,\n        \"data\": {\n            \"dim_type\" : kids.keys().next().unwrap_or(\u0026\"\".to_string()),\n            \"dim_names\" : kids.values().next().unwrap_or(\u0026vec![]),\n        },\n    })\n}\n\npub fn get_dim_parent(dim_type: \u0026str, dim_name: \u0026str, org: \u0026str, storage: \u0026Storage) -\u003e Value {\n    let dim = DimBuilder::new(dim_type, org, storage)\n        .with_name(dim_name)\n        .read_data()\n        .build();\n\n    if let Some(parent) = dim.parent {\n        json!({\n            \"status\": \"ok\",\n            \"id\": \"dimParent\",\n            \"type\": parent.dim_type,\n            \"name\": parent.dim_name,\n            \"data\": parent.get_dim_data(),\n        })\n    } else {\n        json!({\n            \"status\": \"error\",\n            \"id\": \"dimParent\",\n            \"message\": \"No parent dim found\",\n            \"data\": Value::Null,\n        })\n    }\n}\n\npub fn get_all_orgs(storage: \u0026Storage) -\u003e Value {\n    let orgs = match storage {\n        Storage::DB =\u003e {\n            let db = GLOBAL_CFG\n                .db_client\n                .clone()\n                .unwrap_or_exit(\"Can't start DB client\".into());\n            db.list_database_names()\n                .run()\n                .unwrap_or_exit(\"Can't read list of orgs from DB\".into())\n        }\n        Storage::FS =\u003e GLOBAL_CFG.orgs.clone(),\n    }\n    .iter()\n    .map(String::as_ref)\n    .filter(|dim| ![\"admin\", \"local\", \"config\", \"test\"].contains(dim))\n    .map(|dim| dim.to_string())\n    .collect::\u003cVec\u003cString\u003e\u003e();\n\n    json!({\n        \"status\": \"ok\",\n        \"id\": \"orgs\",\n        \"data\": orgs,\n    })\n}\n\npub fn get_dlog_by_keys(org: \u0026str, keys: Vec\u003cString\u003e, limit: Option\u003ci64\u003e) -\u003e Value {\n    let keys: HashMap\u003cString, String\u003e = keys\n        .iter()\n        .map(|dim: \u0026String| {\n            let parts: Vec\u003c\u0026str\u003e = dim.split(':').collect();\n            (parts[0].to_string(), parts[1].to_string())\n        })\n        .collect();\n    let filter = json!(keys);\n\n    get_dlog(org, filter.clone(), limit)\n}\n\npub fn get_dlog(org: \u0026str, filter: Value, limit: Option\u003ci64\u003e) -\u003e Value {\n    let client: Option\u003cmongodb::sync::Client\u003e =\n        GLOBAL_CFG.dlog_db.as_ref().map(|db| db_connect(db));\n\n    if client.is_none() {\n        return json!({\n            \"status\": \"error\",\n            \"id\": \"dlog\",\n            \"message\": format!(\"Can't connect to dlog DB {}\", \u0026GLOBAL_CFG.dlog_db.clone().unwrap_or(\"\".to_string())),\n            \"notes\": \"Check CUBTERA_DLOG_DB env variable\",\n            \"data\": Value::Null,\n        });\n    }\n\n    let db = client.unwrap().database(org);\n    let col = db.collection::\u003cmongodb::bson::Bson\u003e(\"dlog\");\n    let filter = to_dot_notation(\u0026filter, \"\".to_string());\n    let filter = json!(filter);\n    let filter = mongodb::bson::to_document(\u0026filter).unwrap_or_default();\n    let res = col.find(filter.clone())\n        .sort(mongodb::bson::doc! { \"timestamp\": -1 })\n        .limit(limit.unwrap_or(10))\n        .run()\n        .unwrap();\n\n    let res: Vec\u003cValue\u003e = res\n        .collect::\u003cmongodb::error::Result\u003cVec\u003cmongodb::bson::Bson\u003e\u003e\u003e()\n        .unwrap_or_default()\n        .iter()\n        .map(|bson| mongodb::bson::from_bson::\u003cValue\u003e(bson.clone()).unwrap_or_default())\n        .collect();\n\n    json!({\n        \"status\": \"ok\",\n        \"id\": \"dlog\",\n        \"data\": res,\n        \"limit\": limit,\n        \"filter\": filter,\n    })\n}\n\nfn to_dot_notation(value: \u0026Value, prefix: String) -\u003e HashMap\u003cString, Value\u003e {\n    let mut result = HashMap::new();\n\n    if let Value::Object(map) = value {\n        for (key, value) in map {\n            let new_key = if prefix.is_empty() {\n                key.clone()\n            } else {\n                format!(\"{}.{}\", prefix, key)\n            };\n            match value {\n                Value::Object(_) =\u003e {\n                    result.extend(to_dot_notation(value, new_key));\n                }\n                _ =\u003e {\n                    result.insert(new_key, value.clone());\n                }\n            }\n        }\n    }\n\n    result\n}\n\npub fn get_all_dim_types(org: \u0026str ing,\n    pub command: String,\n    pub state_path: String,\n    pub dimensions: HashMap\u003cString, String\u003e,\n    pub timestamp: u64,\n    pub session_id: String,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct RunnerLogEntry {\n    pub context: LogContext,\n    pub level: String,\n    pub message: String,\n    pub details: Option\u003cValue\u003e,\n    pub exit_code: Option\u003ci32\u003e,\n    pub duration_ms: Option\u003cu64\u003e,\n    pub error: Option\u003cString\u003e,\n}\n\nimpl RunnerLogger {\n    pub fn new(runner_type: \u0026str, unit: \u0026Unit, command: \u0026[String]) -\u003e Self {\n        let config = LoggingConfig::from_global_config();\n        let context = LogContext::new(runner_type, unit, command);\n\n        Self { config, context }\n    }\n\n    /// Log runner start\n    pub fn log_start(\u0026self) {\n        let entry = RunnerLogEntry {\n            context: self.context.clone(),\n            level: \"INFO\".to_string(),\n            message: format!(\n                \"Starting {} runner for unit {}\",\n                self.context.runner_type, self.context.unit_name\n            ),\n            details: Some(json!({\n                \"command\": self.context.command,\n                \"dimensions\": self.context.dimensions\n            })),\n            exit_code: None,\n            duration_ms: None,\n            error: None,\n        };\n\n        self.write_log(\u0026entry);\n    }\n\n    /// Log runner completion\n    pub fn log_completion(\u0026self, exit_code: i32, duration_ms: u64, error: Option\u003cString\u003e) {\n        let level = if exit_code == 0 { \"INFO\" } else { \"ERROR\" };\n        let message = if exit_code == 0 {\n            format!(\"Successfully completed {} runner\", self.context.runner_type)\n        } else {\n            format!(\n                \"Failed {} runner with exit code {}\",\n                self.context.runner_type, exit_code\n            )\n        };\n\n        let entry = RunnerLogEntry {\n            context: self.context.clone(),\n            level: level.to_string(),\n            message,\n            details: Some(json!({\n                \"execution_time_ms\": duration_ms,\n                \"success\": exit_code == 0\n            })),\n            exit_code: Some(exit_code),\n            duration_ms: Some(duration_ms),\n            error,\n        };\n\n        self.write_log(\u0026entry);\n    }\n\n    /// Log runner step\n    pub fn log_step(\u0026self, step: \u0026str, message: \u0026str, details: Option\u003cValue\u003e) {\n        let entry = RunnerLogEntry {\n            context: self.context.clone(),\n            level: \"INFO\".to_string(),\n            message: format!(\"[{}] {}\", step.to_uppercase(), message),\n            details,\n            exit_code: None,\n            duration_ms: None,\n            error: None,\n        };\n\n        self.write_log(\u0026entry);\n    }\n\n    /// Log runner error\n    pub fn log_error(\u0026self, step: \u0026str, error: \u0026str, details: Option\u003cValue\u003e) {\n        let entry = RunnerLogEntry {\n            context: self.context.clone(),\n            level: \"ERROR\".to_string(),\n            message: format!(\"[{}] {}\", step.to_uppercase(), error),\n            details,\n            exit_code: None,\n            duration_ms: None,\n            error: Some(error.to_string()),\n        };\n\n        self.write_log(\u0026entry);\n    }\n\n    /// Write log entry to configured destinations\n    fn write_log(\u0026self, entry: \u0026RunnerLogEntry) {\n        // Log to standard logger\n        match entry.level.as_str() {\n            \"DEBUG\" =\u003e debug!(target: \"runner\", \"{}\", entry.message),\n            \"INFO\" =\u003e info!(target: \"runner\", \"{}\", entry.message),\n            \"WARN\" =\u003e warn!(target: \"runner\", \"{}\", entry.message),\n            \"ERROR\" =\u003e error!(target: \"runner\", \"{}\", entry.message),\n            _ =\u003e info!(target: \"runner\", \"{}\", entry.message),\n        }\n\n        // Write to database if enabled\n        if self.config.enable_db_logging {\n            if let Err(e) = self.write_to_db(entry) {\n                warn!(target: \"runner\", \"Failed to write to database: {}\", e);\n            }\n        }\n\n        // Write to file if enabled\n        if self.config.enable_file_logging {\n            if let Err(e) = self.write_to_file(entry) {\n                warn!(target: \"runner\", \"Failed to write to file: {}\", e);\n            }\n        }\n    }\n\n    /// Write log entry to database\n    fn write_to_db(\u0026self, entry: \u0026RunnerLogEntry) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        if let Some(client) = \u0026GLOBAL_CFG.db_client {\n            let db = client.database(\u0026GLOBAL_CFG.org);\n            let collection = db.collection::\u003cmongodb::bson::Bson\u003e(\"runner_logs\");\n\n            let doc = mongodb::bson::to_bson(\u0026entry)?;\n            collection.insert_one(doc).run()?;\n        }\n        Ok(())\n    }\n\n    /// Write log entry to file\n    fn write_to_file(\u0026self, entry: \u0026RunnerLogEntry) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        use std::fs::OpenOptions;\n        use std::io::Write;\n\n        let log_path = self\n            .config\n            .log_file_path\n            .as_ref()\n            .map(|p| p.clone())\n            .unwrap_or_else(|| {\n                PathBuf::from(\u0026GLOBAL_CFG.temp_folder_path)\n                    .join(\"logs\")\n                    .join(format!(\"runner-{}.log\", \u0026self.context.session_id))\n            });\n\n        // Ensure log directory exists\n        if let Some(parent) = log_path.parent() {\n            std::fs::create_dir_all(parent)?;\n        }\n\n        let mut file = OpenOptions::new()\n            .create(true)\n            .append(true)\n            .open(\u0026log_path)?;\n\n        let log_line = format!(\n            \"[{}] [{}] [{}] {}\\n\",\n            chrono::DateTime::from_timestamp(self.context.timestamp as i64, 0)\n                .unwrap_or_default()\n                .format(\"%Y-%m-%d %H:%M:%S\"),\n            entry.level,\n            self.context.runner_type,\n            serde_json::to_string(entry)?\n        );\n\n        file.write_all(log_line.as_bytes())?;\n        file.flush()?;\n\n        Ok(())\n    }\n}\n\nimpl LoggingConfig {\n    fn from_global_config() -\u003e Self {\n        Self {\n            enable_db_logging: GLOBAL_CFG.db_client.is_some(),\n            enable_file_logging: true, // Always enable file logging as fallback\n            log_file_path: None,       // Use default path\n            log_level: LogLevel::Info,\n        }\n    }\n}\n\nimpl LogContext {\n    fn new(runner_type: \u0026str, unit: \u0026Unit, command: \u0026[String]) -\u003e Self {\n        let state_path = unit.get_unit_state_path();\n        let dimensions: HashMap\u003cString, String\u003e = state_path\n            .split('/')\n            .filter_map(|dim| {\n                let parts: Vec\u003c\u0026str\u003e = dim.split(':').collect();\n                if parts.len() == 2 {\n                    Some((parts[0].to_string(), parts[1].to_string()))\n                } else {\n                    None\n                }\n            })\n            .collect();\n\n        let timestamp = std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .unwrap()\n            .as_secs();\n\n        let session_id = format!(\"{}-{}\", unit.get_name(), timestamp);\n\n        Self {\n            runner_type: runner_type.to_string(),\n            unit_name: unit.get_name(),\n            command: command.join(\" \"),\n            state_path,\n            dimensions,\n            timestamp,\n            session_id,\n        }\n    }\n}\n\n/// Extension trait for Unit to provide logging capabilities\npub trait UnitLogging {\n    fn create_logger(\u0026self, runner_type: \u0026str, command: \u0026[String]) -\u003e RunnerLogger;\n}\n\nimpl UnitLogging for Unit {\n    fn create_logger(\u0026self, runner_type: \u0026str, command: \u0026[String]) -\u003e RunnerLogger {\n        RunnerLogger::new(runner_type, self, command)\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","denis","Projects","cubtera","src","core","runner","helm","mod.rs"],"content":"use std::path::PathBuf;\nuse std::process::Command;\nuse log::{debug, info};\nuse super::{Runner, RunnerLoad};\nuse serde_json::Value;\nuse crate::prelude::{read_json_file, ResultExtUnwrap};\nuse crate::tools::compat::LegacyCompat;\n\npub struct HelmRunner {\n    load: RunnerLoad,\n    ctx: Value,\n}\n\nimpl Runner for HelmRunner {\n    fn new(load: RunnerLoad) -\u003e Self {\n        let ctx = Value::Object(serde_json::Map::new());\n        HelmRunner { load, ctx }\n    }\n\n    fn get_load(\u0026self) -\u003e \u0026RunnerLoad {\n        \u0026self.load\n    }\n\n    fn get_ctx(\u0026self) -\u003e \u0026Value {\n        \u0026self.ctx\n    }\n\n    fn get_ctx_mut(\u0026mut self) -\u003e \u0026mut Value {\n        \u0026mut self.ctx\n    }\n\n    fn change_files(\u0026mut self) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        debug!(target: \"helm runner\", \"Generate values yaml from template and dimension's values\");\n\n        // read all files started with dim_ and json extension - using safe error handling\n        let files = LegacyCompat::with_context(\n            std::fs::read_dir(\u0026self.load.unit.temp_folder),\n            \u0026format!(\n                \"Can't read unit temp folder: {:?}\",\n                self.load.unit.temp_folder\n            ))?\n            .filter_map(|entry| entry.ok())\n            .map(|entry| entry.path())\n            .filter(|entry| entry.is_file())\n            .filter(|entry| entry.extension().unwrap_or_default() == \"json\")\n            .filter(|entry| {\n                entry\n                    .file_stem()\n                    .unwrap_or_default()\n                    .to_str()\n                    .unwrap_or_default()\n                    .starts_with(\"cubtera_\")\n            })\n            .collect::\u003cVec\u003cPathBuf\u003e\u003e();\n\n        // for each file read json as value and create list of root keys\n        #[allow(clippy::format_collect)]\n        if !files.is_empty() {\n            // let dim_tf_variables: Value = files\n            //     .iter()\n            //     .filter_map(read_json_file)\n            //     // merge all json values\n            //     .filter_map(|v| {\n            //         if v.is_object() {\n            //             Some(v)\n            //         } else {\n            //             None\n            //         }\n            //     }).collect();\n            // dbg!(\u0026dim_tf_variables);\n            \n            let mut dim_tf_variables = serde_json::Map::new();\n            for file in files.iter().filter_map(read_json_file) {\n                if let Some(obj) = file.as_object() {\n                    for (key, value) in obj {\n                        dim_tf_variables.insert(key.clone(), value.clone());\n                    }\n                }\n            }\n            let all_dims_variables = Value::Object(dim_tf_variables);\n\n            let mut handlebars = handlebars::Handlebars::new();\n            handlebars.set_strict_mode(true);\n            \n            //check template file exists\n            let template_file = self.load.unit.temp_folder.join(\"values.yaml.tpl\");\n            if template_file.exists() {\n                LegacyCompat::with_context(\n                    handlebars.register_template_file(\"values.yaml\", \u0026template_file),\n                    \"Failed to register template file\")?;\n                \n                // render template\n                let rendered = LegacyCompat::with_context(\n                    handlebars.render(\"values.yaml\", \u0026all_dims_variables),\n                    \"Failed to render template\")?;\n\n                // write rendered to file\n                let mut output_file = self.load.unit.temp_folder.clone();\n                output_file.push(\"values.yaml\");\n                LegacyCompat::with_context(\n                    std::fs::write(\u0026output_file, rendered.clone()),\n                    \u0026format!(\n                        \"Failed to write rendered template to file: {:?}\",\n                        output_file\n                    ))?;\n                dbg!(\u0026rendered);\n                \n            } else {\n                info!(target: \"helm runner\", \"Values template file not found: {:?}\", template_file);\n            }\n        }\n        Ok(())\n    }\n\n    fn runner(\u0026mut self) -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n        info!(target: \"helm runner\", \"Run helm command\");\n        \n        let mut child = LegacyCompat::with_context(\n            Command::new(\"helm\")\n                .current_dir(self.load.unit.temp_folder.to_str().unwrap())\n                .args(\u0026self.load.command)\n                .spawn(),\n            \u0026format!(\n                \"Failed to execute helm with args {:?}\", \u0026self.load.command\n            ))?;\n        \n        let result = LegacyCompat::with_context(\n            child.wait(),\n            \"Failed to get helm exitcode\")?;\n        \n        let exit_code = result.code().unwrap_or(-1);\n        \n        // Use the common logger method from Runner trait\n        self.logger(exit_code)?;\n        \n        if !result.success() {\n            return Err(format!(\n                \"Helm command failed with exit code: {}\",\n                exit_code\n            )\n            .into());\n        }\n        \n        Ok(())\n    }\n}\n","traces":[{"line":15,"address":[],"length":0,"stats":{"Line":0}},{"line":16,"addr
