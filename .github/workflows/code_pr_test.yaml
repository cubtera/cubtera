on:
  pull_request:
    branches:
      - main
      - v2-rewrite
    # Deliberately no `paths:` filter (v3, P7): golden/e2e tests assert
    # against `example/**` fixtures (inventory, units, config.toml) without
    # touching any `.rs`/`Cargo.toml` file, so a `paths:` filter here used
    # to let fixture-only regressions merge untested.

permissions:
    contents: write
    pull-requests: write

name: Code changes test
jobs:
  build:
    name: Build and test workspace
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Pre-build install dependencies
        run: |
          sudo apt update
          sudo apt install -y -qq libssl-dev pkg-config

      # `terraform` self-downloads via `tfswitch` (TerraformRunner), so it
      # needs no install step here. `tofu`/`helm` have no such auto-install
      # path - crates/cubtera/tests/e2e_run.rs skips those tests (without
      # failing) when the binary isn't on PATH, so installing them here is
      # what makes the tofu/helm real-execution tests actually run in CI.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-workspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-workspace-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace