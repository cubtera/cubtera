[workspace]
resolver = "2"
members = [
    # v3 crates (see docs/specs/2026-09-03-cubtera-v3-architecture.md)
    "crates/cubtera-kernel",
    "crates/cubtera-model",
    "crates/cubtera-source",
    # v2 crates - retired phase-by-phase as v3 crates replace them
    "crates/cubtera-domain",
    "crates/cubtera-core",
    "crates/cubtera-config",
    "crates/cubtera-persistence",
    "crates/cubtera-runners",
    "crates/cubtera",
    "crates/cubtera-api",
    "crates/cubtera-mcp",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cubtera/cubtera"
authors = ["Cubtera Team"]
description = "Multi-dimensional Infrastructure Manager"

[workspace.dependencies]
# v3 kernel/model (zero I/O, zero async - see docs/specs/2026-09-03-cubtera-v3-architecture.md)
blake3 = "1"
proptest = "1"
semver = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }

# Domain (zero deps)
# (none)

# Domain (canonical hashing for data_sha)
sha2 = "0.10"
# Domain (`.schema:meta.json` validation - pure, no I/O of its own)
jsonschema = "0.37"

# Application
thiserror = "2.0"
async-trait = "0.1"
handlebars = "6"

# Infrastructure
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Persistence adapters
mongodb = "3.8.0"
futures = "0.3"

# Runners
reqwest = { version = "0.13", default-features = false, features = [ "blocking", "json", "rustls" ] }
zip = "8.6.0"
rand = "0.10.2"

# CLI
clap = { version = "4", features = ["derive"] }

# API
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }

# MCP
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"

# Testing
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Internal crates
cubtera-kernel = { path = "crates/cubtera-kernel" }
cubtera-model = { path = "crates/cubtera-model" }
cubtera-source = { path = "crates/cubtera-source" }
cubtera-domain = { path = "crates/cubtera-domain" }
cubtera-core = { path = "crates/cubtera-core" }
cubtera-config = { path = "crates/cubtera-config" }
cubtera-persistence = { path = "crates/cubtera-persistence" }
cubtera-runners = { path = "crates/cubtera-runners" }
