[workspace]
resolver = "2"
members = [
    # v3 crates (see docs/specs/2026-09-03-cubtera-v3-architecture.md)
    "crates/cubtera-kernel",
    "crates/cubtera-model",
    "crates/cubtera-app",
    "crates/cubtera-source",
    "crates/cubtera-store",
    "crates/cubtera-exec",
    "crates/cubtera-identity",
    "crates/cubtera-inventory",
    "crates/cubtera-server",
    # v2 crates - retired phase-by-phase as v3 crates replace them.
    # cubtera-domain/cubtera-core/cubtera-persistence/cubtera-runners/
    # cubtera-api are gone (P7): nothing outside that cluster ever
    # depended on them once `cubtera run`/`plan`/`apply`/`log`/`state`/`im`
    # and the server routes were rewired onto cubtera-app/cubtera-exec/
    # cubtera-inventory/cubtera-store. cubtera-config stays - it's the
    # `config.toml` loader, still used by every v3 entry point.
    "crates/cubtera-config",
    "crates/cubtera",
    "crates/cubtera-mcp",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cubtera/cubtera"
authors = ["Cubtera Team"]
description = "Multi-dimensional Infrastructure Manager"

[workspace.dependencies]
# v3 kernel/model (zero I/O, zero async - see docs/specs/2026-09-03-cubtera-v3-architecture.md)
blake3 = "1"
proptest = "1"
semver = { version = "1.0", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Domain (zero deps)
# (none)

# Domain (canonical hashing for data_sha)
sha2 = "0.10"
# Domain (`.schema:meta.json` validation - pure, no I/O of its own)
jsonschema = "0.37"

# Application
thiserror = "2.0"
async-trait = "0.1"
handlebars = "6"

# Infrastructure
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Runners
reqwest = { version = "0.13", default-features = false, features = [ "blocking", "json", "rustls" ] }
zip = "8.6.0"
rand = "0.10.2"

# CLI
clap = { version = "4", features = ["derive"] }

# API
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# MCP
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1.0"

# Testing
tempfile = "3"
assert_cmd = "2"
predicates = "3"

# Internal crates
cubtera-kernel = { path = "crates/cubtera-kernel" }
cubtera-model = { path = "crates/cubtera-model" }
cubtera-app = { path = "crates/cubtera-app" }
cubtera-source = { path = "crates/cubtera-source" }
cubtera-store = { path = "crates/cubtera-store" }
cubtera-exec = { path = "crates/cubtera-exec" }
cubtera-identity = { path = "crates/cubtera-identity" }
cubtera-inventory = { path = "crates/cubtera-inventory" }
cubtera-config = { path = "crates/cubtera-config" }
